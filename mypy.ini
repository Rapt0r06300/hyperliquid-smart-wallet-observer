; Configuration mypy (IMPROVE-16) — typage statique progressif.
; Usage : pip install mypy && mypy src/hl_observer/backtesting
; NB : mypy n'est pas installé dans l'environnement de dev de Claude ; config prête pour ta machine.

[mypy]
python_version = 3.10
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
ignore_missing_imports = True

; On commence STRICT sur le toolkit quant (pur, sans dépendances), plus souple ailleurs.
[mypy-hl_observer.backtesting.*]
disallow_untyped_defs = False
warn_return_any = True

[mypy-tests.*]
ignore_errors = True
