name: normative-contract-gate

# Current-main hosted proof gate: fail closed on unknown authority.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normative-contract-gate.yml'
      - 'AGENTS.md'
      - 'SECURITY.md'
      - 'CLAUDE.md'
      - 'docs/HYPERSMART_CONSTITUTION.md'
      - 'docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md'
      - 'docs/LOIS_MESUREES.md'
      - 'src/hl_observer/ops/document_authority.py'
      - 'tests/test_document_authority.py'
      - 'tools/check_document_authority.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: normative-contract-gate
  cancel-in-progress: false

jobs:
  document-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      HL_ENABLE_MAINNET_EXECUTION: "0"
      REAL_MAINNET_TRADING: "false"
      HYPERSMART_ENABLE_REAL_ORDERS: "0"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project and test runner
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run fail-closed normative gate
        run: python tools/check_document_authority.py
      - name: Run normative mutation tests
        run: python -m pytest -q tests/test_document_authority.py --tb=short
