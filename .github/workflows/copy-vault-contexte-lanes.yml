name: copy-vault-contexte-lanes

# Contexte leader (positions clearinghouseState + TWAP userTwapSliceFills) par lane multi-IP.
# Positions fraiches -> seed du labo ; TWAP -> anticipation metaorder. Par-user (cap 10/IP) :
# chaque lane suit une tranche disjointe des leaders. PAPER / LECTURE SEULE.

on:
  workflow_dispatch:
    inputs:
      duree_s:
        description: "Duree (s)"
        default: "1500"
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: copy-vault-contexte-lanes
  cancel-in-progress: false

jobs:
  contexte:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      SHARD_COUNT: "4"
    steps:
      - name: Checkout (shallow + sparse)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            src
            tools
            config
          sparse-checkout-cone-mode: true
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Dependance WS
        run: pip install --quiet "websockets>=12,<16"
      - name: Collecte contexte (lane ${{ matrix.shard_index }})
        run: |
          export PYTHONPATH=src
          python -B tools/collecter_contexte_lane.py             --leaders-file config/copy_vault_leaders.json             --shard-count "${SHARD_COUNT}"             --shard-index "${{ matrix.shard_index }}"             --duree-s "${{ github.event.inputs.duree_s || '1500' }}"             --pos-out runtime/data/copy_vault_positions_lane.jsonl             --twap-out runtime/data/copy_vault_twap_lane.jsonl           || true
      - name: Publier
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contexte-shard-${{ matrix.shard_index }}
          path: |
            runtime/data/copy_vault_positions_lane.jsonl
            runtime/data/copy_vault_twap_lane.jsonl
            runtime/data/copy_vault_snapshots_lane.jsonl
            runtime/data/copy_vault_orders_lane.jsonl
          if-no-files-found: ignore
          retention-days: 5
