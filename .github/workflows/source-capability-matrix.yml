name: source-capability-matrix
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"
  push:
    branches: [main]
    paths:
      - "src/hl_observer/sources/**"
      - "src/hl_observer/venues/**"
      - "src/hl_observer/collection/**"
      - "src/hl_observer/realtime/feed_quality.py"
      - "src/hl_observer/data_sources/**"
      - "config/source_rules.yaml"
      - "tools/generate_source_capabilities.py"
      - "tools/probe_source_capabilities.py"
      - "tools/collecter_bbo.py"
      - "tools/collecter_native_venues.py"
      - "tools/validate_source_capabilities.py"
      - "tools/validate_source_rules.py"
      - "tests/test_source_capability_runtime.py"
      - "tests/test_feed_quality_gate.py"
      - "tests/test_bybit_market_data.py"
      - "tests/test_native_venues_collector.py"
      - "tests/test_binance_depth_live.py"
      - ".github/workflows/source-capability-matrix.yml"
env:
  GH_TOKEN: "${{ github.token }}"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  TESTNET_EXECUTION_ENABLED: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

permissions:
  contents: read
concurrency:
  group: source-capability-matrix
  # Runtime evidence is point-in-time; only the newest main SHA matters.
  # Cancelling stale validation runs never touches the persistent collectors.
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install project test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest
      - name: Validate deterministic source contracts
        env:
          PYTHONPATH: src:tools:.
        run: |
          python tools/validate_source_rules.py
          python -m pytest -q             tests/test_source_capability_runtime.py             tests/test_feed_quality_gate.py             tests/test_bybit_market_data.py             tests/test_collector_feed_integrity.py             tests/test_native_venue_transport_integrity.py             tests/test_native_venue_coordinator.py             tests/test_native_venues_collector.py             tests/test_binance_depth_live.py             tests/test_binance_clock_sync.py             tests/test_hyperliquid_clock_sync.py             tests/test_official_archive_backfill.py             --tb=line
      - name: Bounded native venue public-network smoke
        id: native_smoke
        continue-on-error: true
        env:
          PYTHONPATH: src:tools:.
          ALINA_COLLECTOR_VERSION: "${{ github.sha }}"
        run: |
          ROOT="$RUNNER_TEMP/source-capability-native-$GITHUB_RUN_ID"
          echo "SOURCE_CAPABILITY_NATIVE_ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ROOT/data"
          # Reuse the canonical CCXT-scout priority input only for this bounded
          # smoke so active markets are sampled before alphabetical tail assets.
          # This never supplies prices or events; native venue feeds remain authoritative.
          printf '%s\n' '{"native_collection_candidates":["BTC","ETH","SOL","XRP","DOGE"]}'             > "$ROOT/data/ccxt_universe.json"
          python tools/collecter_native_venues.py             --root "$ROOT"             --max-symbols 25             --duration-s 20
      - name: Bounded HL/Binance public-network smoke
        id: bbo_smoke
        continue-on-error: true
        env:
          PYTHONPATH: src:tools:.
          ALINA_COLLECTOR_VERSION: "${{ github.sha }}"
        run: |
          ROOT="$RUNNER_TEMP/source-capability-bbo-$GITHUB_RUN_ID"
          echo "SOURCE_CAPABILITY_BBO_ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ROOT"
          python tools/collecter_bbo.py \
            --root "$ROOT" \
            --coins BTC,ETH \
            --duration-s 12
      - name: Capture GitHub-hosted runtime evidence
        env:
          PYTHONPATH: src:tools:.
        run: |
          python tools/probe_source_capabilities.py \
            --native-heartbeat "$SOURCE_CAPABILITY_NATIVE_ROOT/runtime/data/native_venues_heartbeat.json" \
            --bbo-heartbeat "$SOURCE_CAPABILITY_BBO_ROOT/runtime/data/bbo_heartbeat.json" \
            --output docs/source-capability-runtime.json \
            --github-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID"
      - name: Generate conservative capability matrix
        run: |
          python tools/generate_source_capabilities.py             --runtime-evidence docs/source-capability-runtime.json
      - name: Validate capability matrix
        run: python tools/validate_source_capabilities.py
      - name: Upload runtime evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-capability-${{ github.run_id }}
          path: |
            docs/source-capability-runtime.json
            docs/source-capability-matrix.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish runtime receipt and matrix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/source-capability-runtime.json docs/source-capability-matrix.json
          git diff --cached --quiet && exit 0
          git commit -m "sources: publish github-hosted capability evidence"
          gh auth setup-git
          for attempt in {1..20}; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 1
          done
          echo "Unable to publish runtime evidence after bounded retries" >&2
          exit 1
      - name: Fail closed on collector smoke crashes
        if: always()
        run: |
          status=0
          if [ "${{ steps.native_smoke.outcome }}" = "failure" ]; then
            echo "Native venue collector smoke crashed; runtime evidence was preserved." >&2
            status=1
          fi
          if [ "${{ steps.bbo_smoke.outcome }}" = "failure" ]; then
            echo "HL/Binance collector smoke crashed; runtime evidence was preserved." >&2
            status=1
          fi
          exit "$status"
