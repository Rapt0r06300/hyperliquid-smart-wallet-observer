name: dataset-control-plane-fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/test_workflow_bounds.py'

permissions:
  contents: read

concurrency:
  group: dataset-control-plane-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /tests/test_workflow_bounds.py
      - name: Validate dataset workflow invariants
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_workflow_bounds.py --tb=line
