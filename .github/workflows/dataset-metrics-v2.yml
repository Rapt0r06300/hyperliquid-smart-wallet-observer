name: dataset-metrics-v2
on:
  push:
    branches: [main]
    paths:
      - 'catalog/DATA_INDEX.json'
      - 'catalog/RECORD_COUNT_PATCH.json'
      - 'catalog/TRADE_COUNT_PATCH.json'
      - 'catalog/TRADE_UNIQUE_COUNT_PATCH.json'
      - 'catalog/UNCOMPRESSED_SIZE_PATCH.json'
      - 'tools/build_catalog_metrics.py'
      - 'tools/build_collection_metrics.py'
      - 'tests/test_collection_metrics.py'
      - '.github/workflows/dataset-metrics-v2.yml'
  schedule:
    - cron: '53 * * * *'
  workflow_run:
    workflows: ['resumable-campaign-controller']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dataset-v2-control-plane-index
  cancel-in-progress: false
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: main, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build replay compatibility reasons
        run: python tools/build_replay_compatibility_reasons.py
      - name: Build exact catalog metrics
        run: python tools/build_catalog_metrics.py
      - name: Build instant collection metrics
        run: python tools/build_collection_metrics.py
      - name: Validate dataset policy
        run: |
          python tools/check_dataset_quality.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_dataset_metrics.py tests/test_dataset_policy.py tests/test_collection_metrics.py
      - name: Publish metrics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          published=false
          for attempt in 1 2 3 4 5; do
            # Generated metrics are valid only for the exact DATA_INDEX bytes
            # used to build them. Never rebase an older generated file over a
            # concurrently updated catalog.
            git fetch origin main
            git reset --hard origin/main
            python tools/build_replay_compatibility_reasons.py
            python tools/build_catalog_metrics.py
            python tools/build_collection_metrics.py
            python - <<'PY'
          from tools.build_catalog_metrics import verify_metrics_source
          print(verify_metrics_source())
          PY
            python tools/check_dataset_quality.py
            git add catalog/DATA_METRICS.json catalog/REPLAY_COMPATIBILITY_REASONS.json catalog/COLLECTION_METRICS.json
            if git diff --cached --quiet; then
              echo "Metrics already match the current catalog."
              published=true
              break
            fi
            git commit -m "data: refresh exact dataset metrics"
            if git push origin HEAD:main; then
              published=true
              break
            fi
            echo "Concurrent catalog update; rebuilding metrics from latest main (attempt $attempt)."
            sleep $((attempt * 2))
          done
          [ "$published" = true ] || {
            echo "::error::Exact catalog metrics were not durably published"
            exit 1
          }

