name: phase-request-controller
on:
  push:
    branches: [main]
    paths:
      - "control/phase-requests/**"
      - "tools/apply_phase_requests.py"
      - "tools/seal_collection_cutoff.py"
      - "tools/set_phase.py"
      - ".github/workflows/phase-request-controller.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: control-phase
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Sync canonical authority
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
      - name: Apply unapplied durable requests
        run: python tools/apply_phase_requests.py
      - name: Publish authority and transition receipts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/alina-phase.json
          if [ -d control/phase-receipts ]; then git add control/phase-receipts; fi
          if [ -d catalog/campaigns ]; then git add catalog/campaigns; fi
          if ! git diff --cached --quiet; then
            git commit -m "control: apply durable phase requests"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi
      - name: Materialize phase-owned campaigns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_with_retry() {
            workflow="$1"
            for attempt in 1 2 3 4 5 6; do
              set +e
              output="$(gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              printf '%s\n' "$output" >&2
              if printf '%s' "$output" | grep -Eqi 'rate limit|HTTP 403|secondary rate|temporar|timeout|502|503|504'; then
                if [ "$attempt" -lt 6 ]; then
                  delay="$((5 * attempt * attempt))"
                  [ "$delay" -le 60 ] || delay=60
                  sleep "$delay"
                  continue
                fi
                echo "::warning::$workflow dispatch deferred; scheduled workflow remains the durable fallback."
                return 0
              fi
              return "$rc"
            done
          }
          dispatch_with_retry create-resumable-campaigns.yml
          dispatch_with_retry resumable-campaign-controller.yml
