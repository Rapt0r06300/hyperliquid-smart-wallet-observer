name: phase-request-controller
on:
  push:
    branches: [main]
    paths:
      - "control/phase-requests/**"
      - "tools/apply_phase_requests.py"
      - "tools/seal_collection_cutoff.py"
      - "tools/set_phase.py"
      - ".github/workflows/phase-request-controller.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: control-phase
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Sync canonical authority
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
      - name: Apply unapplied durable requests
        run: python tools/apply_phase_requests.py
      - name: Publish authority and transition receipts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/alina-phase.json control/phase-receipts catalog/campaigns
          if ! git diff --cached --quiet; then
            git commit -m "control: apply durable phase requests"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
          fi
      - name: Materialize phase-owned campaigns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run create-resumable-campaigns.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run resumable-campaign-controller.yml --repo "$GITHUB_REPOSITORY" --ref main
