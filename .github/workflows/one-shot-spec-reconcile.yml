name: One-shot canonical spec reconcile
on:
  push:
    paths: ['.github/workflows/one-shot-spec-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - name: Reconcile and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SPEC='docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md'
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/git/blobs/146a0c986df0b8875a6a7bc1126f3ae484238d51" > /tmp/old.md
          grep -q 'NEW-DEFECT-450' /tmp/old.md
          python -c "from pathlib import Path; import re; p=Path('$SPEC'); cur=p.read_text(encoding='utf-8'); old=Path('/tmp/old.md').read_text(encoding='utf-8'); pat=r'NEW-DEFECT-([0-9]{3})'; oldids={int(x) for x in re.findall(pat,old)}; assert set(range(1,451))<=oldids; present={int(x) for x in re.findall(pat,cur)} & set(range(1,451)); n=next((i for i in range(1,451) if i not in present),451); assert present==set(range(1,n)), ('non-prefix catalog',sorted(present)[:20],n); pos=old.index(f'NEW-DEFECT-{n:03d}'); h=old.rfind(chr(10)+'## ',0,pos); assert h>=0; block=old[h:].strip(); guard='## Canonical reconciliation guard — source completeness contract (2026-09-27)'+chr(10)*2+'This section is normative. Future canonical-spec edits must preserve the union of still-applicable historical requirements, the complete audited defect catalog, the interrupted Work reconciliation, and the final Work closure hardening. Oversized-write recovery must never restore an older snapshot that discards newer requirements.'+chr(10)*2+'Acceptance: NEW-DEFECT-001..450 must each exist exactly once; Work carry-over, Alina-main/Dataset-V2 dual-plane ownership, phase/epoch, exactly-once publication, SAFE-to-economic-proof closure, immutable OOS/forward identity, environment provenance, fresh-runner recovery, paper/read-only, no-self-hosted and no-PC-cloud-dependency contracts must remain explicit. If completeness cannot be proven, roadmap completeness is UNMEASURABLE.'+chr(10); p.write_text(cur.rstrip()+chr(10)*2+block+chr(10)*2+guard,encoding='utf-8'); print('restored',n,'through 450')"
          python -c "from pathlib import Path; import re; s=Path('$SPEC').read_text(encoding='utf-8'); ids=[int(x) for x in re.findall(r'NEW-DEFECT-([0-9]{3})',s)]; bad=[i for i in range(1,451) if ids.count(i)!=1]; assert not bad,bad[:20]; req=['Normative closure hardening — final consolidated contracts','Dataset V2','GitHub-hosted','paper/read-only','Canonical reconciliation guard — source completeness contract']; miss=[x for x in req if x not in s]; assert not miss,miss; print('VERIFIED 001..450 exactly once; bytes',len(s.encode()))"
          rm .github/workflows/one-shot-spec-reconcile.yml
          git diff --check
          git add "$SPEC" .github/workflows/one-shot-spec-reconcile.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(spec): restore complete audited roadmap'
          git push origin HEAD:main
