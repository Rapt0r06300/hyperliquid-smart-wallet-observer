name: One-shot canonical spec reconcile
on:
  push:
    paths: ['.github/workflows/one-shot-spec-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile and verify
        shell: bash
        run: |
          set -euo pipefail
          SPEC='docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md'
          RAW='https://raw.githubusercontent.com/Rapt0r06300/hyperliquid-smart-wallet-observer/6764957316a0eb15ee11ef8286e3de44602cfa55/docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md'
          curl --fail --location --retry 3 "$RAW" -o /tmp/old.md
          grep -q 'NEW-DEFECT-450' /tmp/old.md
          python -c "from pathlib import Path; import re; p=Path('$SPEC'); cur=p.read_text(encoding='utf-8'); old=Path('/tmp/old.md').read_text(encoding='utf-8'); oldids={int(x) for x in re.findall(r'NEW-DEFECT-(\\d{3})',old)}; assert set(range(1,451))<=oldids, sorted(set(range(1,451))-oldids)[:20]; present={int(x) for x in re.findall(r'NEW-DEFECT-(\\d{3})',cur)}; assert not (present & set(range(1,451))), sorted(present & set(range(1,451)))[:20]; pos=old.index('NEW-DEFECT-001'); h=old.rfind('\\n## ',0,pos); assert h>=0; block=old[h:].strip(); guard='## Canonical reconciliation guard — source completeness contract (2026-09-27)\\n\\nThis section is normative. Future canonical-spec edits must preserve the union of still-applicable historical requirements, the complete audited defect catalog, the interrupted Work reconciliation, and the final Work closure hardening. Oversized-write recovery must never restore an older snapshot that discards newer requirements.\\n\\nAcceptance: `NEW-DEFECT-001..450` must each exist exactly once; Work carry-over, Alina-main/Dataset-V2 dual-plane ownership, phase/epoch, exactly-once publication, SAFE-to-economic-proof closure, immutable OOS/forward identity, environment provenance, fresh-runner recovery, paper/read-only, no-self-hosted and no-PC-cloud-dependency contracts must remain explicit. If completeness cannot be proven, roadmap completeness is `UNMEASURABLE`.\\n'; p.write_text(cur.rstrip()+'\\n\\n'+block+'\\n\\n'+guard,encoding='utf-8')"
          python -c "from pathlib import Path; import re; s=Path('$SPEC').read_text(encoding='utf-8'); ids=[int(x) for x in re.findall(r'NEW-DEFECT-(\\d{3})',s)]; bad=[i for i in range(1,451) if ids.count(i)!=1]; assert not bad,bad[:20]; req=['Normative closure hardening — final consolidated contracts','Dataset V2','GitHub-hosted','paper/read-only','Canonical reconciliation guard — source completeness contract']; miss=[x for x in req if x not in s]; assert not miss,miss; print('VERIFIED: NEW-DEFECT-001..450 exactly once; closure markers present; bytes',len(s.encode()))"
          rm .github/workflows/one-shot-spec-reconcile.yml
          git diff --check
          git add "$SPEC" .github/workflows/one-shot-spec-reconcile.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(spec): restore complete audited roadmap'
          git push origin HEAD:main
