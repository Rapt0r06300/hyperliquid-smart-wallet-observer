name: One-shot canonical spec reconcile
on:
  push:
    paths: ['.github/workflows/one-shot-spec-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile via GitHub API and self-delete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SPEC='docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md'
          WF='.github/workflows/one-shot-spec-reconcile.yml'
          CUR_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${SPEC}?ref=main" --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/contents/${SPEC}?ref=main" --jq .content | base64 -d > /tmp/current.md
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/146a0c986df0b8875a6a7bc1126f3ae484238d51" --jq .content | base64 -d > /tmp/old.md
          python -c "from pathlib import Path; p=Path('/tmp/current.md'); cur=p.read_text(encoding='utf-8'); old=Path('/tmp/old.md').read_text(encoding='utf-8'); assert 'NEW-DEFECT-001' in cur and 'NEW-DEFECT-050' in cur; assert 'NEW-DEFECT-051' not in cur and 'NEW-DEFECT-450' not in cur; pos=old.index('NEW-DEFECT-051'); h=old.rfind(chr(10)+'## ',0,pos); assert h>=0; block=old[h:].strip(); guard='## Canonical reconciliation guard — source completeness contract (2026-09-27)'+chr(10)*2+'This section is normative. Future canonical-spec edits must preserve the complete audited defect catalog, the interrupted Work reconciliation, the final Work closure hardening, Alina-main/Dataset-V2 ownership, paper/read-only safety, and all stricter fail-closed contracts. Oversized-write recovery must never restore an older snapshot that discards newer requirements. Completeness that cannot be proven is UNMEASURABLE.'+chr(10); p.write_text(cur.rstrip()+chr(10)*2+block+chr(10)*2+guard,encoding='utf-8')"
          python -c "from pathlib import Path; import re; s=Path('/tmp/current.md').read_text(encoding='utf-8'); ids=[int(x) for x in re.findall(r'NEW-DEFECT-([0-9]{3})',s)]; bad=[i for i in range(1,451) if ids.count(i)!=1]; assert not bad,bad[:20]; req=['Normative closure hardening — final consolidated contracts','Dataset V2','GitHub-hosted','paper/read-only','Canonical reconciliation guard — source completeness contract']; miss=[x for x in req if x not in s]; assert not miss,miss; print('VERIFIED 001..450 exactly once and closure markers present')"
          CONTENT=$(base64 -w0 /tmp/current.md)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${SPEC}" -f message='docs(spec): restore complete audited roadmap' -f content="$CONTENT" -f sha="$CUR_SHA" -f branch=main >/tmp/put.json
          WF_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${WF}?ref=main" --jq .sha)
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${WF}" -f message='chore: remove one-shot spec reconciler' -f sha="$WF_SHA" -f branch=main >/tmp/delete.json
          echo 'DONE'
