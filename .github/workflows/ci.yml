name: hypersmart-ci

# CI HyperSmart — paper/read-only. Aucun secret, aucune execution externe.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hypersmart-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NO_COLOR: "1"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"

jobs:
  securite:
    name: Securite et imports runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Imports du runtime canonique
        run: |
          python - <<'PY'
          import importlib
          modules = [
              "hl_observer.market_truth",
              "hl_observer.market_truth.pipeline",
              "hl_observer.normalization.market_events",
              "hl_observer.collection.tick_dataset",
              "hl_observer.realtime.feed_quality",
              "hl_observer.runtime.protections",
              "hl_observer.following.wallet_reconstruction",
              "hl_observer.following.wallet_scoring_shortlist",
              "hl_observer.following.fills_sources",
              "hl_observer.ops.global_observer_pipeline",
              "hl_observer.ops.economic_revalidation",
              "hl_observer.ops.episode_capacity",
              "hl_observer.ops.historical_analysis_suite",
          ]
          for m in modules:
              importlib.import_module(m)
          print("imports runtime ok :", len(modules))
          PY
      - name: Tests de securite (aucun ordre reel)
        run: |
          python -m pytest -q --junitxml=junit-securite.xml \
            tests/test_no_real_trade_foundations.py \
            tests/test_safety_audit.py \
            tests/test_runtime_protections.py
      - name: Audits de securite CLI
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety
      - name: Partition des shards valide
        run: python tools/ci_shard.py 1 6 --verifier
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: junit-securite
          path: junit-*.xml
          if-no-files-found: ignore

  tests-linux:
    name: Tests Linux (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    needs: securite
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt
      - name: pytest shard ${{ matrix.shard }}/6
        run: |
          FICHIERS=$(python tools/ci_shard.py ${{ matrix.shard }} 6)
          if [ -z "$FICHIERS" ]; then echo "shard vide"; exit 0; fi
          python -m pytest -q -p no:cacheprovider \
            --junitxml=junit-shard-${{ matrix.shard }}.xml $FICHIERS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: junit-linux-shard-${{ matrix.shard }}
          path: junit-*.xml
          if-no-files-found: ignore

  tests-windows:
    name: Tests Windows (critiques)
    runs-on: windows-latest
    needs: securite
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependances fail-closed
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests critiques Windows
        shell: pwsh
        env:
          PYTHONPATH: src;tools
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-windows.xml `
            tests/test_no_real_trade_foundations.py `
            tests/test_safety_audit.py `
            tests/test_runtime_protections.py `
            tests/test_market_truth_pipeline.py `
            tests/test_market_truth_replay_stage.py `
            tests/test_forward_causal_parity_bloc17.py `
            tests/test_economic_revalidation_bloc18.py `
            tests/test_episode_capacity.py `
            tests/test_wallet_reconstruction.py `
            tests/test_wallet_scoring_shortlist.py `
            tests/test_fills_sources.py `
            tests/test_global_observer_pipeline.py `
            tests/test_hypersmart_single_launcher.py `
            tests/test_launcher_unifie.py `
            tests/test_historical_analysis_launcher.py `
            tests/test_superviseur_profil_harvest.py `
            tests/test_preflight_lanceur.py `
            tests/test_preuve_de_vie.py `
            tests/test_registre_pids.py `
            tests/test_process_scope_final.py `
            tests/test_status_get_is_pure_read_only.py `
            tests/test_e2e_lanceur_harvest.py `
            tests/test_portabilite.py `
            tests/test_archive_portable.py `
            tests/test_creer_archive_cmd.py `
            tests/test_premier_lancement.py `
            tests/test_portabilite_racine.py `
            tests/test_audit_portabilite.py `
            tests/test_wheelhouse_lock.py `
            tests/test_portable_runtime.py
      - name: Audits de securite (Windows)
        shell: pwsh
        env:
          PYTHONPATH: src;tools
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: junit-windows
          path: junit-*.xml
          if-no-files-found: ignore

  runtime-replay:
    name: Runtime replay = forward
    runs-on: ubuntu-latest
    needs: securite
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Preuves replay = forward (pipeline canonique, producer/consumer, parite causale)
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-runtime-replay.xml \
            tests/test_paper_pipeline_e2e.py \
            tests/test_producer_consumer.py \
            tests/test_market_truth_replay_stage.py \
            tests/test_forward_causal_parity_bloc17.py \
            tests/test_batch_e.py
      - name: Meta-cablage pepites 201-300
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-mega-cablage.xml \
            tests/test_mega_cablage_e2e_raw_to_pnl.py \
            tests/test_mega_cablage_integration.py \
            tests/test_mega_cablage_cross_venue_paper_stage.py \
            tests/test_mega_cablage_feed_adapter.py \
            tests/test_mega_cablage_runner.py \
            tests/test_mega_cablage_replay_driver.py \
            tests/test_mega_cablage_real_logs_report.py \
            tests/test_mega_cablage_lead_lag_stage.py
      - name: Laboratoire alpha
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-lab.xml \
            tests/test_lab_alpha_e2e.py \
            tests/test_lab_inventaire.py \
            tests/test_lab_audit.py \
            tests/test_lab_metriques.py \
            tests/test_lab_recherche.py \
            tests/test_lab_adverse_reel.py \
            tests/test_lab_flux.py \
            tests/test_lab_session_scope.py \
            tests/test_analyser_cmd_hardening.py \
            tests/test_recette_windows_e2e.py \
            tests/test_catalogue_integrite.py \
            tests/test_lancer_cmd_hardening.py \
            tests/test_lab_verrou_taxonomie.py \
            tests/test_verrou_lanceur.py \
            tests/test_episodes_indivisibles.py \
            tests/test_rafraichisseur.py \
            tests/test_lead_lag_paper.py \
            tests/test_lab_eta.py \
            tests/test_lab_rapport.py
      - name: Portabilite - audit repo-complet (gate bloquant)
        run: PYTHONPATH=src:tools python -m audit_portabilite
      - name: Portabilite (archive, premier lancement, racine sans cwd, audit, wheelhouse, runtime portable)
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-portabilite.xml \
            tests/test_portabilite.py \
            tests/test_archive_portable.py \
            tests/test_creer_archive_cmd.py \
            tests/test_premier_lancement.py \
            tests/test_portabilite_racine.py \
            tests/test_audit_portabilite.py \
            tests/test_wheelhouse_lock.py \
            tests/test_portable_runtime.py \
            tests/test_portabilite_multichemin.py \
            tests/test_inventaire_release.py \
            tests/test_release_ready.py \
            tests/test_budget_ram.py
      - name: Lanceur HARVEST
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-lanceur.xml \
            tests/test_superviseur_profil_harvest.py \
            tests/test_preflight_lanceur.py \
            tests/test_preuve_de_vie.py \
            tests/test_preuve_de_vie_niveaux.py \
            tests/test_preuve_de_vie_metriques_disque.py \
            tests/test_preuve_de_vie_barriere.py \
            tests/test_registre_pids.py \
            tests/test_quota_stockage.py \
            tests/test_stockage_brut_borne.py \
            tests/test_tableau_sante_collecteurs.py \
            tests/test_moniteur_sante.py \
            tests/test_session_catalog.py \
            tests/test_session_harvest.py \
            tests/test_analyser_session.py \
            tests/test_e2e_chaine_session_analyser.py \
            tests/test_e2e_lanceur_harvest.py \
            tests/test_collecter_dydx_live.py \
            tests/dydx_v4/test_persistance_flux_live.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: junit-runtime-replay
          path: junit-*.xml
          if-no-files-found: ignore
