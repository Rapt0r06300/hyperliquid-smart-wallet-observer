name: hypersmart-ci

# CI HyperSmart — paper/read-only. AUCUN secret n'est requis : rien ici ne touche a un compte,
# a une cle ou a un endpoint d'execution.
#
# Ce fichier remplace l'ancien "dYdX Observer CI", qui ne compilait que le paquet LEGACY
# `hyper_smart_observer` et lancait `pytest -q` (6 383 tests) sous un timeout de 15 minutes :
# il ne testait pas le runtime reel (`src/hl_observer`) et ne pouvait pas finir a temps.
# Les tests ne sont pas desactives, ils sont SHARDES (tools/ci_shard.py garantit une partition).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Pas de paths-ignore : un commit sur main doit TOUJOURS produire un statut.

concurrency:
  group: hypersmart-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # Verrous de securite : aucune execution possible meme si un test l'oubliait.
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"

jobs:
  # ── 1. Barriere rapide : securite + imports du runtime reel. Echoue vite si quelque chose casse.
  securite:
    name: Securite et imports runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e . || echo "install editable non bloquante : les tests tournent via PYTHONPATH"
      - name: Imports du runtime canonique
        run: |
          python - <<'PY'
          import importlib
          modules = [
              "hl_observer.market_truth",
              "hl_observer.market_truth.pipeline",
              "hl_observer.normalization.market_events",
              "hl_observer.collection.tick_dataset",
              "hl_observer.realtime.feed_quality",
              "hl_observer.runtime.protections",
              "hl_observer.following.wallet_reconstruction",
              "hl_observer.following.wallet_scoring_shortlist",
              "hl_observer.following.fills_sources",
              "hl_observer.ops.global_observer_pipeline",
              "hl_observer.ops.economic_revalidation",
              "hl_observer.ops.episode_capacity",
              "hl_observer.ops.historical_analysis_suite",
          ]
          for m in modules:
              importlib.import_module(m)
          print("imports runtime ok :", len(modules))
          PY
      - name: Tests de securite (aucun ordre reel)
        run: |
          python -m pytest -q --junitxml=junit-securite.xml \
            tests/test_no_real_trade_foundations.py \
            tests/test_safety_audit.py \
            tests/test_runtime_protections.py
      - name: Audits de securite CLI
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety
      - name: Partition des shards valide
        run: python tools/ci_shard.py 1 6 --verifier
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-securite
          path: junit-*.xml
          if-no-files-found: ignore

  # ── 2. Suite complete SHARDEE : aucun test desactive, chaque shard tient dans son budget.
  tests-linux:
    name: Tests Linux (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    needs: securite
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e . || echo "install editable non bloquante"
          python -m pip install -r requirements-recherche.txt || echo "optuna/cmaes absents : tests d'indisponibilite honnete"
      - name: pytest shard ${{ matrix.shard }}/6
        run: |
          FICHIERS=$(python tools/ci_shard.py ${{ matrix.shard }} 6)
          if [ -z "$FICHIERS" ]; then echo "shard vide"; exit 0; fi
          python -m pytest -q -p no:cacheprovider \
            --junitxml=junit-shard-${{ matrix.shard }}.xml $FICHIERS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-linux-shard-${{ matrix.shard }}
          path: junit-*.xml
          if-no-files-found: ignore

  # ── 3. Windows : la verite du projet. Sous-ensemble critique + audits, sur le vrai OS cible.
  tests-windows:
    name: Tests Windows (critiques)
    runs-on: windows-latest
    needs: securite
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependances
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { echo "install editable non bloquante" }
      - name: Tests critiques Windows
        shell: pwsh
        env:
          PYTHONPATH: src;tools
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-windows.xml `
            tests/test_no_real_trade_foundations.py `
            tests/test_safety_audit.py `
            tests/test_runtime_protections.py `
            tests/test_market_truth_pipeline.py `
            tests/test_market_truth_replay_stage.py `
            tests/test_forward_causal_parity_bloc17.py `
            tests/test_economic_revalidation_bloc18.py `
            tests/test_episode_capacity.py `
            tests/test_wallet_reconstruction.py `
            tests/test_wallet_scoring_shortlist.py `
            tests/test_fills_sources.py `
            tests/test_global_observer_pipeline.py `
            tests/test_hypersmart_single_launcher.py `
            tests/test_launcher_unifie.py `
            tests/test_historical_analysis_launcher.py
      - name: Audits de securite (Windows)
        shell: pwsh
        env:
          PYTHONPATH: src;tools
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-windows
          path: junit-*.xml
          if-no-files-found: ignore
