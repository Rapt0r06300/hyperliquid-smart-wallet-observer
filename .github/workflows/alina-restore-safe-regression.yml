name: Alina SAFE restore regression

on:
  push:
    branches: [main]
    paths:
      - tools/restore_alina.py
      - tests/test_restore_alina.py
      - .github/workflows/alina-restore-safe-regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alina-restore-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-safety:
    name: Verify SAFE-only restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run deterministic restore tests
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_restore_alina.py
