name: Alina SAFE restore regression

on:
  schedule:
    - cron: '47 19 * * *'
  push:
    branches: [main]
    paths:
      - Alina-restore.cmd
      - RESTORE_ALINA.cmd
      - tools/restore_alina.py
      - tools/sync_complete_clone.py
      - ALINA_SYNC_COMPLETE.cmd
      - ALINA_SYNC_COMPLETE.sh
      - README.md
      - docs/DISASTER_RECOVERY.md
      - tests/test_restore_alina.py
      - tests/test_restore_alina_launcher.py
      - tests/test_sync_complete_clone.py
      - tests/test_push_github_safe_contract.py
      - tools/push_github_safe.ps1
      - POUSSER-GITHUB-FORCE.cmd
      - POUSSER_TOUT_LE_TRAVAIL.cmd
      - REPARER_ET_POUSSER.cmd
      - tests/test_check_clone_payload_completeness.py
      - tools/check_clone_payload_completeness.py
      - tests/test_native_trade_batch_split.py
      - tests/test_quarantine_audit.py
      - tools/build_quarantine_audit.py
      - tools/repair_stale_safe_classifications.py
      - tests/test_repair_stale_safe_partition.py
      - tools/backfill_replay_compatibility.py
      - tools/index_run_manifest.py
      - tools/check_dataset_quality.py
      - tools/measure_uncompressed_sizes.py
      - tests/test_measure_uncompressed_partition.py
      - tools/backfill_exact_trade_counts.py
      - tools/backfill_global_unique_trade_counts.py
      - src/hl_observer/datasets/v2_repository.py
      - tests/test_run_indexing.py
      - tests/test_v2_dataset_repository.py
      - tests/test_backfill_replay_compatibility_candidates.py
      - src/hl_observer/collection/native_market_tape.py
      - src/hl_observer/collection/native_venue_coordinator.py
      - .github/workflows/alina-restore-safe-regression.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: alina-restore-regression-${{ github.ref }}
  # Keep an already-running validation despite rapid main pushes.
  cancel-in-progress: false

jobs:
  fresh-clone-contract:
    name: Clone complete bot worktree and exercise ALINA_SYNC_COMPLETE
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Perform a real normal clone and verify complete Git objects
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --branch main --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/alina-fresh-clone"
          cd "$RUNNER_TEMP/alina-fresh-clone"
          test "$(git branch --show-current)" = main
          git cat-file -e "${GITHUB_SHA}^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git fsck --full
          test -z "$(git status --porcelain)"
      - name: Exercise the one-file SAFE restore launcher from the fresh clone
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/alina-fresh-clone"
          bash ALINA_SYNC_COMPLETE.sh --skip-update --catalog-budget \
            > "$RUNNER_TEMP/ALINA_CATALOG_BUDGET.json"
          python - "$RUNNER_TEMP/ALINA_CATALOG_BUDGET.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["status"] == "CATALOG_ONLY_NOT_RESTORED"
          assert report["replay_selected_shards"] > 0
          assert report["replay_selected_release_assets"] > 0
          assert report["selected_release_asset_sizes_sha_bound"] is True
          print("ALINA_FRESH_NORMAL_CLONE_CONTRACT_OK")
          PY

  restore-safety:
    name: Verify SAFE-only restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # Keep the SHA-bound catalog and test code, but exclude massive
          # unrelated runtime/archive/data trees from this read-only job.
          sparse-checkout: |
            .github/workflows
            catalog
            src
            tools
            tests
            ALINA_SYNC_COMPLETE.cmd
            ALINA_SYNC_COMPLETE.sh
            README.md
            docs/DISASTER_RECOVERY.md
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove clone SAFE budget and remote preflight
        run: |
          set -euo pipefail
          python -m py_compile tools/sync_complete_clone.py tools/restore_alina.py
          python tools/sync_complete_clone.py --catalog-budget | tee "$RUNNER_TEMP/alina-safe-catalog-budget.json"
          set +e
          python tools/restore_alina.py \
            --replay-ready \
            --preflight-only \
            --max-download-gib 0 \
            --destination "$RUNNER_TEMP/alina-safe-clone-preflight" | \
            tee "$RUNNER_TEMP/alina-safe-clone-preflight.json"
          PREFLIGHT_EXIT=${PIPESTATUS[0]}
          set -e
          python - "$RUNNER_TEMP/alina-safe-clone-preflight/RESTORE_PREFLIGHT.json" "$RUNNER_TEMP/alina-safe-catalog-budget.json" "$PREFLIGHT_EXIT" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          with open(sys.argv[2], encoding="utf-8") as stream:
              budget = json.load(stream)
          code = int(sys.argv[3])
          if code != 3 or report.get("status") != "PREFLIGHT_DOWNLOAD_BUDGET_EXCEEDED":
              raise SystemExit(f"unexpected preflight result: exit={code} status={report.get('status')}")
          # The preflight describes Release bytes/disk; shard counts belong
          # exclusively to the SHA-bound catalog budget, not this report.
          if int(budget.get("replay_selected_shards") or 0) <= 0:
              raise SystemExit("catalog selected no SAFE/replayable shards")
          if int(budget.get("replay_selected_release_assets") or 0) <= 0:
              raise SystemExit("catalog selected no SAFE Release assets")
          if int(report.get("unverified_source_asset_count") or 0) != 0:
              raise SystemExit("preflight selected unverifiable Release assets")
          if int(report.get("source_asset_bytes") or 0) < int(budget.get("replay_selected_release_download_bytes") or 0):
              raise SystemExit("preflight source inventory does not cover catalog SAFE assets")
          if int(report.get("pending_download_bytes") or 0) <= 0:
              raise SystemExit("preflight has no measurable SAFE download budget")
          if int(report.get("pending_materialization_bytes") or 0) <= 0:
              raise SystemExit("preflight has no measurable SAFE materialization budget")
          print("ALINA_SAFE_CLONE_PREFLIGHT_VERIFIED")
          PY
      - name: Preserve SHA-bound SAFE catalog and remote preflight evidence\n        if: always()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n        with:\n          name: alina-safe-download-preflight-${{ github.run_id }}\n          path: |\n            ${{ runner.temp }}/alina-safe-catalog-budget.json\n            ${{ runner.temp }}/alina-safe-clone-preflight/RESTORE_PREFLIGHT.json\n          if-no-files-found: warn\n          retention-days: 30\n      - name: Verify real historical SAFE asset download and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import tempfile
          from pathlib import Path
          from tools.restore_alina import _json, _list_release_assets, _download_to_path, _expected_digest
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          tag = "archive-v2-35707914210-binance-ETH"
          name = "binance-usdm-official-archive-trades-ethusdt-1789776000003-1789796291633-6c8e3c4b4a17.jsonl.gz"
          release = _json(f"https://api.github.com/repos/{repo}/releases/tags/{tag}", token=token)
          assert release["tag_name"] == tag
          assets = _list_release_assets(repo, release["id"], token=token)
          matches = [a for a in assets if a["name"] == name]
          assert len(matches) == 1
          asset = matches[0]
          assert asset["state"] == "uploaded" and asset["size"] == 14769267
          assert _expected_digest(asset) == "6c8e3c4b4a170ac7723a83cddcaabd5d270b8b060a7147e5d2c4a4519712bc54"
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / name
              size, digest = _download_to_path(asset["browser_download_url"], path, token=token, max_bytes=asset["size"])
              assert size == asset["size"] and digest == _expected_digest(asset)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
              verified_prefix = path.read_bytes()[:min(1024 * 1024, size // 2)]
          import json
          from datetime import datetime, timezone
          receipt = {
              "schema": "alina.safe_sample_restore.v1",
              "status": "SAMPLE_VERIFIED_NOT_FULL_DATASET",
              "git_sha": os.environ["GITHUB_SHA"],
              "repository": repo,
              "release_tag": tag,
              "asset_name": name,
              "asset_id": asset["id"],
              "bytes": size,
              "sha256": digest,
              "verified_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path(os.environ["RUNNER_TEMP"], "SAFE_SAMPLE_RESTORE_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          # Use a byte-identical prefix so either HTTP 206 resume or HTTP 200
          # restart is valid, with full SHA-256 verification in both cases.
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / name
              prefix_length = min(1024 * 1024, size // 2)
              path.write_bytes(verified_prefix)
              assert path.stat().st_size == prefix_length
              resumed_size, resumed_digest = _download_to_path(
                  asset["browser_download_url"], path, token=token, max_bytes=asset["size"]
              )
              assert resumed_size == asset["size"] and resumed_digest == digest
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          print("HISTORICAL_SAFE_ASSET_RESTART_VERIFIED", resumed_size, resumed_digest)
          print("HISTORICAL_SAFE_ASSET_RESTORED_VERIFIED", size, digest)
          PY
      - name: Verify SAFE sample receipt schema and SHA binding
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          receipt_path = Path(os.environ["RUNNER_TEMP"]) / "SAFE_SAMPLE_RESTORE_RECEIPT.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          assert receipt["schema"] == "alina.safe_sample_restore.v1"
          assert receipt["status"] == "SAMPLE_VERIFIED_NOT_FULL_DATASET"
          assert receipt["git_sha"] == os.environ["GITHUB_SHA"]
          assert receipt["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert receipt["bytes"] == 14769267
          assert receipt["sha256"] == "6c8e3c4b4a170ac7723a83cddcaabd5d270b8b060a7147e5d2c4a4519712bc54"
          assert isinstance(receipt["asset_id"], int) and receipt["asset_id"] > 0
          assert receipt["release_tag"] == "archive-v2-35707914210-binance-ETH"
          assert receipt["asset_name"].endswith(".jsonl.gz")
          print("SAFE_SAMPLE_RECEIPT_SCHEMA_VERIFIED", hashlib.sha256(receipt_path.read_bytes()).hexdigest())
          PY
      - name: Verify bounded multi-venue SAFE shards against Release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import tempfile
          import zipfile
          from pathlib import Path
          from urllib.parse import quote
          from tools.restore_alina import (
              _download_to_path, _expected_digest, _json,
              _list_release_assets, _load_replay_ready_plan,
          )

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          _, proof, rows, required = _load_replay_ready_plan(
              Path("catalog/DATA_INDEX.json"), Path("catalog/DATA_METRICS.json")
          )
          venues = ("binance", "bybit", "okx", "gate", "bitget", "hyperliquid")
          limit = 128 * 1024 * 1024
          candidates = {}
          for row in rows:
              venue = str(row.get("venue") or "").lower()
              if venue not in venues:
                  continue
              tag = str(row["release_tag"])
              name = str(row.get("release_container_asset") or row["release_asset"])
              size, digest = required[(tag, name)]
              # Bound both the network transfer and decompressed ZIP member.
              member_size = row["bytes"]
              if size <= 0 or size > limit or member_size <= 0 or member_size > limit:
                  continue
              ordering = (size, tag, name, str(row["dataset_id"]))
              previous = candidates.get(venue)
              if previous is None or ordering < previous[0]:
                  candidates[venue] = (ordering, row, digest)
          if len(candidates) < 3:
              raise SystemExit("SAFE_MULTI_VENUE_SAMPLE_INSUFFICIENT_BOUNDED_CANDIDATES")
          # Only sample the actual catalog. A missing venue is reported, never
          # presented as SHA-verified. Keep each transfer bounded independently.
          verified = []
          for venue in venues:
              if venue not in candidates:
                  continue
              ordering, row, expected_sha = candidates[venue]
              size, tag, name, _dataset_id = ordering
              release = _json(
                  f"https://api.github.com/repos/{repository}/releases/tags/{quote(tag, safe='')}",
                  token=token,
              )
              if release.get("tag_name") != tag:
                  raise SystemExit("SAFE_SAMPLE_RELEASE_TAG_MISMATCH")
              assets = _list_release_assets(repository, release["id"], token=token)
              matching = [asset for asset in assets if asset.get("name") == name]
              if len(matching) != 1:
                  raise SystemExit(f"SAFE_SAMPLE_ASSET_NOT_UNIQUE: {venue}")
              asset = matching[0]
              if (
                  asset.get("state") != "uploaded"
                  or asset.get("size") != size
                  or _expected_digest(asset) != expected_sha
                  or not isinstance(asset.get("browser_download_url"), str)
                  or not asset["browser_download_url"].startswith("https://")
              ):
                  raise SystemExit(f"SAFE_SAMPLE_RELEASE_EVIDENCE_MISMATCH: {venue}")
              with tempfile.TemporaryDirectory() as folder:
                  destination = Path(folder) / "selected_asset"
                  got_size, got_sha = _download_to_path(
                      asset["browser_download_url"], destination,
                      token=token, max_bytes=size,
                  )
                  if got_size != size or got_sha != expected_sha:
                      raise SystemExit(f"SAFE_SAMPLE_ASSET_SHA_MISMATCH: {venue}")
                  digest = hashlib.sha256()
                  count = 0
                  if row.get("release_container_asset"):
                      with zipfile.ZipFile(destination) as archive:
                          member = str(row["release_asset"])
                          matches = [entry for entry in archive.infolist() if entry.filename == member]
                          if len(matches) != 1:
                              raise SystemExit(f"SAFE_SAMPLE_MEMBER_NOT_UNIQUE: {venue}")
                          info = matches[0]
                          if info.file_size != row["bytes"]:
                              raise SystemExit(f"SAFE_SAMPLE_MEMBER_SIZE_MISMATCH: {venue}")
                          with archive.open(info) as stream:
                              while chunk := stream.read(1024 * 1024):
                                  count += len(chunk)
                                  if count > row["bytes"]:
                                      raise SystemExit("SAFE_SAMPLE_MEMBER_OVERFLOW")
                                  digest.update(chunk)
                  else:
                      with destination.open("rb") as stream:
                          while chunk := stream.read(1024 * 1024):
                              count += len(chunk)
                              digest.update(chunk)
                  if count != row["bytes"] or digest.hexdigest() != row["sha256"]:
                      raise SystemExit(f"SAFE_SAMPLE_MEMBER_SHA_MISMATCH: {venue}")
              verified.append({
                  "venue": venue, "family": row.get("family"),
                  "dataset_id": row["dataset_id"], "release_tag": tag,
                  "asset_name": name, "asset_id": asset["id"],
                  "asset_bytes": size, "asset_sha256": expected_sha,
                  "member_bytes": count, "member_sha256": digest.hexdigest(),
              })
              print("SAFE_VENUE_MEMBER_SHA_VERIFIED", venue, row.get("family"), count)
          receipt = {
              "schema": "alina.multi_venue_sample_restore.v1",
              "status": "BOUNDED_SAMPLES_ONLY_NOT_FULL_DATASET",
              "repository": repository,
              "git_sha": os.environ["GITHUB_SHA"],
              "catalog_sha256": proof["source_index_sha256"],
              "verified_venues": len(verified),
              "unverified_venues": [venue for venue in venues if venue not in candidates],
              "verified_venue_names": [item["venue"] for item in verified],
              "full_dataset_certified": False,
              "verified": verified,
          }
          result = Path(os.environ["RUNNER_TEMP"]) / "SAFE_MULTI_VENUE_RECEIPT.json"
          result.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("SAFE_MULTI_VENUE_RECEIPT_VERIFIED", len(verified))
          PY
      - name: Publish SHA-bound SAFE sample receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-sample-restore-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/SAFE_SAMPLE_RESTORE_RECEIPT.json
            ${{ runner.temp }}/SAFE_MULTI_VENUE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
      - name: Measure canonical index headroom
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.partitioned_data_index import read_index, SCHEMA as PARTITION_SCHEMA
          path = Path("catalog/DATA_INDEX.json")
          root = json.loads(path.read_text(encoding="utf-8"))
          logical = read_index(path)
          size = path.stat().st_size
          ceiling = 85 * 1024 * 1024
          partitioned = root.get("schema") == PARTITION_SCHEMA
          print(f"ALINA_INDEX_LAYOUT={'PARTITIONED' if partitioned else 'INLINE'}")
          print(f"ALINA_INDEX_ROOT_BYTES={size}")
          print(f"ALINA_INDEX_LOGICAL_SHARDS={len(logical['shards'])}")
          print(f"ALINA_INDEX_WRITE_LIMIT_BYTES={ceiling}")
          print(f"ALINA_INLINE_HEADROOM_BYTES={None if partitioned else ceiling - size}")
          PY
      - name: Inspect lossless compactable index metadata
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from tools.partitioned_data_index import read_index
          rows = read_index(Path("catalog/DATA_INDEX.json"))["shards"]
          counts = Counter()
          savings = Counter()
          redundant = Counter()
          repo = "Rapt0r06300/hyperliquid-smart-wallet-observer"
          for row in rows:
              for key, value in row.items():
                  counts[key] += 1
                  savings[key] += len(json.dumps(key)) + 1 + len(json.dumps(value)) + 1
              if row.get("release_repository") == repo:
                  redundant["canonical_release_repository"] += 1
              if row.get("run_manifest_release_tag") == row.get("release_tag"):
                  redundant["duplicate_run_manifest_tag"] += 1
              if row.get("record_count") == row.get("event_count"):
                  redundant["duplicate_record_count"] += 1
              if row.get("release_remote_size") == row.get("bytes"):
                  redundant["duplicate_remote_size"] += 1
              if row.get("replay_reason") == "STRICT_PARSE_CHRONOLOGY_OK":
                  redundant["successful_replay_reason"] += 1
          print("INDEX_ROWS=", len(rows))
          print("TOP_INDEX_FIELD_BYTES=", savings.most_common(25))
          print("REDUNDANT_FIELD_COUNTS=", dict(redundant))
          PY
      - name: Identify code consumers of canonical release repository
        run: |
          grep -R -n --include='*.py' "release_repository" src/hl_observer tools | head -110 || true
      - name: Prove compact index parity before any mutation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.index_run_manifest import (
              hydrate_default_release_repository, _compact_index_row,
              compact_index_rows,
              CANONICAL_DATA_REPOSITORY,
          )
          path = Path("catalog/DATA_INDEX.json")
          from tools.partitioned_data_index import read_index, SCHEMA as PARTITION_SCHEMA
          is_partitioned = json.loads(path.read_text(encoding="utf-8")).get("schema") == PARTITION_SCHEMA
          original = read_index(path)
          rows = hydrate_default_release_repository(original)
          if any(row.get("release_repository") != CANONICAL_DATA_REPOSITORY for row in rows):
              raise SystemExit("COMPACTION_NO_GO: foreign or unverified release repository")
          compact = dict(original)
          compact["release_repository_default"] = CANONICAL_DATA_REPOSITORY
          # Preserve both root-level Release aliases and repeated run IDs.
          # Re-expanding those aliases here made this read-only gate falsely
          # fail above 85 MiB, even when the real index remained safely small.
          compact["shards"] = compact_index_rows(compact, rows)
          assert hydrate_default_release_repository(compact) == [
              _compact_index_row(row) for row in rows
          ], "compaction changed economic evidence"
          output = json.dumps(compact, sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\\n"
          new_bytes = len(output.encode("utf-8"))
          print(f"COMPACT_INDEX_SHARDS={len(rows)}")
          print(f"COMPACT_INDEX_BYTES={new_bytes}")
          print(f"COMPACT_INDEX_SAVED_BYTES={path.stat().st_size - new_bytes}")
          if not is_partitioned and new_bytes >= 85 * 1024 * 1024:
              raise SystemExit("COMPACTION_NO_GO: inline index still too large")
          PY
      - name: Validate native batch chronology independently
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 requests
          PYTHONPATH=src python -m pytest -q tests/test_native_trade_batch_split.py
      - name: Run deterministic restore tests
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 requests
          PYTHONPATH=src python -m pytest -q tests/test_restore_alina.py tests/test_restore_alina_launcher.py tests/test_sync_complete_clone.py tests/test_push_github_safe_contract.py tests/test_check_clone_payload_completeness.py tests/test_repair_stale_safe_partition.py tests/test_measure_uncompressed_partition.py tests/test_quarantine_audit.py tests/test_manifest_policy.py tests/test_backfill_replay_compatibility_candidates.py tests/test_run_indexing.py tests/test_v2_dataset_repository.py
      - name: Publish test result for verifiable GitHub status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPOSITORY: ${{ github.repository }}
          TEST_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          job_state = os.environ["TEST_JOB_STATUS"]
          state = "success" if job_state == "success" else "error" if job_state == "cancelled" else "failure"
          payload = json.dumps({
              "state": state,
              "context": "alina/restore-safe-regression",
              "description": ("SAFE restore and trade-batch tests passed" if state == "success" else
                              "Test run cancelled" if state == "error" else
                              "SAFE restore or trade-batch tests failed"),
              "target_url": "https://github.com/" + os.environ["GH_REPOSITORY"] + "/actions/runs/" + os.environ["GH_RUN_ID"],
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] + "/statuses/" + os.environ["GH_SHA"],
              data=payload,
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30):
                  pass
          except urllib.error.HTTPError as exc:
              # Some installations deny the legacy statuses REST API even
              # though GitHub Actions checks still report the actual job result.
              # Never convert a failed pytest into success: only the optional
              # status POST itself is allowed to be unavailable.
              if exc.code != 403:
                  raise
              print("ALINA_STATUS_POST_DENIED_403: use the authoritative Actions job conclusion")
          PY

  launcher-windows:
    name: Execute real Windows CMD restore launcher contract
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout launcher and restore runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            tools
            tests
            POUSSER-GITHUB-FORCE.cmd
            POUSSER_TOUT_LE_TRAVAIL.cmd
            REPARER_ET_POUSSER.cmd
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Parse Codex GitHub push PowerShell safely
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/tools/push_github_safe.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw "Codex push PowerShell parse failure: $errors" }
      - name: Prove every Git wrapper forwards all arguments
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $code = Get-Content tools/push_github_safe.ps1 -Raw
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput(
            $code, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "PowerShell parse errors: $errors" }
          foreach ($name in @("Invoke-Git", "Get-GitText", "Test-Git")) {
            $fn = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                $node.Name -eq $name
            }, $true)
            if ($null -eq $fn) { throw "Missing Git wrapper $name" }
            Invoke-Expression $fn.Extent.Text
          }
          $script:GitExecutable = (Get-Command git.exe).Source
          $probe = Join-Path $env:RUNNER_TEMP "Alina safe Git wrapper probe"
          New-Item -ItemType Directory -Force $probe | Out-Null
          Push-Location $probe
          try {
            Invoke-Git @("init", "-b", "main")
            $branch = Get-GitText @("symbolic-ref", "--quiet", "--short", "HEAD")
            if ($branch -ne "main") { throw "Multi-argument Git forwarding failed" }
            if (-not (Test-Git @("rev-parse", "--is-inside-work-tree"))) {
              throw "Boolean Git wrapper failed"
            }
            Write-Host "ALINA_GIT_WRAPPERS_OK"
          } finally { Pop-Location }
      - name: Exercise full offline restore regression suite on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { throw "pytest installation failed" }
          $env:PYTHONPATH = "src"
          python -m pytest -q tests/test_restore_alina.py tests/test_restore_alina_launcher.py tests/test_push_github_safe_contract.py
          if ($LASTEXITCODE -ne 0) { throw "Windows restore regression failed" }
      - name: Smoke test alias from a path containing spaces without network
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "Alina restore path with spaces"
          New-Item -ItemType Directory -Force (Join-Path $root "tools") | Out-Null
          foreach ($name in @("Alina-restore.cmd", "RESTORE_ALINA.cmd")) {
            Copy-Item -LiteralPath $name -Destination (Join-Path $root $name)
          }
          foreach ($name in @("restore_alina.py", "partitioned_data_index.py")) {
            Copy-Item -LiteralPath (Join-Path "tools" $name) -Destination (Join-Path $root "tools")
          }
          Push-Location $root
          try {
            # GitHub's PowerShell wrapper may turn a deliberate nonzero native
            # exit into a terminating exception before we can inspect it.
            $PSNativeCommandUseErrorActionPreference = $false
            $ErrorActionPreference = "Continue"
            & .\Alina-restore.cmd --help
            $helpCode = $LASTEXITCODE
            Write-Host "RESTORE_WINDOWS_HELP_EXIT=$helpCode"
            if ($helpCode -ne 0) { throw "CMD alias help failed with $helpCode" }
            # Parse rejection runs before any GitHub API call or data modification.
            & .\Alina-restore.cmd --definitely-invalid-restore-option 2>&1
            $exitCode = $LASTEXITCODE
            Write-Host "RESTORE_WINDOWS_INVALID_ARG_EXIT=$exitCode"
            if ($exitCode -ne 2) { throw "CMD alias did not propagate Python exit 2: $exitCode" }
          } finally {
            Pop-Location
          }
          # Clear the deliberately tested native exit code before Actions'
          # PowerShell wrapper propagates $LASTEXITCODE as the job status.
          exit 0
