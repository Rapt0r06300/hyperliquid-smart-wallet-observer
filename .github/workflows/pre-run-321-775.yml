name: pre-run-321-775-honest-completion

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: pre-run-completion-775-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NO_COLOR: "1"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  TESTNET_EXECUTION_ENABLED: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  completion-775:
    name: Preuve technique honnête 1→775
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publier le statut 775 en cours
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"hypersmart/pre-run-775","description":"Gate technique 1-775 en cours"}'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dépendances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt

      - name: Revalider les preuves 001-100
        run: |
          python -m hl_observer.ops.pre_run_guard_001_100 --root . --output runtime/reports/pre_run_001_100_final.json
          python -m pytest -q -p no:cacheprovider --junitxml=junit-final-001-100.xml \
            tests/test_pre_run_optimizations_001_100.py \
            tests/test_pre_run_guard_001_100.py

      - name: Revalider les preuves 101-200
        run: |
          python -m hl_observer.ops.pre_run_guard_101_200 --root . --output runtime/reports/pre_run_101_200_final.json
          python -m pytest -q -p no:cacheprovider --junitxml=junit-final-101-200.xml \
            tests/test_pre_run_optimizations_101_200.py \
            tests/test_pre_run_guard_101_200.py

      - name: Revalider les preuves 201-300
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-final-201-300.xml \
            tests/test_pre_run_201_220_rigor.py \
            tests/test_pre_run_221_260_rigor.py \
            tests/test_pre_run_261_300_rigor.py

      - name: Revalider les ancres PnL 301-320
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-final-301-320.xml \
            tests/test_pre_run_pnl_301_313.py \
            tests/test_pre_run_pnl_314_320.py

      - name: Prouver spécifiquement Copy-Vault 321-395
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-copy-321-395.xml \
            tests/test_pre_run_copy_321_395.py \
            tests/test_copy_vault_generalization.py \
            tests/test_copy_vault_executable.py \
            tests/test_copy_campaign_adapter.py \
            tests/test_vault_fills_backfill.py \
            tests/test_vault_ledger.py

      - name: Prouver spécifiquement Lead-Lag 396-465
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-lead-lag-396-465.xml \
            tests/test_pre_run_lead_lag_396_465.py \
            tests/test_lead_lag_certified_clock.py \
            tests/test_lead_lag_shadow.py \
            tests/test_causal_timestamp_contract_v2.py \
            tests/test_metaorder_l2_tape.py

      - name: Prouver spécifiquement Cross-Venue 466-545
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-cross-venue-466-545.xml \
            tests/test_pre_run_cross_venue_466_545.py \
            tests/test_cross_venue_certified.py \
            tests/test_collecter_carnet.py \
            tests/test_dislocation_2jambes.py \
            tests/test_economic_objective.py \
            tests/test_cross_venue_economic_provenance.py \
            tests/test_economic_campaigns.py

      - name: Prouver spécifiquement 546-775
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-final-546-775.xml \
            tests/test_pre_run_546_775.py \
            tests/test_robustness_protocol.py \
            tests/test_economic_memory.py \
            tests/test_economic_memory_completion_order.py \
            tests/test_autonomous_completion_contract.py \
            tests/test_dataset_untrusted_guard.py \
            tests/test_pre_full_rehearsal.py \
            tests/test_self_hosted_go_gate.py \
            tests/test_family_economic_job.py \
            tests/test_dataset_economic_runner_purity.py \
            tests/test_max_data_router.py \
            tests/test_autonomous_research_job_router.py \
            tests/test_alina_self_hosted_assets.py \
            tests/test_portable_release_ci.py \
            tests/test_runtime_replay_paper_parity.py \
            tests/test_anti_overfit_gate.py \
            tests/test_validation_stats.py

      - name: Valider les 455 preuves dérivées 321-775
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-progress-321-775.xml \
            tests/test_pre_run_321_775.py \
            tests/test_canonical_775_technical_status.py \
            tests/test_canonical_775_source_loss.py
          python -m hl_observer.ops.pre_run_guard_321_775 \
            --root . \
            --output runtime/reports/pre_run_321_775_technical_progress.json
          python - <<'PY'
          import json
          from pathlib import Path
          from hl_observer.ops.canonical_775_guard import (
              DONE_TECHNICAL_775_SOURCE_LOSS_HONEST,
              IN_PROGRESS_TECHNICAL_775_SOURCE_LOSS_HONEST,
              validate_manifest,
          )

          evidence = json.loads(Path("runtime/reports/pre_run_321_775_technical_progress.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("docs/PRE_RUN_775_CANONICAL_STATUS.json").read_text(encoding="utf-8"))
          canonical = validate_manifest(manifest)
          assert evidence["ok"] is True, evidence
          assert evidence["complete"] is True, evidence
          assert evidence["technical_done"] == 775
          assert evidence["derived_proofs_done"] == 455
          assert evidence["base_requirements_done"] == 91
          assert evidence["next_derived_id"] is None
          assert evidence["remaining_546_775"]["requirements_done"] == 46
          assert evidence["remaining_546_775"]["facets_done"] == 230
          assert evidence["remaining_546_775"]["ok"] is True
          for category, progress in evidence["category_progress"].items():
              assert progress["ok"] is True, (category, progress)
          assert canonical["ok"] is True, canonical["issues"]
          if canonical["status"] == DONE_TECHNICAL_775_SOURCE_LOSS_HONEST:
              assert canonical["technical_done"] == 775
              assert canonical["technical_completion_claimed"] is True
              print("HYPERSMART PRE-RUN: 775/775 TECHNIQUEMENT PROUVES ET MANIFESTE SCELLE")
          else:
              assert canonical["status"] == IN_PROGRESS_TECHNICAL_775_SOURCE_LOSS_HONEST
              assert canonical["technical_completion_claimed"] is False
              print("HYPERSMART PRE-RUN: IMPLEMENTATION 775/775 PROUVEE - MANIFESTE EN ATTENTE DU SCELLEMENT POST-CI")
          PY

      - name: Garde-fous sécurité finaux
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-final-safety.xml \
            tests/test_runtime_research_guardrails.py \
            tests/test_ci_supply_chain_pinning.py \
            tests/test_portable_release_ci.py \
            tests/test_anti_overfit_gate.py \
            tests/test_validation_stats.py \
            tests/test_self_hosted_go_gate.py \
            tests/test_dataset_untrusted_guard.py
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pre-run-completion-775-${{ github.sha }}
          path: |
            junit-*.xml
            runtime/reports/pre_run_*_final.json
            runtime/reports/pre_run_321_775_technical_progress.json
          if-no-files-found: error
          retention-days: 30

      - name: Publier le verdict CI 775 sur le SHA
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_JOB_STATUS: ${{ job.status }}
        run: |
          STATE="failure"
          DESCRIPTION="Gate technique 1-775 en échec"
          if [ "${FINAL_JOB_STATUS}" = "success" ]; then
            STATE="success"
            DESCRIPTION="Gate technique 1-775 verte"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"hypersmart/pre-run-775","description":"%s"}' "${STATE}" "${DESCRIPTION}")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${PAYLOAD}"
