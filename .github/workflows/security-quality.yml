name: security-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: security-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"

jobs:
  governance:
    name: Gouvernance du dépôt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Installer les outils CI sûrs et exacts
        run: python -m pip install -r requirements-ci-tools.txt
      - name: Gate locale de gouvernance
        run: python tools/check_repo_governance.py
      - name: Tests des contrats de gouvernance
        run: python -m pytest -q -p no:cacheprovider tests/test_repository_governance.py

  supply-chain:
    name: Vulnérabilités et analyse statique
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installation fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Figer l'environnement réellement résolu
        run: python -m pip freeze --all | sort > ci-resolved-requirements.txt
      - name: Audit dépendances connues vulnérables
        run: python -m pip_audit --local --skip-editable --progress-spinner off
      - name: Ruff erreurs structurelles sur tout le code
        run: python -m ruff check --select E9,F63,F7,F82 src tools tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-resolved-requirements-${{ github.sha }}
          path: ci-resolved-requirements.txt
          if-no-files-found: error
          retention-days: 14

  coverage-ratchet:
    name: Couverture de lignes sans régression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installation fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Suite complète sous coverage
        run: python -m coverage run --source=src -m pytest -q -p no:cacheprovider --tb=no
      - name: Rapport JSON
        run: python -m coverage json -o coverage.json
      - name: Cliquet fail-closed
        run: python tools/check_coverage_ratchet.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-security-quality-${{ github.sha }}
          path: coverage.json
          if-no-files-found: error
          retention-days: 14

  security-quality-verdict:
    name: Verdict sécurité et qualité
    needs: [governance, supply-chain, coverage-ratchet]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publier hypersmart/security-quality sur le SHA exact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOV_RESULT: ${{ needs.governance.result }}
          SUPPLY_RESULT: ${{ needs['supply-chain'].result }}
          COVERAGE_RESULT: ${{ needs['coverage-ratchet'].result }}
        run: |
          set -euo pipefail
          state=failure
          description="Security/quality certification failed"
          if [ "$GOV_RESULT" = success ] && [ "$SUPPLY_RESULT" = success ] && [ "$COVERAGE_RESULT" = success ]; then
            state=success
            description="Governance, supply-chain and coverage are green"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            payload=$(STATE="$state" DESCRIPTION="$description" TARGET_URL="$target_url" python - <<'PY'
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "hypersmart/security-quality",
              "description": os.environ["DESCRIPTION"],
              "target_url": os.environ["TARGET_URL"],
          }))
          PY
            )
            curl --fail-with-body --retry 3 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload"
          else
            echo "PR externe/interne: verdict calculé sans écriture du status API."
          fi
          if [ "$state" != success ]; then
            echo "SECURITY_QUALITY_RED governance=$GOV_RESULT supply=$SUPPLY_RESULT coverage=$COVERAGE_RESULT"
            exit 1
          fi
          echo "SECURITY_QUALITY_GREEN"
