name: security-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"

jobs:
  governance:
    name: Gouvernance et protection main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Gate locale de gouvernance
        run: python tools/check_repo_governance.py
      - name: Protection native de main obligatoire
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_repo_governance.py --require-protected-main --repository "${{ github.repository }}"

  supply-chain:
    name: Vulnérabilités et analyse statique
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installation fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt
          python -m pip install pip-audit==2.10.1
      - name: Audit dépendances connues vulnérables
        run: python -m pip_audit --local --skip-editable --progress-spinner off
      - name: Ruff surfaces critiques et gates
        run: |
          python -m ruff check \
            src/hl_observer/security \
            src/hl_observer/strategies/active_scope.py \
            tools/check_coverage_ratchet.py \
            tools/check_repo_governance.py \
            tests/test_repository_governance.py

  coverage-ratchet:
    name: Couverture de lignes sans régression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installation fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt
          python -m pip install coverage==7.15.2
      - name: Suite complète sous coverage
        run: python -m coverage run --source=src -m pytest -q -p no:cacheprovider --tb=no
      - name: Rapport JSON
        run: python -m coverage json -o coverage.json
      - name: Cliquet fail-closed
        run: python tools/check_coverage_ratchet.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-security-quality-${{ github.sha }}
          path: coverage.json
          if-no-files-found: error
          retention-days: 14
