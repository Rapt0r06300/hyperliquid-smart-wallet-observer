name: Alina feed-quality refactor once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alina-feed-quality-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tools
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      HL_ENABLE_MAINNET_EXECUTION: "0"
      HL_ENABLE_TESTNET_EXECUTION: "0"
      REAL_MAINNET_TRADING: "false"
      HYPERSMART_ENABLE_REAL_ORDERS: "0"
      ENABLE_REAL_ORDERS: "0"
      EXPECTED_PARENT: 9325b34afdaa42510497961d6d7b15bd63060cbb
      EXPECTED_SOURCE_BLOB: b8ebd3e75d5e41f93821a6836d5dd409020d6aa5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object src/hl_observer/realtime/feed_quality.py)" = "$EXPECTED_SOURCE_BLOB"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Apply behavior-neutral extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path("src/hl_observer/realtime/feed_quality.py")
          helper_path = Path("src/hl_observer/realtime/feed_quality_primitives.py")
          source = source_path.read_text(encoding="utf-8")
          source = source.replace("import hashlib\nimport json\n", "", 1)
          import_anchor = "from hl_observer.realtime.event_identity import canonicalize_frame\n"
          helper_import = (
              "from hl_observer.realtime.feed_quality_primitives import (\n"
              "    _normalise_levels,\n"
              "    _percentile,\n"
              "    stable_event_id,\n"
              ")\n"
          )
          if source.count(import_anchor) != 1:
              raise SystemExit("import anchor mismatch")
          source = source.replace(import_anchor, import_anchor + helper_import, 1)
          start_marker = "\ndef _percentile(values: Sequence[float], percentile: float) -> float | None:\n"
          end_marker = "\n\nclass FeedQualityGate:\n"
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("primitive block markers mismatch")
          removed = source[start:end]
          for expected in ("def _percentile", "def stable_event_id", "def _normalise_levels"):
              if expected not in removed:
                  raise SystemExit(f"missing expected primitive: {expected}")
          source = source[:start] + "\n" + source[end:]
          helper = textwrap.dedent('''\
          """Pure feed-quality normalization, percentile and identity helpers."""
          from __future__ import annotations

          import hashlib
          import json
          import math
          from typing import Any, Iterable, Mapping, Sequence


          def _percentile(values: Sequence[float], percentile: float) -> float | None:
              if not values:
                  return None
              ordered = sorted(float(value) for value in values)
              if len(ordered) == 1:
                  return ordered[0]
              position = (len(ordered) - 1) * percentile
              lower = math.floor(position)
              upper = math.ceil(position)
              if lower == upper:
                  return ordered[lower]
              weight = position - lower
              return ordered[lower] * (1.0 - weight) + ordered[upper] * weight


          def stable_event_id(payload: Any) -> str:
              """Return a deterministic hash for deduplication and provenance."""
              encoded = json.dumps(
                  payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  default=str,
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()


          def _normalise_levels(levels: Iterable[Any]) -> dict[float, float]:
              result: dict[float, float] = {}
              for level in levels:
                  if isinstance(level, Mapping):
                      price_raw = level.get("px", level.get("price"))
                      size_raw = level.get("sz", level.get("size"))
                  elif (
                      isinstance(level, Sequence)
                      and not isinstance(level, (str, bytes))
                      and len(level) >= 2
                  ):
                      price_raw, size_raw = level[0], level[1]
                  else:
                      raise ValueError("invalid book level")
                  price = float(price_raw)
                  size = float(size_raw)
                  if not math.isfinite(price) or price <= 0:
                      raise ValueError("invalid book price")
                  if not math.isfinite(size) or size < 0:
                      raise ValueError("invalid book size")
                  if size > 0:
                      result[price] = size
              return result
          ''')
          source_path.write_text(source, encoding="utf-8")
          helper_path.write_text(helper, encoding="utf-8")
          source_lines = len(source.splitlines())
          helper_lines = len(helper.splitlines())
          if source_lines >= 800:
              raise SystemExit(f"source still giant: {source_lines}")
          if helper_lines >= 800:
              raise SystemExit(f"helper giant: {helper_lines}")
          print(f"line_counts source={source_lines} helper={helper_lines}")
          PY
      - name: Verify targeted behavior and architecture
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/hl_observer/realtime/feed_quality.py \
            src/hl_observer/realtime/feed_quality_primitives.py
          python -m ruff check \
            src/hl_observer/realtime/feed_quality.py \
            src/hl_observer/realtime/feed_quality_primitives.py
          mapfile -t TEST_FILES < <(grep -RIlE 'feed_quality|stable_event_id|_normalise_levels|_percentile' tests --include='test_*.py' | sort)
          test "${#TEST_FILES[@]}" -gt 0
          python -m pytest -q "${TEST_FILES[@]}"
          python -m pytest -q \
            tests/test_invariants_architecture.py::test_pas_de_nouveau_doublon_de_nom \
            tests/test_invariants_architecture.py::test_pas_de_nouvel_orphelin
          python - <<'PY'
          from pathlib import Path
          p = Path('src/hl_observer/realtime/feed_quality.py')
          assert len(p.read_text(encoding='utf-8').splitlines()) < 800
          PY
      - name: Commit verified extraction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/alina-feed-quality-refactor-once.yml
          git status --short
          git config user.name "Rapt0r06300"
          git config user.email "bermond.florent06@gmail.com"
          git add src/hl_observer/realtime/feed_quality.py \
                  src/hl_observer/realtime/feed_quality_primitives.py \
                  .github/workflows/alina-feed-quality-refactor-once.yml
          git diff --cached --check
          git commit -m "refactor: extract feed-quality primitives"
          git push origin HEAD:main
