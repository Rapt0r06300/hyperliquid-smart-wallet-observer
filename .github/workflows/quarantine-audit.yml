name: quarantine-audit
on:
  workflow_dispatch:
  schedule:
    - cron: "37 */2 * * *"
  push:
    branches: [main]
    paths:
      - "catalog/DATA_INDEX.json"
      - "catalog/DATA_METRICS.json"
      - "datasets/**/*.manifest.json"
      - "tools/build_quarantine_audit.py"
      - "tools/manifest_policy.py"
      - "tests/test_quarantine_audit.py"
      - ".github/workflows/quarantine-audit.yml"

permissions:
  contents: write

concurrency:
  group: quarantine-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit quarantined shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Test audit logic
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_quarantine_audit.py tests/test_manifest_policy.py --tb=line

      - name: Build exact quarantine audit
        run: python tools/build_quarantine_audit.py

      - name: Publish audit receipt
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/QUARANTINE_AUDIT.json
          if git diff --cached --quiet; then
            echo "Audit receipt already current."
          else
            git commit -m "audit: publish quarantine breakdown"
            for attempt in 1 2 3 4 5 6; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" -lt 6 ] || exit 1
              sleep "$((attempt * 2))"
            done
          fi

      - name: Fail closed on live-only historical false rejection
        run: |
          python - <<'PY'
          import json
          row=json.load(open("catalog/QUARANTINE_AUDIT.json",encoding="utf-8"))
          if row.get("quarantine_total_matches_metrics") is not True:
              raise SystemExit("quarantine audit total does not match DATA_METRICS")
          bad=int(row.get("historical_live_only_false_reject_count") or 0)
          if bad:
              raise SystemExit(f"{bad} historical shard(s) are still blocked only by live-capture rules")
          PY
