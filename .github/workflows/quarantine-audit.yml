name: quarantine-audit
on:
  workflow_dispatch:
  workflow_run:
    workflows: [principal dataset terminal deletion]
    types: [completed]
  schedule:
    - cron: "37 */2 * * *"
  push:
    branches: [main]
    paths:
      # Dataset updates are audited on schedule; triggering on every new
      # manifest caused redundant job cascades and starved the publisher.
      - "tools/build_quarantine_audit.py"
      - "tools/rebase_disjoint_catalog_publication.py"
      - "tools/repair_stale_safe_classifications.py"
      - "tools/index_run_manifest.py"
      - "tools/manifest_policy.py"
      - "tests/test_quarantine_audit.py"
      - "tests/test_rebase_disjoint_catalog_publication.py"
      - ".github/workflows/quarantine-audit.yml"

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: dataset-v2-control-plane-index
  cancel-in-progress: false

jobs:
  audit:
    name: Audit quarantined shards
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /pyproject.toml
            /catalog/*.json
            /catalog/data-index-parts/
            /catalog/quarantine-audit-parts/
            /datasets/quarantine/
            /datasets/rejected/
            # Sharded PARTIAL/REJECT receipts must be visible to the audit.
            # Do not materialize the million-file sharded SAFE tree.
            /datasets/sharded/quarantine/
            /datasets/sharded/rejected/
            /src/
            /tests/
            /tools/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Test audit logic
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_quarantine_audit.py tests/test_manifest_policy.py tests/test_rebase_disjoint_catalog_publication.py --tb=line

      - name: Repair stale SAFE labels and rebuild exact audit
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python tools/index_run_manifest.py --compact-existing
          python tools/repair_stale_safe_classifications.py
          python tools/build_catalog_metrics.py
          python tools/build_quarantine_audit.py
          python tools/check_dataset_quality.py --catalog-only

      - name: Verify audit parity before publishing any repaired evidence
        run: |
          python - <<'PY'
          import json
          audit=json.load(open("catalog/QUARANTINE_AUDIT.json", encoding="utf-8"))
          if audit.get("quarantine_total_matches_metrics") is not True:
              raise SystemExit("quarantine audit total does not match DATA_METRICS")
          print("AUDIT_PARITY_OK; incomplete manifest/SAFE repair evidence remains blocked")
          PY

      - name: Publish repaired catalog and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          published=false
          # Never rebase generated catalog files: another GitHub-hosted writer
          # may have added new shards or metric receipts during the audit.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tools/index_run_manifest.py --compact-existing
            python tools/repair_stale_safe_classifications.py > "$RUNNER_TEMP/alina-reclassification-result.json"
            python tools/build_catalog_metrics.py
            python tools/build_quarantine_audit.py
            python tools/check_dataset_quality.py --catalog-only
            python - <<'PY'
          import json
          report=json.load(open("catalog/QUARANTINE_AUDIT.json",encoding="utf-8"))
          if report.get("quarantine_total_matches_metrics") is not True:
              raise SystemExit("quarantine audit and metrics disagree")
          # Partial progress is publishable, certification is not. The final
          # gate after durable publication fails closed on any remaining issue.
          print("QUARANTINE_REMAINDER", {
              "unreadable": int(report.get("unreadable_manifest_count") or 0),
              "historical": int(report.get("historical_live_only_false_reject_count") or 0),
              "stale": int(report.get("potential_false_non_safe_count") or 0),
          })
          PY
            git add --sparse -A -- \
              catalog/DATA_INDEX.json \
              catalog/DATA_METRICS.json \
              catalog/DATA_CATALOG.json \
              catalog/DATA_QUALITY_REGISTRY.json \
              catalog/QUARANTINE_AUDIT.json \
              catalog/QUARANTINE_CAUSES.json \
              catalog/quarantine-audit-parts
            # An empty sparse checkout may have neither a directory nor tracked
            # entries for a historical stage. Stage tracked deletions as well
            # as present files, but never fail on a nonexistent pathspec.
            for stage in datasets/quarantine datasets/rejected \
                datasets/sharded/quarantine datasets/sharded/rejected; do
              if [ -d "$stage" ] || git ls-files --error-unmatch -- "$stage" >/dev/null 2>&1; then
                git add --sparse -A -- "$stage"
              fi
            done
            # Stage repaired SAFE receipts individually; never scan the huge
            # flat or sharded SAFE trees.
            python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          receipt=json.loads((Path(os.environ["RUNNER_TEMP"]) / "alina-reclassification-result.json").read_text())
          for item in receipt.get("repaired", []):
              rel=item.get("new_manifest_path")
              if not isinstance(rel, str) or re.fullmatch(
                  r"datasets/sharded/safe/[0-9a-f]{2}/[0-9a-f]{2}/[A-Za-z0-9._-]+\.manifest\.json", rel
              ) is None or not Path(rel).is_file():
                  raise SystemExit("RECLASSIFICATION_SHARDED_SAFE_RECEIPT_INVALID")
              subprocess.run(["git", "add", "--sparse", "--", rel], check=True)
          PY
            # Never publish a partition root without its matching Git blobs.
            if [ -d catalog/data-index-parts ]; then git add -A -- catalog/data-index-parts; fi
            # A retired PARTIAL/REJECT manifest must have its exact original
            # SHA-256 bytes in the SAME Git commit as its SAFE replacement.
            # Historical originals use the already-staged quarantine tree,
            # including for in-flight jobs started before this guard existed.
            if [ -d datasets/quarantine/reclassification-history ]; then
              git add -A -- datasets/quarantine/reclassification-history
            fi
            python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path
          receipt = json.loads(
              Path(__import__("os").environ["RUNNER_TEMP"])
              .joinpath("alina-reclassification-result.json").read_text()
          )
          for item in receipt.get("repaired", []):
              rel = item.get("prior_manifest_archive")
              sha = item.get("prior_manifest_sha256")
              if (not isinstance(rel, str)
                      or not re.fullmatch(r"datasets/quarantine/reclassification-history/[0-9a-f]{64}\.original", rel)
                      or not isinstance(sha, str)
                      or sha != rel.rsplit("/", 1)[-1][:-9]):
                  raise SystemExit("RECLASSIFICATION_ARCHIVE_RECEIPT_MISSING")
              disk = Path(rel).read_bytes()
              staged = subprocess.run(
                  ["git", "show", ":" + rel], capture_output=True, check=True
              ).stdout
              if (hashlib.sha256(disk).hexdigest() != sha
                      or hashlib.sha256(staged).hexdigest() != sha):
                  raise SystemExit("RECLASSIFICATION_ARCHIVE_NOT_STAGED")
              new_rel = item.get("new_manifest_path")
              if not isinstance(new_rel, str):
                  raise SystemExit("RECLASSIFICATION_NEW_SAFE_RECEIPT_MISSING")
              new_disk = Path(new_rel).read_bytes()
              new_staged = subprocess.run(
                  ["git", "show", ":" + new_rel], capture_output=True, check=True
              ).stdout
              current = json.loads(new_disk)
              if (new_disk != new_staged
                      or current.get("dataset_id") != item.get("dataset_id")
                      or current.get("quality_status") != "SAFE"
                      or current.get("replay_compatible") is not True):
                  raise SystemExit("RECLASSIFICATION_NEW_SAFE_RECEIPT_NOT_STAGED")
          PY
            if git diff --cached --quiet; then
              echo "Quarantine audit and repaired catalog already current."
              published=true
              break
            fi
            git commit -m "fix(dataset): repair stale classifications with provenance"
            if git push origin HEAD:main; then
              published=true
              echo "Durable quarantine repair pushed $(git rev-parse HEAD)"
              break
            fi
            git fetch origin main
            if python tools/rebase_disjoint_catalog_publication.py --remote origin/main \
                && git push origin HEAD:main; then
              published=true
              echo "Durable quarantine repair safely rebased across campaign-only checkpoints"
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$published" != true ]; then
            echo "::error::Quarantine audit failed to publish after bounded retries"
            exit 1
          fi

      - name: Refresh health and closure receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run dataset-health-receipt.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run alina-canonical-closure-report.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Gate final quarantine certification after proven repairs
        run: |
          python - <<'PY'
          import json
          row=json.load(open("catalog/QUARANTINE_AUDIT.json",encoding="utf-8"))
          if row.get("quarantine_total_matches_metrics") is not True:
              raise SystemExit("quarantine audit total does not match DATA_METRICS")
          historical=int(row.get("historical_live_only_false_reject_count") or 0)
          stale=int(row.get("potential_false_non_safe_count") or 0)
          unreadable=int(row.get("unreadable_manifest_count") or 0)
          if unreadable:
              from tools.build_quarantine_audit import read_partitioned_audit
              full=read_partitioned_audit(__import__("pathlib").Path("catalog/QUARANTINE_AUDIT.json"))
              blocked=[
                  {
                      "dataset_id": item.get("dataset_id"),
                      "manifest_path": item.get("manifest_path"),
                      "initial_status": item.get("initial_status"),
                  }
                  for item in full.get("non_safe_shards", [])
                  if item.get("current_classification") == "UNAVAILABLE"
              ]
              print("UNREADABLE_NON_SAFE_MANIFESTS=" + json.dumps(blocked[:20], sort_keys=True))
              raise SystemExit(f"{unreadable} unreadable non-SAFE manifest(s); audit is incomplete")
          if historical:
              raise SystemExit(f"{historical} historical shard(s) are still blocked only by live-capture rules")
          if stale:
              raise SystemExit(f"{stale} non-SAFE shard(s) classify SAFE under the current policy")
          PY

      - name: Publish auditable quarantine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPOSITORY: ${{ github.repository }}
          AUDIT_JOB_RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          outcome = os.environ["AUDIT_JOB_RESULT"]
          state = "success" if outcome == "success" else "error" if outcome == "cancelled" else "failure"
          body = json.dumps({
              "state": state,
              "context": "alina/quarantine-catalog-audit",
              "description": "Current catalog quarantine verified" if state == "success" else "Current catalog quarantine NOT verified",
              "target_url": "https://github.com/" + os.environ["GH_REPOSITORY"] + "/actions/runs/" + os.environ["GH_RUN_ID"],
          }).encode()
          request = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] + "/statuses/" + os.environ["GH_SHA"],
              data=body, method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
