name: pre-run-001-100

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pre-run-001-100-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NO_COLOR: "1"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  TESTNET_EXECUTION_ENABLED: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  preuves-001-100:
    name: Preuves executables optimisations 001-100
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2

      # IMPORTANT : ce contrôle appartient au checkout Git lui-même. Il doit
      # s'exécuter AVANT toute restauration de cache ou action susceptible de
      # créer des fichiers dans le workspace. On ne masque aucun fichier source.
      - name: Gate initial sur checkout exact et propre
        run: |
          python3 -m hl_observer.ops.pre_run_guard_001_100 \
            --root . \
            --output runtime/reports/pre_run_001_100.json \
            --require-clean-git

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dependances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt

      - name: Verifier le gate de couverture 001-100
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-core.xml \
            tests/test_pre_run_optimizations_001_100.py \
            tests/test_pre_run_guard_001_100.py \
            tests/test_runtime_protections.py \
            tests/test_runtime_protections_streaming.py \
            tests/test_runtime_research_guardrails.py \
            tests/test_ci_supply_chain_pinning.py \
            tests/test_portable_release_ci.py

      - name: Rejouer les preuves data market-truth execution 001-40
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-001-040.xml \
            tests/test_tick_dataset.py \
            tests/test_canonical_market_events.py \
            tests/test_feed_quality_gate.py \
            tests/test_feed_quality_reader.py \
            tests/test_market_truth_pipeline.py \
            tests/test_market_truth_replay_stage.py \
            tests/test_forward_causal_parity_bloc17.py \
            tests/test_economic_revalidation_bloc18.py

      - name: Rejouer anti-overfit microstructure following et risque 041-91
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-041-091.xml \
            tests/test_anti_overfit_gate.py \
            tests/test_robustesse_selection.py \
            tests/test_idees_36_a_91.py \
            tests/test_metaorder_l2_tape.py \
            tests/test_entity_consensus.py \
            tests/test_metaorder_shadow.py \
            tests/test_historical_analysis_launcher.py

      - name: Rejouer runtime strategie identite ledger 092-100
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-092-100.xml \
            tests/test_persistent_poll_runner.py \
            tests/test_session_identity.py \
            tests/test_verrou_instance.py \
            tests/test_v12_strategy_registry.py \
            tests/test_paper_ledger.py

      - name: Gate final sans masquer les fichiers de preuve generes
        run: |
          python -m hl_observer.ops.pre_run_guard_001_100 \
            --root . \
            --output runtime/reports/pre_run_001_100.json

      - name: Audits securite finaux
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pre-run-001-100-${{ github.sha }}
          path: |
            junit-pre-run-*.xml
            runtime/reports/pre_run_001_100.json
          if-no-files-found: error
          retention-days: 30
