name: repo-bundle-temporary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-bundle-temporary.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact HEAD
        run: git archive --format=zip --output=repo-head.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: repo-head
          path: repo-head.zip
          if-no-files-found: error
          retention-days: 1
