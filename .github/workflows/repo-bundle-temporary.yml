name: repo-bundle-temporary

on:
  workflow_dispatch:
  push:
    branches: [main, codex-discovery-v32]
    paths:
      - '.github/workflows/repo-bundle-temporary.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact HEAD
        run: git archive --format=zip --output=repo-head.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-head
          path: repo-head.zip
          if-no-files-found: error
          retention-days: 1
