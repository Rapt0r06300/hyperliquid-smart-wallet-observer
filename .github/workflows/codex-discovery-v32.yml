name: codex-discovery-v32

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/hl_observer/research/**'
      - 'tools/codex_*'
      - 'tests/test_codex_*'
      - 'docs/quant/HISTORICAL_EXPERIMENT_MEMORY.jsonl'
      - 'AGENTS.md'
      - 'docs/CODEX_GOAL_RUNBOOK.md'
      - '.agents/skills/alina-quant-research/**'
      - '.github/workflows/codex-discovery-v32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project and test tools
        run: python -m pip install -e '.[dev]'
      - name: Focused Discovery V3.2 tests
        run: >-
          pytest -q
          tests/test_codex_process_memory.py
          tests/test_codex_historical_memory.py
          tests/test_codex_research_context.py
          tests/test_codex_semantic_discovery.py
          tests/test_hypothesis_ledger.py
          tests/test_codex_hypothesis_ledger_cli.py
          tests/test_codex_discovery_v3_contract.py
          tests/test_document_authority.py
      - name: Ruff V3.2
        run: >-
          ruff check
          src/hl_observer/research/process_memory.py
          src/hl_observer/research/research_context.py
          src/hl_observer/research/semantic_discovery.py
          tools/codex_research_context.py
          tools/codex_semantic_discovery.py
          tests/test_codex_process_memory.py
          tests/test_codex_historical_memory.py
          tests/test_codex_research_context.py
          tests/test_codex_semantic_discovery.py
