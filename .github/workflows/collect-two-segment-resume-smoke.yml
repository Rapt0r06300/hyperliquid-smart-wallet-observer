name: collect-two-segment-resume-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/hl_observer/control_plane/resumable_campaign.py"
      - "tools/collect_resume_probe.py"
      - "tests/test_collect_resume_probe.py"
      - "tools/build_global_implementation_closure.py"
      - "tests/test_global_closure_resume_contract.py"
      - ".github/workflows/collect-two-segment-resume-smoke.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-two-segment-resume-smoke
  cancel-in-progress: false

jobs:
  segment_a:
    name: Segment A durable checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify phase and tests
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("control/alina-phase.json"))["phase"])')" = "COLLECT"
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=src python -m pytest -q tests/test_collect_resume_probe.py tests/test_global_closure_resume_contract.py --tb=line

      - name: Write Segment A durable checkpoint
        run: |
          set -euo pipefail
          PYTHONPATH=src python tools/collect_resume_probe.py segment-a \
            --owner-run-id "$GITHUB_RUN_ID:$GITHUB_JOB" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish Segment A state to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/COLLECT_RESUME_PROBE_STATE.json
          git commit -m "proof: checkpoint collect resume segment A"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1

  segment_b:
    name: Segment B fresh runner resume
    needs: segment_a
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Refresh durable Segment A state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          test -f catalog/COLLECT_RESUME_PROBE_STATE.json

      - name: Resume on fresh runner
        run: |
          set -euo pipefail
          PYTHONPATH=src python tools/collect_resume_probe.py segment-b \
            --owner-run-id "$GITHUB_RUN_ID:$GITHUB_JOB"

      - name: Publish terminal Segment B state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/COLLECT_RESUME_PROBE_STATE.json
          git commit -m "proof: complete collect resume segment B"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1

  receipt:
    name: Publish fresh-runner resume receipt
    needs: [segment_a, segment_b]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: "\${{ github.token }}"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Refresh terminal state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Read distinct GitHub job IDs
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python - <<'PY' "$RUNNER_TEMP/jobs.json" >> "$GITHUB_ENV"
          import json,sys
          jobs=json.load(open(sys.argv[1],encoding="utf-8")).get("jobs") or []
          def find(name):
              for row in jobs:
                  if str(row.get("name") or "") == name:
                      return row
              raise SystemExit("missing job: "+name)
          a=find("Segment A durable checkpoint")
          b=find("Segment B fresh runner resume")
          if int(a["id"]) == int(b["id"]):
              raise SystemExit("segment jobs are not distinct")
          print("SEGMENT_A_JOB_ID="+str(a["id"]))
          print("SEGMENT_B_JOB_ID="+str(b["id"]))
          PY

      - name: Build structural resume receipt
        run: |
          set -euo pipefail
          PYTHONPATH=src python tools/collect_resume_probe.py receipt \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --segment-a-job-id "$SEGMENT_A_JOB_ID" \
            --segment-b-job-id "$SEGMENT_B_JOB_ID"

      - name: Publish receipt
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/COLLECT_RESUME_SMOKE_RECEIPT.json
          git commit -m "proof: publish fresh-runner collect resume receipt"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            [ "$attempt" -lt 6 ] || exit 1
            sleep "$((attempt * 2))"
          done

      - name: Refresh canonical closure report
        run: |
          gh workflow run alina-canonical-closure-report.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
