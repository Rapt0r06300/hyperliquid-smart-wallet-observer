name: collect-two-segment-resume-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/hl_observer/control_plane/resumable_campaign.py"
      - "tools/collect_resume_probe.py"
      - "tests/test_collect_resume_probe.py"
      - "tools/build_global_implementation_closure.py"
      - "tests/test_global_closure_resume_contract.py"
      - ".github/workflows/collect-two-segment-resume-smoke.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: collect-two-segment-resume-smoke
  cancel-in-progress: false

jobs:
  segment_a:
    name: Segment A durable checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify phase and tests
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("control/alina-phase.json"))["phase"])')" = "COLLECT"
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=src python -m pytest -q tests/test_collect_resume_probe.py tests/test_global_closure_resume_contract.py --tb=line

      - name: Write Segment A durable checkpoint
        run: |
          set -euo pipefail
          PYTHONPATH=src python tools/collect_resume_probe.py segment-a \
            --owner-run-id "$GITHUB_RUN_ID:$GITHUB_JOB" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Upload Segment A durable state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collect-resume-segment-a-state-${{ github.run_id }}
          path: catalog/COLLECT_RESUME_PROBE_STATE.json
          if-no-files-found: error

  segment_b:
    name: Segment B fresh runner resume
    needs: segment_a
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download durable Segment A state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: collect-resume-segment-a-state-${{ github.run_id }}
          path: ${{ runner.temp }}/segment-a-state

      - name: Install durable Segment A state
        run: |
          set -euo pipefail
          mkdir -p catalog
          cp "$RUNNER_TEMP/segment-a-state/COLLECT_RESUME_PROBE_STATE.json" \
            catalog/COLLECT_RESUME_PROBE_STATE.json
          test -f catalog/COLLECT_RESUME_PROBE_STATE.json

      - name: Resume on fresh runner
        run: |
          set -euo pipefail
          PYTHONPATH=src python tools/collect_resume_probe.py segment-b \
            --owner-run-id "$GITHUB_RUN_ID:$GITHUB_JOB"

      - name: Upload terminal Segment B state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collect-resume-segment-b-state-${{ github.run_id }}
          path: catalog/COLLECT_RESUME_PROBE_STATE.json
          if-no-files-found: error

  receipt:
    name: Publish fresh-runner resume receipt
    needs: [segment_a, segment_b]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download terminal Segment B state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: collect-resume-segment-b-state-${{ github.run_id }}
          path: ${{ runner.temp }}/segment-b-state

      - name: Install terminal Segment B state
        run: |
          set -euo pipefail
          mkdir -p catalog
          cp "$RUNNER_TEMP/segment-b-state/COLLECT_RESUME_PROBE_STATE.json" \
            catalog/COLLECT_RESUME_PROBE_STATE.json

      - name: Read distinct GitHub job IDs
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python - <<'PY' "$RUNNER_TEMP/jobs.json" >> "$GITHUB_ENV"
          import json,sys
          jobs=json.load(open(sys.argv[1],encoding="utf-8")).get("jobs") or []
          def find(name):
              for row in jobs:
                  if str(row.get("name") or "") == name:
                      return row
              raise SystemExit("missing job: "+name)
          a=find("Segment A durable checkpoint")
          b=find("Segment B fresh runner resume")
          if int(a["id"]) == int(b["id"]):
              raise SystemExit("segment jobs are not distinct")
          print("SEGMENT_A_JOB_ID="+str(a["id"]))
          print("SEGMENT_B_JOB_ID="+str(b["id"]))
          PY

      - name: Build structural resume receipt
        run: |
          set -euo pipefail
          PYTHONPATH=src python tools/collect_resume_probe.py receipt \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --segment-a-job-id "$SEGMENT_A_JOB_ID" \
            --segment-b-job-id "$SEGMENT_B_JOB_ID" \
            --require-exact-sha

      - name: Upload exact-SHA resume receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collect-resume-receipt-${{ github.run_id }}
          path: catalog/COLLECT_RESUME_SMOKE_RECEIPT.json
          if-no-files-found: error
