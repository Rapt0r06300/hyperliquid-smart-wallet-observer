name: event-intelligence-coverage-registry
on:
  workflow_dispatch:
  schedule:
    - cron: "31 */6 * * *"
  push:
    branches: [main]
    paths:
      - "docs/event-intelligence-120-coverage.md"
      - "tools/generate_event_intelligence_status.py"
      - "tools/validate_event_intelligence_status.py"
      - "src/hl_observer/event_intelligence/**"
      - "src/hl_observer/control_plane/module_pnl_proof.py"
env:
  GH_TOKEN: "${{ github.token }}"

permissions:
  # contents: read is the baseline; publication jobs elevate only where required.
  contents: write
concurrency:
  group: event-intelligence-coverage-registry
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate wiring registry
        run: python tools/generate_event_intelligence_status.py
      - name: Validate wiring registry
        run: python tools/validate_event_intelligence_status.py
      - name: Publish registry
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/event-intelligence-120-status.json
          git diff --cached --quiet && exit 0
          git commit -m "event-intelligence: publish wiring status registry"
          gh auth setup-git
          git push origin HEAD:main
