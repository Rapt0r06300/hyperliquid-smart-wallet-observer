name: tmp-alert-spine-validation-refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-alert-spine-validation-refactor.yml
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer dépendances exactes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Extraire validation et construction des propositions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('src/hl_observer/alerts/spine.py')
          helper = Path('src/hl_observer/alerts/validation.py')
          text = source.read_text(encoding='utf-8')
          start = text.index('\nPROPOSAL_SCHEMA =')
          end = text.index('\n@dataclass(frozen=True, slots=True)\nclass AlertSpinePaths:')
          block = text[start + 1:end].rstrip() + '\n'

          tree = ast.parse(block)
          names = []
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  names.append(node.name)
              elif isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if isinstance(target, ast.Name):
                          names.append(target.id)
          names = sorted(dict.fromkeys(name for name in names if not name.startswith('__')))

          header = '''"""Pure alert proposal validation and deterministic construction."""
          from __future__ import annotations

          import hashlib
          import json
          import math
          import re
          from collections.abc import Mapping
          from typing import Any

          from hl_observer.alerts.freshness import project_alert_freshness

          '''
          header = '\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines()) + '\n'
          helper.write_text(header + block, encoding='utf-8')
          import_block = 'from hl_observer.alerts.validation import (\n' + ''.join(f'    {name},\n' for name in names) + ')\n'
          rewritten = text[:start] + '\n\n' + import_block + '\n' + text[end + 1:]
          source.write_text(rewritten, encoding='utf-8')
          PY
      - name: Vérifier structure et style
        run: |
          python -m ruff check --fix src/hl_observer/alerts/spine.py src/hl_observer/alerts/validation.py
          python -m ruff check src/hl_observer/alerts/spine.py src/hl_observer/alerts/validation.py
          python - <<'PY'
          from pathlib import Path
          helper = Path('src/hl_observer/alerts/validation.py')
          spine = Path('src/hl_observer/alerts/spine.py')
          helper_lines = len(helper.read_text(encoding='utf-8').splitlines())
          spine_lines = len(spine.read_text(encoding='utf-8').splitlines())
          print(f'validation.py={helper_lines}')
          print(f'spine.py={spine_lines}')
          if helper_lines > 800:
              raise SystemExit(f'FILE_TOO_LARGE:validation.py:{helper_lines}')
          if spine_lines >= 1824:
              raise SystemExit(f'SPINE_NOT_REDUCED:{spine_lines}')
          PY
      - name: Tests alert spine ciblés
        run: |
          python -m pytest -q \
            tests/test_alert_spine_v26.py \
            tests/test_alert_spool_v26.py \
            tests/test_alert_ledger_v26.py \
            tests/test_alert_scoring_v26.py \
            tests/test_alert_envelope_v26.py \
            tests/test_alert_projection_rebuild_v26.py \
            tests/test_alert_idempotency_v26.py \
            tests/test_alert_freshness_v26.py \
            tests/test_alert_read_model_v26.py
      - name: Vérifier invariants safety
        run: |
          python -m pytest -q tests/test_no_mainnet_execution.py tests/test_runtime_contract.py tests/test_coverage_closure_import_all.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alert-spine-validation-refactor-${{ github.sha }}
          path: |
            src/hl_observer/alerts/spine.py
            src/hl_observer/alerts/validation.py
      - name: Publier uniquement le refactor vérifié sur main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo "MAIN_MOVED_ABORT"; exit 1; }
          git diff --check -- src/hl_observer/alerts/spine.py src/hl_observer/alerts/validation.py
          git add src/hl_observer/alerts/spine.py src/hl_observer/alerts/validation.py
          git diff --cached --check
          git config user.name "alina-smartflow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: extract alert proposal validation"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA" || { echo "PARENT_MISMATCH_ABORT"; exit 1; }
          git push origin HEAD:main
