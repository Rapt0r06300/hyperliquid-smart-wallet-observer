name: hyperlab-ci
# HyperLab CI fail-closed: package + dev/test deps + research deps are mandatory.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install editable + dev tests (BLOQUANT)
        run: python -m pip install -e ".[dev]"
      - name: Install requirements-recherche (BLOQUANT)
        run: python -m pip install -r requirements-recherche.txt
      - name: Regenerer + gates du registre machine
        run: |
          python tools/claude_tasks_scan.py .
          python -m pytest tests/test_master_every_data_item_has_task.py tests/test_every_done_task_is_wired.py -q
      - name: Suite hyperlab (spine reel)
        run: python -m pytest tests/test_hyperlab_*.py -q
      - name: Smoke E2E (chaine complete offline, code retour bloquant)
        run: python -m hl_observer.hyperlab smoke
