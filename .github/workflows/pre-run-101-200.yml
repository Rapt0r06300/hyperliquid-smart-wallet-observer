name: pre-run-101-200

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pre-run-101-200-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NO_COLOR: "1"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  TESTNET_EXECUTION_ENABLED: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  preuves-101-200:
    name: Preuves executables optimisations 101-200
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer dependances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt
      - name: Gate initial exact HEAD securite et couverture
        run: python -m hl_observer.ops.pre_run_guard_101_200 --root . --output runtime/reports/pre_run_101_200.json --require-clean-git
      - name: Matrice exacte 101-200
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-101-200-core.xml tests/test_pre_run_optimizations_101_200.py tests/test_pre_run_guard_101_200.py
      - name: Preuves operationnelles et PAPER 101-130
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-101-130.xml tests/test_rapport_hierarchie_preuve.py tests/test_recette_windows_e2e.py tests/test_paper_engine_ledger_wiring.py
      - name: Preuves robustesse causalite et validation 131-160
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-131-160.xml tests/test_runtime_protections_streaming.py tests/test_scenario_rigor.py tests/test_qa_rigor.py tests/test_validation_stats.py tests/test_rapport_hierarchie_preuve.py
      - name: Preuves lineage experiences transfert QA et supply-chain 161-200
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-161-200.xml tests/test_experiment_infra.py tests/test_experiment_design.py tests/test_scenario_rigor.py tests/test_qa_rigor.py tests/test_validation_stats.py tests/test_portable_release_ci.py
      - name: Revalider le lot precedent 001-100
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-upstream-001-100.xml tests/test_pre_run_optimizations_001_100.py tests/test_pre_run_guard_001_100.py
      - name: Gate final
        run: python -m hl_observer.ops.pre_run_guard_101_200 --root . --output runtime/reports/pre_run_101_200.json
      - name: Audits securite finaux
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pre-run-101-200-${{ github.sha }}
          path: |
            junit-pre-run-*.xml
            runtime/reports/pre_run_101_200.json
          if-no-files-found: error
          retention-days: 30
