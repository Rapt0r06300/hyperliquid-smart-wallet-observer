name: dataset-v2-bridge-smoke

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: dataset-v2-bridge-smoke
  cancel-in-progress: true
jobs:
  bridge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ github.token }}
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify bridge contract
        run: |
          python -m pytest -q             tests/test_v2_dataset_repository.py             tests/test_v2_dataset_bridge.py             tests/test_dataset_v2_reader.py
      - name: Plan live SAFE Dataset V2 materialization
        run: |
          python -m hl_observer.ops.v2_dataset_bridge plan             --families bbo             --max-shards 1             --output "$RUNNER_TEMP/v2-bridge-smoke"             > "$RUNNER_TEMP/v2-plan.json"
          cat "$RUNNER_TEMP/v2-plan.json"
          SAFE_SHARDS="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/v2-plan.json"))["safe_shards"])')"
          echo "SAFE_SHARDS=$SAFE_SHARDS" >> "$GITHUB_ENV"
      - name: Materialize one live SAFE shard
        if: env.SAFE_SHARDS != '0'
        run: |
          DATASET_SELECTION_ID="$(sha256sum "$RUNNER_TEMP/v2-plan.json" | cut -d' ' -f1)"
          COLLECTION_CUTOFF_AT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m hl_observer.ops.v2_dataset_bridge materialize \
            --families bbo \
            --max-shards 1 \
            --output "$RUNNER_TEMP/v2-bridge-smoke" \
            --dataset-selection-id "$DATASET_SELECTION_ID" \
            --source-collection-epoch "${{ github.run_id }}" \
            --collection-cutoff-at-utc "$COLLECTION_CUTOFF_AT_UTC" \
            > "$RUNNER_TEMP/v2-materialize.json"
          test -s "$RUNNER_TEMP/v2-bridge-smoke/runtime/reports/datasets/SELECTION_PROVENANCE.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"v2-bridge-smoke"
          p=json.loads((root/"runtime/reports/datasets/SELECTION_PROVENANCE.json").read_text())
          assert p["quality_status_required"]=="SAFE"
          assert p["selected_shards"]==1
          assert p["real_execution"] is False
          assert p["provenance_complete"] is True
          print(json.dumps({"selected_shards":p["selected_shards"],"selected_events":p["selected_events"],"selected_bytes":p["selected_bytes"]},sort_keys=True))
          PY
      - name: Report honest no-SAFE state
        if: env.SAFE_SHARDS == '0'
        run: |
          echo "Dataset V2 reachable, but no SAFE+replay-compatible BBO shard currently matches."
          echo "This is an honest no-data state, not a replay success."
