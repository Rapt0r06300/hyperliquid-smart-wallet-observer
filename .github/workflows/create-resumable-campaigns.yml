name: create-resumable-campaigns
on:
  schedule:
    - cron: '2 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-resumable-campaigns.yml'
      - '.github/workflows/resumable-campaign-controller.yml'
      - '.github/workflows/resumable-campaign-worker.yml'
      - 'tools/manifest_policy.py'
      - 'tools/index_run_manifest.py'
      - 'tools/resumable_campaign.py'
      - 'tools/discover_cloud_collection_plan.py'
      - 'tools/freeze_copy_vault_selection.py'
      - 'tools/phase_gate.py'
      - 'tools/apply_operator_controls.py'
      - 'tools/set_phase.py'
      - 'tools/resolve_analysis_selection.py'
      - 'tools/supersede_copy_vault_fanout.py'
      - 'tools/requeue_failed_analysis_campaign.py'
      - 'tools/refresh_pending_collect_campaign.py'
      - 'tools/freeze_market_shards.py'
      - 'tools/collect_cloud_window.py'
      - 'src/hl_observer/collection/gate_market_data.py'
      - 'src/hl_observer/collection/bitget_market_data.py'
      - 'src/hl_observer/collection/bybit_market_data.py'
      - 'src/hl_observer/collection/okx_market_data.py'
      - 'src/hl_observer/collection/native_market_tape.py'
      - 'src/hl_observer/collection/depth_capacity.py'
      - 'src/hl_observer/collection/native_funding_history.py'
      - 'src/hl_observer/collection/trade_reconciliation.py'
      - 'src/hl_observer/datasets/v2_export.py'
      - 'src/hl_observer/datasets/v2_pipeline.py'
      - 'control/alina-phase.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumable-campaign-creation-hourly
  # Campaign creation is deterministic/idempotent and reloads origin/main.
  # A newer phase/stage request supersedes obsolete queued creation runs.
  cancel-in-progress: true

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      phase: ${{ steps.campaigns.outputs.phase }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main before campaign creation
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Checkout current campaign code and pin exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: main
          path: alina
          persist-credentials: false

      - name: Install current Alina runtime for deterministic discovery
        run: python -m pip install --disable-pip-version-check -e ./alina

      - id: campaigns
        name: Create deterministic frozen campaigns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/campaigns
          BUCKET="$(date -u +%Y%m%d%H)"
          DAY="$(date -u +%Y%m%d)"
          HOUR="$(date -u +%H)"
          SLOT6="$((10#$HOUR / 6))"
          PREV_DAY="$(date -u -d 'yesterday' +%Y-%m-%d)"
          NOW_MS="$(($(date -u +%s) * 1000))"
          REPLAY_START_MS="$((NOW_MS - 6 * 60 * 60 * 1000))"
          ECON_START_MS="$((NOW_MS - 7 * 24 * 60 * 60 * 1000))"
          CODE_SHA="$(git -C alina rev-parse HEAD)"
          DATASET_REPO_SHA="$(git rev-parse HEAD)"
          PYTHONPATH=alina/src python tools/apply_operator_controls.py --alina-root alina --phase-path control/alina-phase.json
          PHASE_META="$(python tools/phase_gate.py read)"
          PHASE="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["phase"])' "$PHASE_META")"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          PHASE_EPOCH="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["epoch"])' "$PHASE_META")"
          SOURCE_COLLECTION_EPOCH="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["source_collection_epoch"] or "")' "$PHASE_META")"
          COLLECTION_CUTOFF="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["collection_cutoff_at_utc"] or "")' "$PHASE_META")"
          ANALYSIS_STAGE="$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("analysis_stage") or "")' "$PHASE_META")"
          REQUEST_ID="$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("request_id") or "phase-"+str(json.loads(sys.argv[1])["epoch"]))' "$PHASE_META")"
          if ! [[ "$REQUEST_ID" =~ ^[0-9a-f]{64}$ ]]; then
            REQUEST_ID="$(printf "scheduled-phase:%s:%s" "$PHASE" "$PHASE_EPOCH" | sha256sum | cut -d" " -f1)"
          fi
          if [ "$PHASE" = "IDLE" ]; then
            echo "IDLE: no new campaign intent is created"
            exit 0
          fi
          PHASE_ARGS=(--creation-phase "$PHASE" --phase-epoch "$PHASE_EPOCH")
          if [ "$PHASE" = "ANALYZE" ]; then
            test -n "$SOURCE_COLLECTION_EPOCH"
            test -n "$COLLECTION_CUTOFF"
            test -n "$ANALYSIS_STAGE"
            test -f catalog/DATA_INDEX.json
            DATASET_SELECTION_ID="$(python tools/resolve_analysis_selection.py \
              --epoch "$PHASE_EPOCH" \
              --source-collection-epoch "$SOURCE_COLLECTION_EPOCH" \
              --collection-cutoff-at-utc "$COLLECTION_CUTOFF")"
            printf '%s' "$DATASET_SELECTION_ID" | grep -Eq '^[0-9a-f]{64}$'
            PHASE_ARGS+=(
              --source-collection-epoch "$SOURCE_COLLECTION_EPOCH"
              --collection-cutoff-at-utc "$COLLECTION_CUTOFF"
              --dataset-selection-id "$DATASET_SELECTION_ID"
              --analysis-stage "$ANALYSIS_STAGE"
            )
          fi
          PHASE_ARGS+=(--operator-request-id "$REQUEST_ID")
          PLAN_SHA="$(printf '%s' 'resumable-github-campaigns-v5' | sha256sum | cut -d' ' -f1)"

          PYTHONPATH=alina/src python tools/import_operator_intents.py             --alina-root alina             --phase "$PHASE"             --phase-epoch "$PHASE_EPOCH"             --analysis-stage "$ANALYSIS_STAGE"             --source-collection-epoch "$SOURCE_COLLECTION_EPOCH"             --collection-cutoff-at-utc "$COLLECTION_CUTOFF"             --code-sha "$CODE_SHA"             --dataset-repo-sha "$DATASET_REPO_SHA"

          make_campaign() {
            KIND="$1"
            ID="$2"
            CFG_TEXT="$3"
            CURSOR="$4"
            P="catalog/campaigns/$ID.json"
            if ! python tools/phase_gate.py allow --kind "$KIND" >/dev/null; then
              echo "phase gate denied $KIND for $PHASE; skipping"
              return 0
            fi
            CFG_SHA="$(printf '%s' "$CFG_TEXT|$CURSOR" | sha256sum | cut -d' ' -f1)"
            if [ -f "$P" ] && [ "$PHASE" = "ANALYZE" ]; then
              # Campaign creation can race a worker claim. Re-read the canonical
              # manifest immediately before any code refresh so an old local
              # PENDING copy can never overwrite a newer RUNNING/COMPLETE lease.
              git fetch origin main
              if git cat-file -e "origin/main:$P" 2>/dev/null; then
                git show "origin/main:$P" > "$P"
              fi
              python tools/requeue_failed_analysis_campaign.py \
                --manifest "$P" \
                --history-dir catalog/campaign-history \
                --code-sha "$CODE_SHA" \
                --config-sha256 "$CFG_SHA" \
                --work-plan-sha256 "$PLAN_SHA" \
                --expected-phase-epoch "$PHASE_EPOCH" \
                --expected-analysis-stage "$ANALYSIS_STAGE" \
                --expected-source-collection-epoch "$SOURCE_COLLECTION_EPOCH" \
                --expected-dataset-selection-id "$DATASET_SELECTION_ID"
              return 0
            fi
            if [ -f "$P" ] && [ "$PHASE" = "COLLECT" ]; then
              # Refresh only stale, unleased, non-productive current-epoch
              # collection manifests. The helper archives the prior manifest
              # byte-for-byte and refuses to rewrite live/durable work.
              git fetch origin main
              if git cat-file -e "origin/main:$P" 2>/dev/null; then
                git show "origin/main:$P" > "$P"
              fi
              python tools/refresh_pending_collect_campaign.py \
                --manifest "$P" \
                --history-dir catalog/campaign-history \
                --code-sha "$CODE_SHA" \
                --config-sha256 "$CFG_SHA" \
                --work-plan-sha256 "$PLAN_SHA" \
                --expected-phase-epoch "$PHASE_EPOCH"
              return 0
            fi
            if [ ! -f "$P" ]; then
              PYTHONPATH=alina/src python alina/tools/resumable_campaign.py create "$P"                 --campaign-id "$ID"                 --kind "$KIND"                 --code-sha "$CODE_SHA"                 --dataset-generation V2_FRESH                 --config-sha256 "$CFG_SHA"                 --work-plan-sha256 "$PLAN_SHA"                 --cursor-json "$CURSOR"                 "${PHASE_ARGS[@]}"
            fi
          }

          if [ "$PHASE" = "COLLECT" ]; then
            # A collector fix must reach the OLD non-productive market backlog too,
            # otherwise FIFO scheduling would spend hours on stale code before the
            # new hourly bucket. Pin the latest commit that actually changed the
            # market collector surface; catalog/checkpoint-only commits do not
            # cause refresh churn. Leased or productive campaigns are preserved by
            # refresh_pending_collect_campaign.py and concurrent worker races are
            # resolved by the existing rebase-before-push fail-closed logic.
            COLLECTOR_CODE_SHA="$(git -C alina log -1 --format=%H -- \
              tools/collect_cloud_window.py \
              src/hl_observer/collection/gate_market_data.py \
              src/hl_observer/collection/bitget_market_data.py \
              src/hl_observer/collection/bybit_market_data.py \
              src/hl_observer/collection/okx_market_data.py \
              src/hl_observer/collection/native_market_tape.py \
              src/hl_observer/collection/depth_capacity.py \
              src/hl_observer/collection/native_funding_history.py \
              src/hl_observer/collection/trade_reconciliation.py \
              src/hl_observer/datasets/v2_export.py \
              src/hl_observer/datasets/v2_pipeline.py)"
            test -n "$COLLECTOR_CODE_SHA"
            REFRESHED_MARKET_BACKLOG=0
            for P in catalog/campaigns/market-*.json; do
              [ -f "$P" ] || continue
              read -r KIND EPOCH CFG PLAN < <(
                python -c 'import json,sys; row=json.load(open(sys.argv[1],encoding="utf-8")); print(row.get("kind",""), int(row.get("phase_epoch") or 0), row.get("config_sha256",""), row.get("work_plan_sha256",""))' "$P"
              )
              [ "$KIND" = "market_collection" ] || continue
              [ "$EPOCH" = "$PHASE_EPOCH" ] || continue
              RESULT="$(python tools/refresh_pending_collect_campaign.py \
                --manifest "$P" \
                --history-dir catalog/campaign-history \
                --code-sha "$COLLECTOR_CODE_SHA" \
                --config-sha256 "$CFG" \
                --work-plan-sha256 "$PLAN" \
                --expected-phase-epoch "$PHASE_EPOCH")"
              if python -c 'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("refreshed") else 1)' "$RESULT"; then
                REFRESHED_MARKET_BACKLOG=$((REFRESHED_MARKET_BACKLOG + 1))
              fi
            done
            echo "refreshed_market_backlog=$REFRESHED_MARKET_BACKLOG collector_code_sha=$COLLECTOR_CODE_SHA"
          fi

          if [ "$PHASE" = "COLLECT" ]; then
            # Freeze one authoritative discovery snapshot per UTC hour, then
            # derive disjoint market shards from that exact snapshot. Every
            # coin keeps all of its venue symbols on one runner so receive-clock
            # comparisons remain meaningful across venues.
            TARGET_MARKET_SHARDS=16
            MARKET_SHARDS="$TARGET_MARKET_SHARDS"
            MARKET_PLAN_DIR="catalog/market_collection_plans/e$PHASE_EPOCH/$BUCKET"
            MARKET_FULL_PLAN="$MARKET_PLAN_DIR/full.json"
            MARKET_SHARD_INDEX="$MARKET_PLAN_DIR/index.json"
            mkdir -p "$MARKET_PLAN_DIR"
            if [ -f "$MARKET_SHARD_INDEX" ]; then
              MARKET_SHARDS="$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1],encoding="utf-8"))["market_shard_count"]))' "$MARKET_SHARD_INDEX")"
              test "$MARKET_SHARDS" -gt 0
              echo "preserving frozen current-bucket market_shard_count=$MARKET_SHARDS"
            else
              if [ ! -f "$MARKET_FULL_PLAN" ]; then
                PYTHONPATH=alina/src python alina/tools/discover_cloud_collection_plan.py \
                  --output "$MARKET_FULL_PLAN" \
                  --min-venues 2 \
                  --max-coins 0 \
                  --batch-size 8
              fi
              python tools/freeze_market_shards.py \
                --plan "$MARKET_FULL_PLAN" \
                --output-dir "$MARKET_PLAN_DIR" \
                --shard-count "$MARKET_SHARDS" \
                --index-output "$MARKET_SHARD_INDEX"
            fi

            python - <<'PY' "$MARKET_SHARD_INDEX" > "$RUNNER_TEMP/market-shards.tsv"
          import json,sys
          row=json.load(open(sys.argv[1],encoding="utf-8"))
          for shard in row.get("shards") or []:
              print(
                  str(shard["market_shard_index"])
                  +"\t"+str(shard["plan_file"])
                  +"\t"+str(shard["plan_sha256"])
                  +"\t"+str(row["universe_digest"])
                  +"\t"+str(shard["selected_coin_count"])
              )
          PY
            while IFS=$'\t' read -r MARKET_SHARD MARKET_PLAN_FILE MARKET_PLAN_SHA UNIVERSE_DIGEST MARKET_COIN_COUNT; do
              [ -n "$MARKET_SHARD" ] || continue
              MARKET_CURSOR="$(python -c 'import json,sys; print(json.dumps({"duration_s":3500,"max_coins":0,"rotate_mb":64,"universe_mode":"native_discovery_full","require_all_native_venues":True,"market_shard_count":int(sys.argv[1]),"market_shard_index":int(sys.argv[2]),"plan_file":sys.argv[3],"plan_sha256":sys.argv[4],"universe_digest":sys.argv[5],"selected_coin_count":int(sys.argv[6])}, separators=(",",":")))' "$MARKET_SHARDS" "$MARKET_SHARD" "$MARKET_PLAN_FILE" "$MARKET_PLAN_SHA" "$UNIVERSE_DIGEST" "$MARKET_COIN_COUNT")"
              make_campaign \
                market_collection \
                "market-e$PHASE_EPOCH-$MARKET_SHARD-$BUCKET-v7" \
                "market-hourly-sharded-frozen-universe-v7" \
                "$MARKET_CURSOR"
            done < "$RUNNER_TEMP/market-shards.tsv"

            python tools/supersede_copy_vault_fanout.py

            ACTIVE_COPY_CAMPAIGNS="$(python -c 'import glob,json,sys; epoch=int(sys.argv[1]); active={"PENDING","RUNNING","CONTINUATION_REQUIRED","STUCK"}; rows=[json.load(open(path,encoding="utf-8")) for path in glob.glob("catalog/campaigns/copy-vault-*-v7.json")]; print(sum(str(row.get("status") or "") in active and row.get("creation_phase")=="COLLECT" and int(row.get("phase_epoch") or 0)==epoch for row in rows))' "$PHASE_EPOCH")"
            if [ "$ACTIVE_COPY_CAMPAIGNS" -gt 0 ]; then
              echo "active Copy-Vault sweep already exists ($ACTIVE_COPY_CAMPAIGNS campaigns); skipping overlapping full-universe sweep"
            else
              COPY_SELECTION="catalog/copy_vault_selections/e$PHASE_EPOCH/$BUCKET.json"
              mkdir -p "$(dirname "$COPY_SELECTION")"
              if [ ! -f "$COPY_SELECTION" ]; then
                PYTHONPATH=alina/src python alina/tools/freeze_copy_vault_selection.py --output "$COPY_SELECTION"
              fi
              COPY_COUNT="$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["vaults"]))' "$COPY_SELECTION")"
              test "$COPY_COUNT" -gt 0
              COPY_SHA="$(sha256sum "$COPY_SELECTION" | cut -d' ' -f1)"
              COPY_LANES="$(((COPY_COUNT + 9) / 10))"
              test "$COPY_LANES" -gt 0
              COPY_MAX_USERS_PER_LANE="$(((COPY_COUNT + COPY_LANES - 1) / COPY_LANES))"
              test "$COPY_MAX_USERS_PER_LANE" -le 10
              for ((COPY_LANE=0; COPY_LANE<COPY_LANES; COPY_LANE++)); do
                COPY_CURSOR="$(python -c 'import json,sys; print(json.dumps({"duration_s":300,"max_vaults":int(sys.argv[1]),"vault_shard_count":int(sys.argv[2]),"vault_shard_index":int(sys.argv[3]),"rotate_mb":64,"selection_file":sys.argv[4],"selection_sha256":sys.argv[5]}, separators=(",",":")))' "$COPY_COUNT" "$COPY_LANES" "$COPY_LANE" "$COPY_SELECTION" "$COPY_SHA")"
                make_campaign               copy_vault_collection               "copy-vault-e$PHASE_EPOCH-$COPY_LANE-$BUCKET-v7"               "copy-vault-hourly-complete-universe-v7"               "$COPY_CURSOR"
              done
            fi

            make_campaign             event_intelligence_collection             "event-e$PHASE_EPOCH-$BUCKET-v5"             "event-hourly-v5"             '{}'

            if [ "$HOUR" = "06" ]; then
              make_campaign               official_archive_collection               "archives-binance-btc-e$PHASE_EPOCH-$DAY-v4"               "archives-daily-v4"               "{\"venue\":\"binance\",\"coin\":\"BTC\",\"symbol\":\"BTCUSDT\",\"start_date\":\"$PREV_DAY\",\"end_date\":\"$PREV_DAY\",\"max_days\":1}"
              make_campaign               official_archive_collection               "archives-bybit-btc-e$PHASE_EPOCH-$DAY-v4"               "archives-daily-v4"               "{\"venue\":\"bybit\",\"coin\":\"BTC\",\"symbol\":\"BTCUSDT\",\"start_date\":\"$PREV_DAY\",\"end_date\":\"$PREV_DAY\",\"max_days\":1}"
            fi
          fi

          if [ "$PHASE" = "ANALYZE" ]; then
            ANALYSIS_ID="analysis-e$PHASE_EPOCH"
            case "$ANALYSIS_STAGE" in
              REPLAY)
                make_campaign replay "$ANALYSIS_ID-replay-v2" "analysis-replay-v2" '{"max_shards":128}'
                make_campaign replay "$ANALYSIS_ID-resume-proof-v1" "analysis-replay-resume-proof-v1" '{"max_shards":128,"resume_proof":true}'
                ;;
              BACKTEST)
                make_campaign backtest "$ANALYSIS_ID-backtest-v2" "analysis-backtest-v2" "{\"start_ts_ms\":$ECON_START_MS,\"end_ts_ms\":$NOW_MS,\"max_shards\":128}"
                ;;
              OOS)
                make_campaign oos "$ANALYSIS_ID-oos-v2" "analysis-oos-v2" "{\"start_ts_ms\":$ECON_START_MS,\"end_ts_ms\":$NOW_MS,\"max_shards\":128,\"freeze_before_evaluation\":true}"
                ;;
              FORWARD_PAPER)
                make_campaign forward_paper "$ANALYSIS_ID-forward-paper-v2" "analysis-forward-paper-v2" '{"max_shards":128,"paper_only":true,"read_only":true}'
                ;;
              PNL_PROOF)
                make_campaign module_pnl_proof "$ANALYSIS_ID-pnl-proof-v2" "analysis-pnl-proof-v2" '{"max_shards":128,"independent_families":true}'
                ;;
              SCOREBOARD)
                make_campaign scoreboard "$ANALYSIS_ID-scoreboard-v2" "analysis-scoreboard-v2" '{"max_shards":128,"independent_families":true}'
                ;;
            esac
          fi

      - name: Commit campaign manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for optional in             catalog/campaigns             catalog/copy_vault_selections             catalog/market_collection_plans             catalog/campaign-history             catalog/dispatch-receipts             catalog/operator-acks             control/phase-receipts; do
            if [ -e "$optional" ]; then git add "$optional"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "campaign: create continuous resumable work"
          for i in 1 2 3 4 5; do
            set +e
            git pull --rebase origin main
            pull_rc=$?
            set -e
            if [ "$pull_rc" -ne 0 ]; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "::warning::Campaign manifest refresh collided with concurrent worker updates; discarding this local batch so the next scheduled/push cycle recomputes from current main."
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i*2))
          done
          echo "::warning::Campaign manifest push remained contended; deferring to the next controller cycle."
          exit 0




  launch:
    needs: create
    if: ${{ needs.create.outputs.phase != 'IDLE' }}
    permissions:
      actions: write
      contents: write
    # Native reusable-workflow call: avoids GitHub API workflow_dispatch
    # throttling between campaign creation and the first bounded work wave.
    uses: ./.github/workflows/resumable-campaign-controller.yml

  resume_smoke:
    needs: [create, launch]
    if: ${{ always() && needs.create.outputs.phase == 'ANALYZE' && (needs.launch.result == 'success' || needs.launch.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch resume smoke for ANALYZE only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            set +e
            output="$(gh workflow run durable-two-segment-resume-smoke.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            printf '%s\n' "$output" >&2
            if printf '%s' "$output" | grep -Eqi 'rate limit|HTTP 403|secondary rate|temporar|timeout|502|503|504'; then
              [ "$attempt" -lt 6 ] || exit 0
              delay="$((5 * attempt * attempt))"
              [ "$delay" -le 60 ] || delay=60
              sleep "$delay"
              continue
            fi
            exit "$rc"
          done
