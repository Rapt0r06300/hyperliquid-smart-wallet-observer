name: event-intelligence-ci

on:
  push:
    branches: ["**"]
    paths:
      - "src/hl_observer/event_intelligence/**"
      - "tests/test_event_intelligence_foundation.py"
      - ".github/workflows/event-intelligence-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/hl_observer/event_intelligence/**"
      - "tests/test_event_intelligence_foundation.py"
      - ".github/workflows/event-intelligence-ci.yml"

permissions:
  contents: read

env:
  PYTHONPATH: src
  PYTHONUTF8: "1"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"

jobs:
  causal-event-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Event Intelligence causal tests
        run: python -m pytest -q tests/test_event_intelligence_foundation.py
