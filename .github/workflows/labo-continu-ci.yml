name: labo-continu-ci

# CI GitHub (FX-10) — tests INDÉPENDANTS de l'OS (Linux) du LABORATOIRE DE RECHERCHE CONTINU, à chaque push/PR.
# Complète (ne remplace pas) le workflow dYdX existant (ci.yml). La recette WINDOWS interactive (Ctrl+C par
# phase, crash/reprise, dashboard Rich, touche S, aucun process enfant) est publiée SÉPARÉMENT : tools/launchers/RECETTE-WINDOWS.cmd.
# SÉCURITÉ : paper-only, read-only. Aucune clé, aucun secret requis.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - 'catalog/**'
      - 'control/**'
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: labo-continu-ci-${{ github.ref }}
  # Retain an active SHA-bound proof; only the pending run can be superseded.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests-non-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # The continuous lab consumes only the canonical code, tools, tests,
          # and Python configuration used by this workflow.  Do not hydrate
          # the multi-GB raw dataset reservoir or unrelated repository trees.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tools/
            /tests/
            /conftest.py
            /pyproject.toml
            /requirements-ci-bootstrap.txt
            /requirements-recherche.txt
            /.github/workflows/labo-continu-ci.yml
            /tools/launchers/RECETTE-WINDOWS.cmd
      - name: Configurer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: pytest (+ optuna/cmaes OPTIONNELS)
        run: |
          python -m pip install --require-hashes -r requirements-ci-bootstrap.txt
          python -m pip install --disable-pip-version-check pytest PyYAML httpx pydantic websockets
          # Optuna/cmaes optionnels : présents => samplers/pruners avancés ; absents => indisponibilité HONNÊTE
          python -m pip install -r requirements-recherche.txt || echo "optuna/cmaes non installes (ok, tests d'indisponibilite honnete)"
      - name: Sécurité (aucun ordre réel) + fondations PnL
        env:
          PYTHONPATH: src:tools
        run: python -m pytest -q tests/test_no_real_trade_foundations.py tests/test_paper_ledger.py tests/test_pnl_reconciliation.py
      - name: Suite laboratoire continu (FINAL / PROD-TRUTH / ULTIMATE / ABSOLUTE / FIX / e2e data)
        id: test-suite
        env:
          PYTHONPATH: src:tools
        run: |
          mkdir -p reports
          set +e
          python -m pytest -q \
            --junitxml=reports/labo-continu.xml \
            tests/test_copy_vault_closure_gate.py \
            tests/test_copy_vault_evidence_inventory.py \
            tests/test_copy_vault_task_closure_plans.py \
            tests/test_labo_continu_final.py \
            tests/test_labo_continu_prod_truth.py \
            tests/test_labo_continu_ultimate.py \
            tests/test_labo_continu_absolute.py \
            tests/test_labo_continu_fix.py \
            tests/test_data_complete_18h.py
          status=$?
          set -e
          echo "pytest_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publier le rapport JUnit de la suite laboratoire
        if: always()
        id: publish-junit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: labo-continu-junit-${{ github.run_id }}-${{ github.sha }}
          path: reports/labo-continu.xml
          if-no-files-found: error
          retention-days: 14
      - name: Produire le rapport fail-closed des dix tâches Copy-Vault
        if: always()
        id: tasklist-audit
        env:
          PYTHONPATH: src:tools
        run: |
          mkdir -p reports /tmp/copy-vault-no-evidence
          set +e
          python tools/verify_copy_vault_tasklist.py \
            --head-sha "${GITHUB_SHA}" \
            --evidence-dir /tmp/copy-vault-no-evidence \
            --output reports/copy-vault-tasklist-closure.json
          status=$?
          set -e
          # Exit 2 means the audit ran correctly but closure evidence is incomplete.
          if [ "$status" -ne 2 ]; then exit "$status"; fi
      - name: Publier le rapport de clôture Copy-Vault
        if: always()
        id: publish-closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copy-vault-tasklist-closure-${{ github.run_id }}-${{ github.sha }}
          path: reports/copy-vault-tasklist-closure.json
          if-no-files-found: error
          retention-days: 14
      - name: Construire le reçu hosted lié au SHA exact
        if: steps.test-suite.outcome == 'success' && steps.tasklist-audit.outcome == 'success'
        env:
          PYTHONPATH: src:tools
        run: |
          python tools/build_copy_vault_hosted_receipt.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --head-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --status completed \
            --conclusion success \
            --pytest-exit-code "${{ steps.test-suite.outputs.pytest_exit_code }}" \
            --junit-artifact-id "${{ steps.publish-junit.outputs.artifact-id }}" \
            --junit-artifact-name "labo-continu-junit-${GITHUB_RUN_ID}-${GITHUB_SHA}" \
            --junit-artifact-digest "${{ steps.publish-junit.outputs.artifact-digest }}" \
            --closure-artifact-id "${{ steps.publish-closure.outputs.artifact-id }}" \
            --closure-artifact-name "copy-vault-tasklist-closure-${GITHUB_RUN_ID}-${GITHUB_SHA}" \
            --closure-artifact-digest "${{ steps.publish-closure.outputs.artifact-digest }}" \
            --tasklist-report reports/copy-vault-tasklist-closure.json \
            --output reports/copy-vault-hosted-receipt.json
      - name: Publier le reçu hosted exact-SHA
        if: steps.test-suite.outcome == 'success' && steps.tasklist-audit.outcome == 'success'
        id: publish-hosted-receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copy-vault-hosted-receipt-${{ github.run_id }}-${{ github.sha }}
          path: reports/copy-vault-hosted-receipt.json
          if-no-files-found: error
          retention-days: 14
