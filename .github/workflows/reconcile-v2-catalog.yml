name: reconcile-v2-catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-v2-catalog.yml'
      - 'tools/index_run_manifest.py'
      - 'tools/download_release_manifests.py'
      - 'tests/test_release_manifest_download.py'
      - 'tools/manifest_policy.py'
      - 'tools/check_dataset_quality.py'
      - 'control/legacy-release-migration.json'
      - 'tests/test_dataset_policy.py'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# A high-frequency metrics/identity writer must not replace a queued
# historical reconciler. Reconciliation rebuilds every candidate publication
# from the latest main and retries conflicting pushes, so keep its own lane.
concurrency:
  group: dataset-v2-catalog-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout canonical Alina control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compact existing canonical index before growing it
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the separate immutable manifest receipts; this only removes
          # provably repeated release/tag fields from the SAME canonical index.
          # Commit a compacted, SHA-rebound catalogue before any new Release
          # can exceed the 85 MiB fail-closed staging limit.
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tools/index_run_manifest.py --compact-existing
            python tools/build_catalog_metrics.py
            python tools/build_quarantine_audit.py
            python tools/check_dataset_quality.py
            git add catalog
            if git diff --cached --quiet; then
              echo "Existing catalog already compacted; no empty commit."
              published=true
              break
            fi
            git commit -m "data: losslessly compact canonical run locators"
            if git push origin HEAD:main; then
              echo "Lossless index compaction durably published."
              published=true
              break
            fi
            echo "Concurrent main update; rebuilding compaction ($attempt/5)."
            sleep $((attempt * 3))
          done
          if [ "$published" != true ]; then
            echo "::error::Could not publish lossless index compaction"
            exit 1
          fi

      - name: Download only new production V2 run manifests (all Releases, bounded batch)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v2-release-manifests"
          ALL_TAGS="$RUNNER_TEMP/v2-all-release-tags.txt"
          TAGS="$RUNNER_TEMP/v2-new-release-tags.txt"
          python tools/download_release_manifests.py \
            --repository "$GITHUB_REPOSITORY" \
            --list-tags-output "$ALL_TAGS" \
            --list-page-size 50
          python - <<'PY' "$ALL_TAGS" "$TAGS"
          import json, os, re, sys
          from pathlib import Path

          all_path, out_path = map(Path, sys.argv[1:])
          index = json.loads(Path("catalog/DATA_INDEX.json").read_text(encoding="utf-8"))
          aliases = index.get("run_manifest_release_tags_by_release") or {}
          if not isinstance(aliases, dict):
              raise ValueError("invalid run-manifest tag map")
          known={
              str(row.get("run_manifest_release_tag") or aliases.get(
                  str(row.get("release_tag") or "")) or row.get("release_tag"))
              for row in (index.get("shards") or [])
              if isinstance(row, dict)
              and row.get("release_tag")
              and (row.get("release_repository") or index.get("release_repository_default")) == os.environ["GITHUB_REPOSITORY"]
          }
          quarantined = set()
          migration = Path("control/legacy-release-migration.json")
          if migration.is_file():
              try:
                  doc = json.loads(migration.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  doc = {}
              quarantined = {
                  str(tag) for tag in (doc.get("quarantined_tags") or []) if str(tag)
              }
          allowed = re.compile(r"^(data-v2-|copy-vault-v2-|archive-v2-|event-intelligence-v2-)")
          seen = set()
          new_tags = []
          for line in all_path.read_text(encoding="utf-8").splitlines():
              fields = line.split("\t", 1)
              tag = fields[0].strip() if fields else ""
              has_run_manifest = (
                  len(fields) == 2 and fields[1].strip().lower() == "true"
              )
              if not tag or tag in seen:
                  continue
              seen.add(tag)
              # Incomplete data-only or overflow Releases are not independent
              # production runs. Only a Release that already exposes the
              # immutable RUN_MANIFEST.json may enter catalog reconciliation.
              if not has_run_manifest:
                  continue
              if allowed.match(tag) and tag not in known and tag not in quarantined:
                  new_tags.append(tag)
          # Publishing ~100*1000 per-shard manifests makes DATA_INDEX huge and
          # GitHub rejects individual >100 MiB blobs. Bound each durable wave,
          # preserve the backlog, and relay the next wave after a real push.
          # Never repeatedly build a lot that cannot fit GitHub's 100 MiB
          # single-blob hard limit. Keep all pending tags discoverable so the
          # next run resumes, and fail closed at the indexer's 85 MiB guard.
          indexed_bytes = Path("catalog/DATA_INDEX.json").stat().st_size
          # Near the 85 MiB atomic index guard, a two-Release wave
          # exceeded capacity (verified 2026-10-10). Try a single
          # immutable Release first; retain all other tags as backlog.
          if indexed_bytes >= 75 * 1024 * 1024:
              batch_size = 1
          elif indexed_bytes >= 65 * 1024 * 1024:
              batch_size = 2
          else:
              batch_size = 8
          batch = new_tags[:batch_size]
          remaining = max(0, len(new_tags) - len(batch))
          out_path.write_text("\n".join(batch) + ("\n" if batch else ""), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"NEW_RELEASE_TAGS={len(batch)}\n")
              env.write(f"REMAINING_NEW_TAGS={remaining}\n")
          print(f"new_release_tags_total={len(new_tags)} batch={len(batch)} remaining={remaining}")
          PY
          if [ ! -s "$TAGS" ]; then
            echo "RUN_MANIFEST_COUNT=0" >> "$GITHUB_ENV"
            echo "No new canonical production releases to reconcile."
            exit 0
          fi
          python tools/download_release_manifests.py             --repository "$GITHUB_REPOSITORY"             --destination "$ROOT"             --tags-file "$TAGS"             --attempts 3             --poll-seconds 2
          COUNT="$(find "$ROOT" -name RUN_MANIFEST.json -type f | wc -l)"
          echo "RUN_MANIFEST_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "canonical run manifests found: $COUNT"

      - name: Losslessly compact canonical index before ingesting new evidence
        if: env.RUN_MANIFEST_COUNT != '0'
        run: |
          set -euo pipefail
          python tools/index_run_manifest.py --compact-existing

      - name: Rebuild control-plane index from target-native manifests
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t MANIFESTS < <(
            find "$RUNNER_TEMP/v2-release-manifests" -name RUN_MANIFEST.json -type f | sort
          )
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No canonical manifests downloaded."
            exit 0
          fi
          python tools/index_run_manifest.py "${MANIFESTS[@]}"

      - name: Build SHA-bound metrics and quarantine audit after reconciliation
        if: env.RUN_MANIFEST_COUNT != '0'
        run: |
          python tools/build_catalog_metrics.py
          python tools/build_quarantine_audit.py

      - name: Validate rebuilt control plane
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_dataset_quality.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q             tests/test_run_indexing.py             tests/test_dataset_policy.py             tests/test_dataset_metrics.py             tests/test_manifest_policy.py             tests/test_release_manifest_download.py             tests/test_collection_metrics.py

      - name: Commit reconciled catalog
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep Release manifests outside the checkout. On concurrent main
          # commits, always rebuild on the latest HEAD; never rebase generated
          # catalogs (that leaves unresolved conflicts and loses evidence).
          mapfile -t MANIFESTS < <(
            find "$RUNNER_TEMP/v2-release-manifests" -name RUN_MANIFEST.json -type f | sort
          )
          [ "${#MANIFESTS[@]}" -gt 0 ] || { echo "No Release manifests for commit"; exit 1; }
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tools/index_run_manifest.py --compact-existing
            python tools/index_run_manifest.py "${MANIFESTS[@]}"
            python tools/build_catalog_metrics.py
            python tools/build_quarantine_audit.py
            python tools/check_dataset_quality.py
            git add catalog datasets
            if git diff --cached --quiet; then
              echo "Catalog already durably reconciled at $(git rev-parse HEAD)."
              published=true
              break
            fi
            git commit -m "data: reconcile V2 catalog from canonical releases"
            if git push origin HEAD:main; then
              echo "Durable reconciliation pushed: $(git rev-parse HEAD)"
              published=true
              break
            fi
            echo "Concurrent update detected; rebuilding from immutable manifests (attempt $attempt)."
            sleep $((attempt * 3))
          done
          if [ "$published" != true ]; then
            echo "::error::Reconciliation not published after 5 independent rebuilds"
            exit 1
          fi

      - name: Dispatch health receipts after durable catalog publication
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run dataset-health-receipt.yml             --repo "$GITHUB_REPOSITORY"             --ref main

      - name: Continue bounded historical reconciliation when backlog remains
        if: env.RUN_MANIFEST_COUNT != '0' && env.REMAINING_NEW_TAGS != '0'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run reconcile-v2-catalog.yml             --repo "$GITHUB_REPOSITORY"             --ref main
