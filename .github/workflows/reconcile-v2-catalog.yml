name: reconcile-v2-catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-v2-catalog.yml'
      - 'tools/index_run_manifest.py'
      - 'tools/manifest_policy.py'
      - 'tools/check_dataset_quality.py'
      - 'tests/test_dataset_policy.py'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-v2-control-plane-index
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dataset control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Download only new production V2 run manifests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v2-release-manifests"
          ALL_TAGS="$RUNNER_TEMP/v2-all-release-tags.txt"
          TAGS="$RUNNER_TEMP/v2-new-release-tags.txt"
          gh release list             --repo "$GITHUB_REPOSITORY"             --limit 1000             --json tagName             --jq '.[].tagName'             > "$ALL_TAGS"
          python - <<'PY' "$ALL_TAGS" "$TAGS"
          import json,re,sys
          from pathlib import Path
          all_path,out_path=map(Path,sys.argv[1:])
          index=json.loads(Path("catalog/DATA_INDEX.json").read_text(encoding="utf-8"))
          known={
              str(row.get("release_tag"))
              for row in (index.get("shards") or [])
              if isinstance(row,dict) and row.get("release_tag")
          }
          allowed=re.compile(r"^(data-v2-|copy-vault-v2-|archive-v2-|event-intelligence-v2-)")
          tags=[
              line.strip()
              for line in all_path.read_text(encoding="utf-8").splitlines()
              if line.strip() and allowed.match(line.strip()) and line.strip() not in known
          ]
          out_path.write_text("\n".join(tags)+("\n" if tags else ""),encoding="utf-8")
          print(f"new_release_tags={len(tags)}")
          PY
          if [ ! -s "$TAGS" ]; then
            echo "RUN_MANIFEST_COUNT=0" >> "$GITHUB_ENV"
            echo "No new production releases to reconcile."
            exit 0
          fi
          python tools/download_release_manifests.py             --repository "$GITHUB_REPOSITORY"             --destination "$ROOT"             --tags-file "$TAGS"             --attempts 6             --poll-seconds 5
          COUNT="$(find "$ROOT" -name RUN_MANIFEST.json -type f | wc -l)"
          echo "RUN_MANIFEST_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "new production run manifests found: $COUNT"

      - name: Rebuild control-plane index from verified production releases
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t MANIFESTS < <(
            find "$RUNNER_TEMP/v2-release-manifests"               -name RUN_MANIFEST.json -type f | sort
          )
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No production manifests downloaded."
            exit 0
          fi
          python tools/index_run_manifest.py "${MANIFESTS[@]}"

      - name: Build exact catalog metrics after reconciliation
        if: env.RUN_MANIFEST_COUNT != '0'
        run: python tools/build_catalog_metrics.py

      - name: Validate rebuilt control plane
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_dataset_quality.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests

      - name: Commit reconciled catalog
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog datasets
          if git diff --cached --quiet; then
            echo "Catalog already reconciled."
            exit 0
          fi
          git commit -m "data: reconcile V2 catalog from production releases"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish reconciled V2 catalog."
          exit 1
