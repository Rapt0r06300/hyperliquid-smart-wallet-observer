name: tmp-lead-lag-refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-lead-lag-refactor.yml
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer dépendances exactes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Extraire primitives mesurées Lead-Lag
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/hl_observer/simulation/lead_lag_measured_replay.py')
          helper = Path('src/hl_observer/simulation/lead_lag_execution_primitives.py')
          text = source.read_text(encoding='utf-8')
          start = text.index('\nDEFAULT_DECISIONS =')
          end = text.index('\ndef _segment_summary')
          block = text[start + 1:end].rstrip() + '\n'

          header = '''"""Measured causal execution primitives for Lead-Lag paper replay."""
          from __future__ import annotations

          import bisect
          import hashlib
          import json
          import math
          import statistics
          from collections.abc import Mapping, Sequence
          from pathlib import Path
          from typing import Any

          from hl_observer.economics.assumptions import CostComponentReceipt, ZeroCostReason
          from hl_observer.economics.families import build_lead_lag_contract

          '''
          header = '\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines()) + '\n'
          helper.write_text(header + block, encoding='utf-8')

          import_block = '''from hl_observer.simulation.lead_lag_execution_primitives import (
              ADMISSION_PREDECLARED_ALL_SIGNALS,
              ADMISSION_PRIOR_MEAN_POSITIVE,
              DEFAULT_FEE_BPS,
              DEFAULT_MAX_BOOK_AGE_MS,
              DEFAULT_MAX_EXECUTION_OBSERVATION_DELAY_MS,
              DEFAULT_MIN_LATENCY_SAMPLES,
              _book_for_execution,
              _latest_at_or_before,
              _number,
              _settle,
              load_runtime_latency_evidence,
          )
          '''
          import_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in import_block.splitlines()) + '\n'
          rewritten = text[:start] + '\n\n' + text[end + 1:]
          anchor = 'from hl_observer.ops import lab_metriques as M\n'
          rewritten = rewritten.replace(anchor, anchor + import_block, 1)
          source.write_text(rewritten, encoding='utf-8')
          PY
      - name: Vérifier structure et style
        run: |
          python -m ruff check --fix src/hl_observer/simulation/lead_lag_measured_replay.py src/hl_observer/simulation/lead_lag_execution_primitives.py
          python -m ruff check src/hl_observer/simulation/lead_lag_measured_replay.py src/hl_observer/simulation/lead_lag_execution_primitives.py
          python - <<'PY'
          from pathlib import Path
          for raw in (
              'src/hl_observer/simulation/lead_lag_measured_replay.py',
              'src/hl_observer/simulation/lead_lag_execution_primitives.py',
          ):
              count = len(Path(raw).read_text(encoding='utf-8').splitlines())
              print(f'{raw}={count}')
              if count > 800:
                  raise SystemExit(f'FILE_TOO_LARGE:{raw}:{count}')
          PY
      - name: Tests Lead-Lag ciblés
        run: |
          python -m pytest -q tests/test_lead_lag_measured_replay.py tests/test_lead_lag_multiasset_train.py
      - name: Vérifier invariants safety
        run: |
          python -m pytest -q tests/test_no_mainnet_execution.py tests/test_runtime_contract.py tests/test_coverage_closure_import_all.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lead-lag-refactor-${{ github.sha }}
          path: |
            src/hl_observer/simulation/lead_lag_measured_replay.py
            src/hl_observer/simulation/lead_lag_execution_primitives.py
      - name: Publier uniquement le refactor vérifié sur main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo "MAIN_MOVED_ABORT"; exit 1; }
          git diff --check -- src/hl_observer/simulation/lead_lag_measured_replay.py src/hl_observer/simulation/lead_lag_execution_primitives.py
          git add src/hl_observer/simulation/lead_lag_measured_replay.py src/hl_observer/simulation/lead_lag_execution_primitives.py
          git diff --cached --check
          git config user.name "alina-smartflow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: extract lead lag execution primitives"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA" || { echo "PARENT_MISMATCH_ABORT"; exit 1; }
          git push origin HEAD:main
