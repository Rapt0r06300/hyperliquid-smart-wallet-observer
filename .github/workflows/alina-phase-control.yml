name: alina-phase-control
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Canonical phase command"
        required: true
        type: choice
        options: [status, collect, analyze, idle]
      request_id:
        description: "Optional lowercase SHA-256 idempotency identity; generated automatically when empty"
        required: false
        type: string
      requested_by:
        description: "Operator identity"
        required: false
        default: "github-operator"
        type: string
permissions:
  actions: write
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate request and read current authority
        env:
          COMMAND: ${{ inputs.command }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [ "$COMMAND" != "status" ]; then
            if [ -n "$REQUEST_ID" ] && ! [[ "$REQUEST_ID" =~ ^[0-9a-f]{64}$ ]]; then
              echo "request_id must be exactly 64 lowercase hexadecimal characters when provided" >&2
              exit 2
            fi
            if [ -z "$REQUEST_ID" ]; then
              REQUEST_ID="$(printf '%s' "$COMMAND:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" | sha256sum | cut -d' ' -f1)"
              echo "REQUEST_ID=$REQUEST_ID" >> "$GITHUB_ENV"
            fi
          fi
          curl --fail-with-body --retry 4 --retry-all-errors \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Rapt0r06300/hyperliquid-smart-wallet-observer/contents/control/alina-phase.json \
            -o "$RUNNER_TEMP/phase-before.json"
          python -m json.tool "$RUNNER_TEMP/phase-before.json"
      - name: Dispatch canonical single-repository transition
        if: inputs.command != 'status'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ inputs.command }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          set -euo pipefail
          phase=$(printf '%s' "$COMMAND" | tr '[:lower:]' '[:upper:]')
          gh workflow run control-phase.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f phase="$phase" \
            -f request_id="$REQUEST_ID" \
            -f requested_by="$REQUESTED_BY"
      - name: Wait for durable authority receipt
        if: inputs.command != 'status'
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl --fail-with-body --retry 2 --retry-all-errors \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Rapt0r06300/hyperliquid-smart-wallet-observer/contents/control/alina-phase.json \
              -o "$RUNNER_TEMP/phase-after.json"
            if python - "$RUNNER_TEMP/phase-after.json" "$REQUEST_ID" <<'PY'
          import json, pathlib, sys
          row=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          required={"schema_version","phase","epoch","requested_at_utc","collection_started_at_utc","collection_cutoff_at_utc","source_collection_epoch","analysis_stage","requested_by","request_id"}
          if required-set(row):
              raise SystemExit(2)
          raise SystemExit(0 if row.get("request_id")==sys.argv[2] else 1)
          PY
            then
              python -m json.tool "$RUNNER_TEMP/phase-after.json"
              exit 0
            fi
            sleep 3
          done
          echo "Canonical transition receipt did not become visible before timeout" >&2
          exit 4
