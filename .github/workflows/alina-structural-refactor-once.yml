name: Alina structural refactor once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alina-structural-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tools
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      HL_ENABLE_MAINNET_EXECUTION: "0"
      HL_ENABLE_TESTNET_EXECUTION: "0"
      REAL_MAINNET_TRADING: "false"
      HYPERSMART_ENABLE_REAL_ORDERS: "0"
      ENABLE_REAL_ORDERS: "0"
      EXPECTED_PARENT: 95ea6de8b1ea005ebc011dd6120ebbcaae5310ba
      EXPECTED_SOURCE_BLOB: f28c4fd090b37280fce8fe6570614d93c3952aba
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object src/hl_observer/backtesting/lead_lag_shadow_economics.py)" = "$EXPECTED_SOURCE_BLOB"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Apply behavior-neutral extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/hl_observer/backtesting/lead_lag_shadow_economics.py")
          helper_path = Path("src/hl_observer/backtesting/lead_lag_shadow_temporal.py")
          source = source_path.read_text(encoding="utf-8")
          import_anchor = "from hl_observer.backtesting.robustesse_selection import pbo_cscv\n"
          helper_import = (
              "from hl_observer.backtesting.lead_lag_shadow_temporal import (\n"
              "    _placebo_direction,\n"
              "    _temporal_bounds,\n"
              ")\n"
          )
          if helper_import in source:
              raise SystemExit("helper import already present")
          if source.count(import_anchor) != 1:
              raise SystemExit("import anchor mismatch")
          start_marker = "\ndef _placebo_direction(coin: str, signal_ts_ns: int) -> float:\n"
          end_marker = "\ndef executable_campaign_evidence(\n"
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("temporal helper block markers mismatch")
          removed = source[start:end]
          if "def _temporal_bounds" not in removed or "placebo-v1" not in removed:
              raise SystemExit("unexpected helper block")
          source = source.replace(import_anchor, import_anchor + helper_import, 1)
          source = source[:start + len(helper_import)] if False else source
          # Re-find markers after the import insertion, then remove only helper definitions.
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          source = source[:start] + "\n" + source[end:]
          helper = '''"""Pure deterministic temporal helpers for Lead-Lag shadow economics."""
          from __future__ import annotations

          import hashlib


          def _placebo_direction(coin: str, signal_ts_ns: int) -> float:
              digest = hashlib.sha256(
                  f"{coin}|{signal_ts_ns}|placebo-v1".encode()
              ).digest()
              return 1.0 if digest[0] & 1 else -1.0


          def _temporal_bounds(
              signal_times: list[int], *, purge_ns: int
          ) -> dict[str, int | None]:
              ordered = sorted(set(int(value) for value in signal_times))
              if len(ordered) < 3:
                  return {
                      "train_end_ns": None,
                      "validation_start_ns": None,
                      "validation_end_ns": None,
                      "oos_start_ns": None,
                      "purge_ns": int(purge_ns),
                  }
              train_index = min(
                  len(ordered) - 2,
                  max(0, int(len(ordered) * 0.60) - 1),
              )
              validation_index = min(
                  len(ordered) - 1,
                  max(train_index + 1, int(len(ordered) * 0.80) - 1),
              )
              train_end = ordered[train_index]
              validation_end = ordered[validation_index]
              return {
                  "train_end_ns": train_end,
                  "validation_start_ns": train_end + int(purge_ns),
                  "validation_end_ns": validation_end,
                  "oos_start_ns": validation_end + int(purge_ns),
                  "purge_ns": int(purge_ns),
              }
          '''
          # Dedent the embedded helper while preserving deterministic content.
          import textwrap
          helper = textwrap.dedent(helper)
          source_path.write_text(source, encoding="utf-8")
          helper_path.write_text(helper, encoding="utf-8")
          source_lines = len(source.splitlines())
          helper_lines = len(helper.splitlines())
          if source_lines >= 800:
              raise SystemExit(f"source still giant: {source_lines}")
          if helper_lines >= 800:
              raise SystemExit(f"helper giant: {helper_lines}")
          print(f"line_counts source={source_lines} helper={helper_lines}")
          PY
      - name: Verify targeted behavior and architecture
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/hl_observer/backtesting/lead_lag_shadow_economics.py \
            src/hl_observer/backtesting/lead_lag_shadow_temporal.py
          mapfile -t TEST_FILES < <(rg -l 'lead_lag_shadow(_economics|_temporal)?' tests --glob 'test_*.py' | sort)
          test "${#TEST_FILES[@]}" -gt 0
          python -m pytest -q "${TEST_FILES[@]}"
          python -m pytest -q \
            tests/test_invariants_architecture.py::test_pas_de_nouveau_doublon_de_nom \
            tests/test_invariants_architecture.py::test_pas_de_nouvel_orphelin
          python - <<'PY'
          from pathlib import Path
          p = Path('src/hl_observer/backtesting/lead_lag_shadow_economics.py')
          assert len(p.read_text(encoding='utf-8').splitlines()) < 800
          PY
      - name: Commit verified extraction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/alina-structural-refactor-once.yml
          git status --short
          git config user.name "Rapt0r06300"
          git config user.email "bermond.florent06@gmail.com"
          git add src/hl_observer/backtesting/lead_lag_shadow_economics.py \
                  src/hl_observer/backtesting/lead_lag_shadow_temporal.py \
                  .github/workflows/alina-structural-refactor-once.yml
          git diff --cached --check
          git commit -m "refactor: extract lead-lag temporal helpers"
          git push origin HEAD:main
