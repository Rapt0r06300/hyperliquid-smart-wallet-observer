name: control-phase
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "IDLE, COLLECT or ANALYZE"
        required: true
        type: choice
        options: [IDLE, COLLECT, ANALYZE]
      request_id:
        description: "Idempotent operator request identity"
        required: true
        type: string
      requested_by:
        description: "Operator identity"
        required: false
        default: "github-operator"
        type: string
      cutoff_at_utc:
        description: "Optional UTC cutoff; defaults to runner UTC now"
        required: false
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: control-phase
  cancel-in-progress: false
jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply idempotent phase transition
        env:
          PHASE: "${{ inputs.phase }}"
          REQUEST_ID: "${{ inputs.request_id }}"
          REQUESTED_BY: "${{ inputs.requested_by }}"
          CUTOFF_AT_UTC: "${{ inputs.cutoff_at_utc }}"
        run: |
          set -euo pipefail
          args=(--phase "$PHASE" --request-id "$REQUEST_ID" --requested-by "$REQUESTED_BY")
          if [ -n "$CUTOFF_AT_UTC" ]; then
            args+=(--cutoff-at-utc "$CUTOFF_AT_UTC")
          fi
          python tools/set_phase.py "${args[@]}"
      - name: Publish phase authority
        env:
          COMMIT_PHASE: "${{ inputs.phase }}"
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/alina-phase.json control/phase-receipts
          git diff --cached --quiet && exit 0
          git commit -m "control: transition phase to $COMMIT_PHASE"
          python tools/publish_main_commit.py --remote origin --branch main
      - name: Materialize phase-owned campaigns
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
        run: gh workflow run create-resumable-campaigns.yml --repo "$REPOSITORY" --ref main
      - name: Wake bounded controller
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
        run: gh workflow run resumable-campaign-controller.yml --repo "$REPOSITORY" --ref main
