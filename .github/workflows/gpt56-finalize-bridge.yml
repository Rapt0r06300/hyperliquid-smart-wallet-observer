name: gpt56-finalize-bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-pr19:
    if: contains(github.event.head_commit.message, 'ci(finalize-bridge): run once for PR 19 hardening')
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src:tools
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      HL_ENABLE_MAINNET_EXECUTION: "0"
      HL_ENABLE_TESTNET_EXECUTION: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/finish-hypersmart-audit-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply final patches
        run: |
          python tools/finalize_gpt56_patch.py
          python tools/refactor_final_architecture.py
      - name: Verify targeted regressions
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_process_scope_final.py \
            tests/test_premier_lancement.py \
            tests/test_echec_silencieux.py \
            tests/test_invariants_architecture.py \
            tests/test_ui_simulation_status_fast.py \
            tests/test_session_harvest.py \
            tests/test_lead_lag_event_runtime_v2.py \
            tests/test_superviseur_collecteurs.py \
            tests/test_superviseur_profil_harvest.py \
            tests/test_superviseur_pids_atomique.py \
            tests/test_portable_clone.py
          git diff --check
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/start_hypersmart_simulation.ps1 src/hl_observer tests/test_ui_simulation_status_fast.py
          git commit -m "fix(finalize): close process, portability and architecture gaps"
          git push origin HEAD:gpt56/finish-hypersmart-audit-20260811
