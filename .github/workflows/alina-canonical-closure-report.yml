name: alina-canonical-closure-report
on:
  workflow_dispatch:
  schedule:
    - cron: "29 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/alina-canonical-closure-report.yml"
      - "tools/build_closure_report.py"
      - "tools/enrich_closure_data_exploitability.py"
      - "tools/generate_gate_registry.py"
      - "tools/validate_closure_receipt.py"
      - "tools/validate_gate_registry.py"
      - "src/hl_observer/control_plane/gate_registry.py"
      - "docs/event-intelligence-120-status.json"
      - "docs/source-capability-matrix.json"
      - "runtime/reports/economic_family_scoreboards.json"
      - "docs/canonical-spec-verification.json"
      - "docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md"
env:
  GH_TOKEN: "${{ github.token }}"

permissions:
  # contents: read is the baseline; publication jobs elevate only where required.
  contents: write
concurrency:
  group: alina-canonical-closure-report
  # The report is a snapshot of the current canonical main head. A newer run should
  # supersede an older snapshot rather than queue behind it and later fight the
  # branch tip with a stale generated receipt.
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build conservative closure report
        run: |
          set -euo pipefail
          PYTHONPATH=src python tools/generate_gate_registry.py
          python tools/validate_gate_registry.py
          python tools/build_closure_report.py \
            --dataset-root . \
            --main-head "$(git rev-parse HEAD)" \
            --dataset-head "$(git rev-parse HEAD)" \
            --canonical-spec-blob "$(git rev-parse HEAD:docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md)"
          python tools/enrich_closure_data_exploitability.py
      - name: Validate gate and closure receipts
        run: |
          python tools/validate_gate_registry.py
          python tools/validate_closure_receipt.py
      - name: Publish closure report from latest canonical head
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          gh auth setup-git

          for attempt in 1 2 3 4 5; do
            # The canonical repository may advance while this report is being built.
            # Always rebuild from its latest durable main head before push.
            git fetch origin main
            git reset --hard origin/main
            
            PYTHONPATH=src python tools/generate_gate_registry.py
            python tools/validate_gate_registry.py
            python tools/build_closure_report.py \
              --dataset-root . \
              --main-head "$(git rev-parse HEAD)" \
              --dataset-head "$(git rev-parse HEAD)" \
              --canonical-spec-blob "$(git rev-parse HEAD:docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md)"
            python tools/enrich_closure_data_exploitability.py
            python tools/validate_gate_registry.py
            python tools/validate_closure_receipt.py

            git add docs/alina-closure-report.json docs/normative-gate-registry.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "closure: publish canonical single-repository status report"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1
