name: canonical-spec-verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/canonical-spec-verification.yml"
      - "tools/build_closure_report.py"
      - "tools/validate_closure_receipt.py"
      - "tools/generate_gate_registry.py"
      - "tools/validate_gate_registry.py"
      - "tools/validate_event_intelligence_status.py"
      - "tools/validate_github_hosted_workflows.py"
      - "src/hl_observer/control_plane/**"
      - "src/hl_observer/datasets/**"
      - "src/hl_observer/simulation/economic_family_scoreboard.py"
      - "tests/test_build_closure_current_scoreboard.py"
      - "tests/test_closure_report_current_epoch.py"
      - "tests/test_dataset_economic_runner_purity.py"
      - "tests/test_dataset_economic_runner_wrapper.py"
      - "tests/test_dataset_economic_source_wiring.py"
      - "tests/test_backtest_live_parity.py"
      - "tests/test_historical_live_schema_parity.py"
      - "tests/test_economic_campaigns.py"
      - "tests/test_economic_family_scoreboard.py"
      - "tests/test_event_intelligence_complete120.py"
      - "tests/test_collect_cloud_copy_vault.py"
      - "tests/test_cross_venue_certified.py"
      - "tests/test_final_lead_lag_lanes_and_bbo.py"
  schedule:
    - cron: "11 4 * * *"

permissions:
  contents: write

concurrency:
  group: canonical-spec-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Rapt0r06300/alina-smartflow-datasets-v2
          ref: main
          path: dataset-v2
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deterministic test runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Execute canonical verification groups
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/canonical-spec-results"

          run_group() {
            NAME="$1"
            shift
            LOG="$RUNNER_TEMP/canonical-spec-results/$NAME.log"
            set +e
            "$@" >"$LOG" 2>&1
            RC=$?
            set -e
            python - "$NAME" "$RC" "$LOG" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          name,rc,log=sys.argv[1],int(sys.argv[2]),Path(sys.argv[3])
          raw=log.read_bytes() if log.exists() else b""
          row={
              "name":name,
              "returncode":rc,
              "status":"PASS" if rc==0 else "FAIL",
              "output_sha256":hashlib.sha256(raw).hexdigest(),
              "output_tail":raw.decode("utf-8",errors="replace")[-4000:],
          }
          Path(log.with_suffix(".json")).write_text(json.dumps(row,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY
            return 0
          }

          run_group main_validators bash -lc             'PYTHONPATH=src python tools/generate_gate_registry.py &&
             python tools/validate_gate_registry.py &&
             python tools/validate_event_intelligence_status.py &&
             python tools/validate_github_hosted_workflows.py'

          run_group main_control_and_closure python -m pytest -q             tests/test_build_closure_current_scoreboard.py             tests/test_closure_report_current_epoch.py             tests/test_ci_workflows.py

          run_group main_parity_and_economics python -m pytest -q             tests/test_dataset_economic_runner_purity.py             tests/test_dataset_economic_runner_wrapper.py             tests/test_dataset_economic_source_wiring.py             tests/test_backtest_live_parity.py             tests/test_historical_live_schema_parity.py             tests/test_economic_campaigns.py             tests/test_economic_family_scoreboard.py

          run_group main_module_wiring python -m pytest -q             tests/test_event_intelligence_complete120.py             tests/test_collect_cloud_copy_vault.py             tests/test_cross_venue_certified.py             tests/test_final_lead_lag_lanes_and_bbo.py

          run_group dataset_control bash -lc             'cd dataset-v2 &&
             python -m pytest -q
               tests/test_analysis_stage_gates.py
               tests/test_campaign_manifest_json.py
               tests/test_campaign_watchdog_drain.py
               tests/test_finalize_analysis_drain.py
               tests/test_workflow_bounds.py'

          run_group dataset_data_and_recovery bash -lc             'cd dataset-v2 &&
             python -m pytest -q
               tests/test_exact_trade_count_backfill.py
               tests/test_global_unique_trade_backfill.py
               tests/test_replay_compatibility.py
               tests/test_current_scoreboard_closure.py
               tests/test_persist_analysis_scoreboard.py
               tests/test_augment_campaign_result.py'

          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from datetime import datetime,timezone
          from pathlib import Path

          result_dir=Path(os.environ["RUNNER_TEMP"])/"canonical-spec-results"
          groups=[]
          for path in sorted(result_dir.glob("*.json")):
              groups.append(json.loads(path.read_text(encoding="utf-8")))
          status="PASS" if groups and all(row["status"]=="PASS" for row in groups) else "FAIL"
          main_head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          dataset_head=subprocess.check_output(["git","-C","dataset-v2","rev-parse","HEAD"],text=True).strip()
          body={
              "schema":"alina.canonical_spec_verification.v1",
              "generated_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
              "main_alina_head":main_head,
              "dataset_v2_head":dataset_head,
              "runner_os":platform.platform(),
              "runner_architecture":platform.machine(),
              "python_version":platform.python_version(),
              "groups":groups,
              "status":status,
              "paper_only":True,
              "read_only":True,
              "real_execution":False,
              "self_hosted_used":False,
          }
          body["receipt_digest"]=hashlib.sha256(
              json.dumps(body,sort_keys=True,separators=(",",":")).encode()
          ).hexdigest()
          Path("docs/canonical-spec-verification.json").write_text(
              json.dumps(body,sort_keys=True,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps({"status":status,"groups":len(groups),"receipt_digest":body["receipt_digest"]},sort_keys=True))
          PY

      - name: Publish canonical verification receipt
        if: always()
        run: |
          set -euo pipefail
          test -f docs/canonical-spec-verification.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/canonical-spec-verification.json docs/normative-gate-registry.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "verification: publish canonical spec receipt"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1

      - name: Fail closed on verification errors
        if: always()
        run: |
          python - <<'PY'
          import json
          row=json.load(open("docs/canonical-spec-verification.json",encoding="utf-8"))
          if row.get("status")!="PASS":
              raise SystemExit("canonical spec deterministic verification failed")
          PY
