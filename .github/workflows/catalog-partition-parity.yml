name: catalog-partition-parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-partition-parity.yml'
      - 'tools/partitioned_data_index.py'
      - 'tools/index_run_manifest.py'
      - 'tools/build_catalog_metrics.py'
      - 'tools/build_quarantine_audit.py'
      - 'tools/repair_stale_safe_classifications.py'
      - 'tools/enforce_safe_replay_invariant.py'
      - 'tools/preservation_inventory.py'
      - 'tools/audit_recovery_sources.py'
      - 'tools/verify_recovery_bundle.py'
      - 'tools/probe_recovery_cache.py'
      - 'tools/hydrate_recovery_assets.py'
      - 'tools/recover_one_quarantined_shard.py'
      - 'tools/verify_quarantine_recovery.py'
      - 'tools/reinspect_recovered_quarantine.py'
      - 'tools/recheck_recovered_trade_reference.py'
      - 'tools/fetch_published_restore_inventory.py'
      - 'tools/check_dataset_quality.py'
      - 'src/hl_observer/collection/trade_reconciliation.py'
      - 'tools/restore_alina.py'
      - 'tests/test_partitioned_data_index.py'
      - 'tests/test_preservation_inventory.py'
      - 'tests/test_recovery_source_audit.py'
      - 'tests/test_verify_recovery_bundle.py'
      - 'tests/test_probe_recovery_cache.py'
      - 'tests/test_hydrate_recovery_assets.py'
      - 'tests/test_recover_one_quarantined_shard.py'
      - 'tests/test_verify_quarantine_recovery.py'
      - 'tests/test_reinspect_recovered_quarantine.py'
      - 'tests/test_bitget_reference_gap_recovery.py'
      - 'tests/test_recheck_recovered_trade_reference.py'
      - 'tests/test_fetch_published_restore_inventory.py'
      - 'tests/test_reclassification_history_preservation.py'
      - 'tests/test_enforce_safe_replay_preservation.py'
      - 'tests/test_run_indexing.py'
      - 'tests/test_workflow_bounds.py'
      - 'tests/test_dataset_metrics.py'
      - 'tests/test_dataset_policy.py'
      - 'tests/test_quarantine_audit.py'
      - 'tests/test_restore_alina.py'
  workflow_dispatch:
    inputs:
      emit_recovery_triage:
        description: "Export a read-only, SHA-bound repair triage for Work/Codex"
        required: false
        type: boolean
        default: false
      hydrate_candidate_id:
        description: "Optional single non-SAFE dataset_id to recover into GitHub-hosted quarantine"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Explicit one-shard recovery must not wait for heavy catalog parity jobs.
  # Push-time parity remains serialized; manually requested recovery is isolated.
  group: catalog-partition-parity-${{ (github.event_name == 'workflow_dispatch' && inputs.hydrate_candidate_id != '' || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'recovery-pilot:')) && github.run_id || 'catalog' }}
  cancel-in-progress: false

jobs:
  prove:
    # A recovery-only dispatch should not also run the expensive full-catalog proof.
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.emit_recovery_triage || inputs.hydrate_candidate_id == '') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'recovery-pilot:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable HEAD on GitHub-hosted runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Synthetic parity, tamper and duplicate tests
        run: |
          # Importing hl_observer.collection loads other declared runtime
          # dependencies (including websockets). Install the paper/read-only
          # project's actual dependency contract, not only httpx.
          python -m pip install --disable-pip-version-check pytest -e .
          python -m pytest -q tests/test_partitioned_data_index.py tests/test_preservation_inventory.py tests/test_reclassification_history_preservation.py tests/test_enforce_safe_replay_preservation.py tests/test_recovery_source_audit.py tests/test_verify_recovery_bundle.py tests/test_fetch_published_restore_inventory.py tests/test_probe_recovery_cache.py tests/test_hydrate_recovery_assets.py tests/test_recover_one_quarantined_shard.py tests/test_verify_quarantine_recovery.py tests/test_reinspect_recovered_quarantine.py
          python -m pip install --disable-pip-version-check httpx==0.28.1
          PYTHONPATH=src python -m pytest -q tests/test_bitget_reference_gap_recovery.py tests/test_recheck_recovered_trade_reference.py

      - name: Prove exact logical roundtrip of entire DATA_INDEX without publishing partitions
        shell: bash
        run: |
          set -euo pipefail
          python tools/partitioned_data_index.py \
            --index catalog/DATA_INDEX.json \
            --output "$RUNNER_TEMP/alina-partition-proof" \
            | tee "$RUNNER_TEMP/partition-proof.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"alina-partition-proof"/"PARTITION_PROOF.json"
          receipt=json.loads(path.read_text())
          assert receipt["status"] == "VERIFIED", receipt
          assert receipt["source_unchanged"] is True
          assert receipt["original_shards"] == receipt["partitioned_shards"]
          assert receipt["partition_count"] >= 1
          print("FULL_CATALOG_PARTITION_PARITY_PROVED", receipt["original_shards"])
          PY

      # Optional, explicitly requested read-only export. Do not produce a large
      # artifact on every push; collection and publication remain untouched.
      - name: Build and verify exact recovery triage for Work
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emit_recovery_triage }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/alina-preservation-evidence"
          mkdir -p "$OUT"
          test ! -e "$OUT/recovery-triage.jsonl"
          git rev-parse HEAD > "$OUT/git-head.txt"
          python tools/preservation_inventory.py \
            --triage-jsonl "$OUT/recovery-triage.jsonl" \
            > "$OUT/preservation-census.json"
          python tools/preservation_inventory.py \
            --verify-triage-jsonl "$OUT/recovery-triage.jsonl" \
            > "$OUT/triage-verification.json"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          root=Path(os.environ["RUNNER_TEMP"])/"alina-preservation-evidence"
          census=json.loads((root/"preservation-census.json").read_text())
          proof=json.loads((root/"triage-verification.json").read_text())
          verified=proof.get("triage") or {}
          initial=census.get("triage") or {}
          assert census["status"] == "CATALOG_CLASSIFIED_NOT_RESTORED"
          assert proof["status"] == census["status"]
          assert verified.get("status") == "TRIAGE_VERIFIED_NOT_RESTORED"
          assert initial["candidate_count"] == verified["candidate_count"]
          assert initial["candidates_sha256"] == verified["candidates_sha256"]
          assert census["catalog_index_sha256"] == verified["catalog_index_sha256"]
          assert census["all_exploitable_data_restored"] is False
          print("TRIAGE_LEDGER_VERIFIED_NOT_RESTORED", verified["candidate_count"])
          PY

      - name: Verify published Release source snapshot against unresolved shards
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emit_recovery_triage }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/alina-preservation-evidence"
          python tools/fetch_published_restore_inventory.py \
            --output "$OUT/RESTORE_INVENTORY.json.gz" \
            > "$OUT/published-inventory-source.json"
          python tools/audit_recovery_sources.py \
            --triage-jsonl "$OUT/recovery-triage.jsonl" \
            --source-inventory "$OUT/RESTORE_INVENTORY.json.gz" \
            --details-jsonl "$OUT/source-comparison.jsonl" \
            > "$OUT/source-comparison-report.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"alina-preservation-evidence"
          source=json.loads((root/"published-inventory-source.json").read_text())
          comparison=json.loads((root/"source-comparison-report.json").read_text())
          triage=json.loads((root/"triage-verification.json").read_text())["triage"]
          assert source["status"] == "PUBLISHED_INVENTORY_ASSET_SHA256_VERIFIED_NOT_RESTORED"
          assert source["raw_market_payloads_downloaded"] == 0
          assert comparison["status"] == "SOURCE_SNAPSHOT_COMPARED_NOT_RESTORED"
          assert comparison["catalog_index_sha256"] == triage["catalog_index_sha256"]
          assert comparison["candidate_count"] == triage["candidate_count"]
          assert comparison["all_exploitable_data_restored"] is False
          assert comparison["recovered_shards"] is None
          import hashlib
          payload=(root/"source-comparison.jsonl").read_bytes()
          assert hashlib.sha256(payload).hexdigest() == comparison["source_comparison_jsonl_sha256"]
          print("UNRESOLVED_SOURCE_LOCATORS_COMPARED", comparison["candidate_count"])
          PY

      - name: Seal and verify Work recovery transfer receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emit_recovery_triage }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/alina-preservation-evidence"
          python tools/verify_recovery_bundle.py --root "$OUT" --write
          python tools/verify_recovery_bundle.py --root "$OUT" --verify

      - name: Publish verified recovery triage as short-lived Actions artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emit_recovery_triage }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alina-recovery-triage-${{ github.run_id }}
          path: ${{ runner.temp }}/alina-preservation-evidence/
          retention-days: 30
          if-no-files-found: error

      - name: Dry-run all critical SAFE consumers on partitioned index (never push)
        shell: bash
        run: |
          set -euo pipefail
          # This job owns a disposable checkout. The canonical GitHub main is
          # never altered; a failure blocks any production partition migration.
          cp catalog/DATA_METRICS.json "$RUNNER_TEMP/legacy-data-metrics.json"
          test ! -L catalog/data-index-parts
          # The source may already be partitioned: preserve originals in the
          # disposable hosted checkout, and layer the proven parts over them.
          mkdir -p catalog/data-index-parts
          cp -a "$RUNNER_TEMP/alina-partition-proof/data-index-parts/." catalog/data-index-parts/
          cp "$RUNNER_TEMP/alina-partition-proof/DATA_INDEX.json" catalog/DATA_INDEX.json
          python tools/build_catalog_metrics.py
          python tools/build_quarantine_audit.py
          python tools/check_dataset_quality.py
          python tools/build_replay_compatibility_reasons.py
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.restore_alina import _load_current_safe_catalog
          previous=json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("legacy-data-metrics.json").read_text())
          current=json.loads(Path("catalog/DATA_METRICS.json").read_text())
          assert previous["totals"] == current["totals"], "PARTITION_METRICS_TOTALS_CHANGED"
          safe,verification=_load_current_safe_catalog(
              Path("catalog/DATA_INDEX.json"), Path("catalog/DATA_METRICS.json"))
          assert len(safe) == current["totals"]["SAFE_SHARDS"]
          assert verification["indexed_shards"] == current["totals"]["TOTAL_SHARDS"]
          print("PARTITION_SAFE_CONSUMERS_PROVED", len(safe), verification["indexed_shards"])
          PY
          python -m pytest -q \
            tests/test_partitioned_data_index.py \
            tests/test_dataset_metrics.py \
            tests/test_dataset_policy.py \
            tests/test_quarantine_audit.py \
            tests/test_restore_alina.py
          # The next actual publication must be a separately validated atomic
          # Git commit containing both the root and all referenced parts.

  recover-one:
    # One GitHub-hosted read-only worker: manual selected shard or one
    # deliberately designated pilot commit, never routine collection pushes.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.hydrate_candidate_id != '') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'recovery-pilot:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout canonical index and recovery tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            catalog
            tools
            src
            pyproject.toml
            README.md

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Recover one byte-verified historical fragment into isolated quarantine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_DATASET_ID: ${{ inputs.hydrate_candidate_id }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/alina-selected-quarantine"
          mkdir -p "$OUTPUT"
          LIMIT=100000000
          if [ -z "$SELECTED_DATASET_ID" ]; then
            # Only an explicitly prefixed pilot commit can reach this path.
            LIMIT=4000000
            python tools/recover_one_quarantined_shard.py \
              --select-pilot --max-source-bytes "$LIMIT" \
              --max-live-attempts 12 > "$OUTPUT/PILOT_SELECTION.json"
            SELECTED_DATASET_ID="$(python -c 'import json,re,sys; p=json.load(open(sys.argv[1])); ident=p["dataset_id"]; assert p["status"]=="LIVE_SOURCE_MATCHED_NOT_DOWNLOADED" and p["source_asset_bytes"]<=4000000 and p["replay_certified"] is False and re.fullmatch(r"[A-Za-z0-9._-]{1,200}",ident); print(ident)' "$OUTPUT/PILOT_SELECTION.json")"
          fi
          test -n "$SELECTED_DATASET_ID"
          printf 'SELECTED_DATASET_ID=%s\n' "$SELECTED_DATASET_ID" >> "$GITHUB_ENV"
          python tools/recover_one_quarantined_shard.py \
            --dataset-id "$SELECTED_DATASET_ID" \
            --destination "$OUTPUT" \
            --max-source-bytes "$LIMIT" \
            --download > "$OUTPUT/RECOVERY_RESULT.json"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"alina-selected-quarantine"
          report=json.loads((root/"RECOVERY_RESULT.json").read_text())
          assert report["status"] == "BYTE_VERIFIED_QUARANTINED_NOT_REPLAY_CERTIFIED"
          assert report["validation_allowed"] is False
          assert report["replay_certified"] is False
          assert report["reclassified_safe"] is False
          assert len(report["catalog_index_sha256"]) == 64
          assert report["source_repository"] == "Rapt0r06300/hyperliquid-smart-wallet-observer"
          assert isinstance(report["source_asset_id"], int)
          assert report["original_quality_status"] in {"PARTIAL","REJECT","STALE","SAFE"}
          assert report["outer_bytes"] <= 100000000
          assert report["logical_bytes"] <= 100000000
          path=root/report["quarantine_file"]
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest == report["logical_sha256"]
          assert path.stat().st_size == report["logical_bytes"]
          receipts=list((root/"quarantine"/"source_verified_non_replay").glob("*.receipt.json"))
          assert len(receipts) == 1
          proof=json.loads(receipts[0].read_text())
          assert proof["catalog_index_sha256"] == report["catalog_index_sha256"]
          assert proof["logical_sha256"] == digest
          assert proof["source_asset_id"] == report["source_asset_id"]
          print("BYTE_VERIFIED_QUARANTINED_NOT_REPLAY_CERTIFIED", report["dataset_id"])
          PY

      - name: Verify SHA-bound recovered byte coverage
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/alina-selected-quarantine"
          python tools/verify_quarantine_recovery.py \
            --destination "$OUTPUT" > "$OUTPUT/QUARANTINE_COVERAGE.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"alina-selected-quarantine"/"QUARANTINE_COVERAGE.json").read_text())
          assert result["invalid_or_stale_receipts"] == 0
          assert result["byte_verified_non_safe_shards"] == 1
          assert result["replay_certified"] is False
          assert result["all_exploitable_data_restored"] is False
          print("QUARANTINE_BYTES_VERIFIED_NOT_REPLAY_CERTIFIED")
          PY

      - name: Reinspect recovered shard content with original replay verifier
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/alina-selected-quarantine"
          python tools/reinspect_recovered_quarantine.py \
            --dataset-id "$SELECTED_DATASET_ID" \
            --destination "$OUTPUT" \
            --max-uncompressed-bytes 256000000 \
            > "$OUTPUT/REPLAY_CONTENT_INSPECTION.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          receipt=json.loads((Path(os.environ["RUNNER_TEMP"])/
                             "alina-selected-quarantine"/
                             "REPLAY_CONTENT_INSPECTION.json").read_text())
          assert receipt["status"] in {
            "CONTENT_REPLAY_CHECK_PASSED_NOT_SAFE",
            "CONTENT_REPLAY_CHECK_FAILED_NOT_SAFE",
          }
          assert receipt["byte_coverage_verified"] is True
          assert receipt["validation_allowed"] is False
          assert receipt["replay_certified"] is False
          assert receipt["reclassified_safe"] is False
          assert receipt["cross_shard_continuity_proven"] is False
          print("NON_SAFE_REPLAY_CONTENT_INSPECTED", receipt["inspection"]["replay_reason"])
          PY

      - name: Recheck the existing official Bitget trade reconciliation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/alina-selected-quarantine"
          # Include transitive imports of the canonical collection module.
          # The discovery-only ccxt extra is deliberately not installed.
          python -m pip install --disable-pip-version-check -e . httpx==0.28.1
          PYTHONPATH=src python tools/recheck_recovered_trade_reference.py \
            --dataset-id "$SELECTED_DATASET_ID" \
            --destination "$OUTPUT" \
            --max-pages 8 > "$OUTPUT/OFFICIAL_REFERENCE_RECHECK.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"alina-selected-quarantine"/"OFFICIAL_REFERENCE_RECHECK.json"
          result=json.loads(p.read_text())
          assert result["validation_allowed"] is False
          assert result["replay_certified"] is False
          assert result["reclassified_safe"] is False
          assert result["reference_recheck_repair_count"] == 0
          assert result["status"] in {
            "REFERENCE_NOT_APPLICABLE",
            "OFFICIAL_REFERENCE_MATCHED_NOT_SAFE",
            "OFFICIAL_REFERENCE_INCOMPLETE_NOT_SAFE",
            "OFFICIAL_REFERENCE_UNAVAILABLE_NOT_SAFE",
          }
          print("REFERENCE_RECHECK_NOT_PROMOTED", result["status"])
          PY

      - name: Export verified quarantine proof for Work
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alina-selected-quarantined-shard-${{ github.run_id }}
          path: ${{ runner.temp }}/alina-selected-quarantine/
          retention-days: 30
          if-no-files-found: error
