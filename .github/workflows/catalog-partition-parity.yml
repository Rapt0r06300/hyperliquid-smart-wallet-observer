name: catalog-partition-parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-partition-parity.yml'
      - 'tools/catalog_index_partitions.py'
      - 'tests/test_catalog_index_partitions.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: catalog-partition-parity
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable HEAD on GitHub-hosted runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Synthetic parity, tamper and duplicate tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_catalog_index_partitions.py

      - name: Prove complete existing DATA_INDEX partition roundtrip without publishing it
        shell: bash
        run: |
          set -euo pipefail
          python tools/catalog_index_partitions.py \
            --index catalog/DATA_INDEX.json \
            --output "$RUNNER_TEMP/alina-partition-check" \
            | tee "$RUNNER_TEMP/partition-build.json"
          python tools/catalog_index_partitions.py \
            --index catalog/DATA_INDEX.json \
            --output "$RUNNER_TEMP/alina-partition-check" \
            | tee "$RUNNER_TEMP/partition-verify.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          created=json.loads((base/"partition-build.json").read_text())
          verified=json.loads((base/"partition-verify.json").read_text())
          assert created["status"] == "VERIFIED_NEW", created
          assert verified["status"] == "VERIFIED_EXISTING", verified
          assert created["shards"] == verified["shards"], (created, verified)
          assert created["source_index_sha256"] == verified["source_index_sha256"]
          print("PARTITION_ROUNDTRIP_OK", created["shards"], created["partitions"])
          PY
