name: clone-payload-fresh-clone-proof

on:
  workflow_dispatch:
    inputs:
      confirm_lfs_bandwidth:
        description: "I accept that this fresh clone downloads the full Git LFS payload"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "37 5 * * 0"

permissions:
  contents: read

concurrency:
  group: clone-payload-fresh-clone-proof
  cancel-in-progress: false

jobs:
  fresh-clone:
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_lfs_bandwidth == true) || (github.event_name == 'schedule' && vars.ALINA_LFS_MIRROR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: "${{ github.token }}"
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Checkout canonical main and materialize Git LFS payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prove Release-to-LFS byte parity
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_clone_payload_completeness.py             --repository "$GITHUB_REPOSITORY"             --root .             --require-complete             --output "$RUNNER_TEMP/source-vs-lfs.json"

      - name: Prove fresh checkout contains real payload bytes
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_materialized_clone.py             --root .             --require-complete             --output "$RUNNER_TEMP/materialized-clone.json"

      - name: Upload clone proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clone-complete-proof
          path: |
            ${{ runner.temp }}/source-vs-lfs.json
            ${{ runner.temp }}/materialized-clone.json
          if-no-files-found: warn
          retention-days: 30
