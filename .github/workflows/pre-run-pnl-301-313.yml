name: pre-run-pnl-301-313

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pre-run-pnl-301-313-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NO_COLOR: "1"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  TESTNET_EXECUTION_ENABLED: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  preuves-pnl-301-313:
    name: Preuves PnL canoniques 301-313
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer dependances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Prouver cible +4 independante et taxonomie 775
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-pnl-301-313.xml tests/test_economic_objective.py tests/test_pre_run_pnl_301_313.py
      - name: Audits securite finaux
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pre-run-pnl-301-313-${{ github.sha }}
          path: junit-pre-run-pnl-301-313.xml
          if-no-files-found: error
          retention-days: 30
