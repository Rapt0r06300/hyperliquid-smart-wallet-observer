name: alpha-factory
# FIX-55 : la Factory est OBSERVABLE au HEAD, sur Linux ET Windows, avec JUnit + artefacts + bornes.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  factory-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install (BLOQUANT)
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-recherche.txt pytest
      - name: Factory tests (JUnit)
        run: python -m pytest tests/test_run_factory.py tests/test_factory_coverage.py -q --junitxml=reports/factory-linux.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-linux-junit
          path: reports/factory-linux.xml
  factory-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install (BLOQUANT)
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-recherche.txt pytest
      - name: Factory tests (JUnit)
        run: python -m pytest tests/test_run_factory.py tests/test_factory_coverage.py -q --junitxml=reports/factory-windows.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-windows-junit
          path: reports/factory-windows.xml
