name: coverage-parallel-probe

on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/**/*.py'
      - 'tests/test_coverage_closure_*.py'
      - '.github/workflows/coverage-parallel-probe.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: coverage-parallel-probe-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  coverage-parallel:
    name: Coverage complet parallèle — probe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publier le probe en cours
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"hypersmart/coverage-parallel-probe\",\"description\":\"Mesure coverage parallèle en cours\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer dépendances exactes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
          python -m pip install pytest-cov==7.1.0 pytest-xdist==3.8.0
      - name: Suite complète parallèle sous coverage
        run: |
          python -m pytest -q -p no:cacheprovider --tb=no -n 2 --dist=loadfile \
            --cov=src --cov-report=json:coverage.json --durations=25
      - name: Rapport exact des gaps
        if: always()
        run: |
          test -s coverage.json
          python tools/coverage_gap_report.py
      - name: Cliquet 100 pour le probe
        if: always()
        run: python tools/check_coverage_ratchet.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-parallel-probe-${{ github.sha }}
          path: |
            coverage.json
            coverage-gaps.json
            coverage-gaps.md
          if-no-files-found: warn
          retention-days: 14
      - name: Publier le verdict du probe
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          DESCRIPTION="Probe coverage parallèle rouge"
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE=success
            DESCRIPTION="Probe coverage parallèle 100% vert"
          fi
          STATE="$STATE" DESCRIPTION="$DESCRIPTION" python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "hypersmart/coverage-parallel-probe",
              "description": os.environ["DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
