name: github-hosted-runner-firewall
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/validate_github_hosted_workflows.py"
permissions:
  contents: read
jobs:
  firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reject self-hosted runner targets
        run: python tools/validate_github_hosted_workflows.py
