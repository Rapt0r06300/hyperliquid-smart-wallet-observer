name: gpt56-heartbeat-patch

on:
  push:
    branches:
      - gpt56/fix-portable-release-output-20260811

permissions:
  contents: write

concurrency:
  group: gpt56-heartbeat-patch
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/fix-portable-release-output-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply exact heartbeat test patch
        run: python tools/patch_heartbeat_flake_gpt56.py
      - name: Prove heartbeat liveness regression
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_recherche_continue_launcher_resilience.py::test_dashboard_writes_a_heartbeat_each_second
          git diff --check
      - name: Commit only the verified test fix
        run: |
          if git diff --quiet -- tests/test_recherche_continue_launcher_resilience.py; then
            echo "No heartbeat patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_recherche_continue_launcher_resilience.py
          git commit -m "test(ci): make dashboard heartbeat liveness check scheduler-safe"
          git push origin HEAD:gpt56/fix-portable-release-output-20260811
