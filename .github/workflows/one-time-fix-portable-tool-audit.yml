name: one-time-fix-portable-tool-audit
on:
  push:
    branches: [rescue-codex-20260812]
    paths: [.github/workflows/one-time-fix-portable-tool-audit.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue-codex-20260812
          fetch-depth: 0
      - name: Apply exact patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git diff --check
          python -m pytest -q tests/test_audit_cablage.py tests/test_risk_guards_no_limbo.py::test_le_nombre_de_modules_MORTS_ne_doit_JAMAIS_remonter
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(audit): recognize portable Python tool entrypoints'
          git push origin HEAD:rescue-codex-20260812
