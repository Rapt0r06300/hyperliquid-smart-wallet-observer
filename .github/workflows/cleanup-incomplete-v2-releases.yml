name: cleanup-incomplete-v2-releases

# Dataset V2 is now stored in this single active repository.
# Automatic destructive release cleanup is intentionally disabled:
# immutable collection releases are evidence and must never be removed by a
# scheduled job. If a future cleanup is required, it must be implemented as an
# explicit, reviewed/manual maintenance action with its own proof/audit trail.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm safe unified-repository policy
        shell: bash
        run: |
          set -euo pipefail
          echo "SAFE: automatic destructive Dataset V2 release cleanup is disabled."
          echo "SAFE: collection/replay-grade GitHub Releases remain immutable evidence."
          echo "SAFE: single active repository is Rapt0r06300/hyperliquid-smart-wallet-observer."
          echo "No release or tag was modified."
