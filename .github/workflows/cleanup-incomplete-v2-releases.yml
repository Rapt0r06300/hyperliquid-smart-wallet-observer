name: principal-dataset-terminal-cleanup
run-name: principal dataset terminal deletion

on:
  workflow_dispatch:
    inputs:
      asset_limit:
        description: "Maximum terminal Release assets in this checkpoint"
        required: false
        default: "500"
  workflow_run:
    workflows: [backfill-replay-compatibility]
    types: [completed]
  schedule:
    - cron: "47 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/prune_irrecoverable_dataset.py"
      - "tests/test_prune_irrecoverable_dataset.py"
      - ".github/workflows/cleanup-incomplete-v2-releases.yml"

permissions:
  contents: write

concurrency:
  # A corrective push may replace a checkout-only obsolete wave. Automatic
  # workflow/schedule events never interrupt an active deletion transaction.
  group: principal-dataset-terminal-cleanup
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  delete-terminal:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /catalog/*.json
            /catalog/quarantine-audit-parts/
            /src/
            /tests/
            /tools/
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prove terminal-deletion guards
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_prune_irrecoverable_dataset.py \
            tests/test_audit_mixed_release_assets.py \
            tests/test_prune_verified_recovery_capsule.py \
            tests/test_backfill_replay_compatibility_candidates.py

      - name: Identify historical physical assets mixing SAFE and REJECT
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_mixed_release_assets.py \
            --json-out "$RUNNER_TEMP/alina-mixed-asset-inventory.json"
          python - <<'PY'
          import json, os
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/alina-mixed-asset-inventory.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Historic mixed Release inventory (catalog metadata only)\n")
              for key in ("safe_and_reject_assets", "mixed_status_assets",
                          "reject_only_assets", "mixed_with_inconsistent_remote_identity"):
                  out.write(f"- {key}: {data[key]}\n")
          PY

      - name: Commit immutable deletion plan
        id: plan
        env:
          ASSET_LIMIT: ${{ github.event.inputs.asset_limit || '500' }}
        run: |
          set -euo pipefail
          case "$ASSET_LIMIT" in ''|*[!0-9]*) echo "invalid asset_limit"; exit 2;; esac
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tools/prune_irrecoverable_dataset.py prepare --limit "$ASSET_LIMIT" > "$RUNNER_TEMP/deletion-plan.json"
            STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/deletion-plan.json")"
            if [ "$STATUS" = "NO_ELIGIBLE_ASSETS" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DIGEST="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["plan_digest"])' "$RUNNER_TEMP/deletion-plan.json")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog/DATA_DELETION_PLAN.json
            if git diff --cached --quiet; then
              echo "Deletion plan already durable at $(git rev-parse HEAD)."
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "data: plan terminal payload deletion ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((ATTEMPT * 3))
          done
          echo "unable to durably publish deletion plan" >&2
          exit 1

      - name: Delete exact terminal assets and finalize catalog
        if: steps.plan.outputs.ready == 'true'
        env:
          PLAN_DIGEST: ${{ steps.plan.outputs.digest }}
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/DATA_DELETION_RECEIPT.json"
          git fetch origin main
          git reset --hard origin/main
          python tools/prune_irrecoverable_dataset.py execute \
            --expected-plan-digest "$PLAN_DIGEST" --receipt "$RECEIPT"
          for ATTEMPT in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python tools/prune_irrecoverable_dataset.py finalize --receipt "$RECEIPT"
            python tools/build_replay_compatibility_reasons.py
            python tools/build_catalog_metrics.py
            python tools/build_quarantine_audit.py
            python tools/check_dataset_quality.py --catalog-only
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data: remove terminal non-viable payloads ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 3))
          done
          echo "deleted assets were not reconciled into main" >&2
          exit 1
