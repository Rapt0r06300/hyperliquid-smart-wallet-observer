name: local-l2-certification-tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/certify_local_l2.py'
      - 'tests/test_certify_local_l2.py'
      - 'tools/copy_vault_safe_bridge.py'
      - 'tools/alina_quant_lab_console.py'
      - 'tools/inventory_copy_vault_evidence.py'
      - 'LANCER_LAB_QUANT_COPY_VAULT.cmd'
      - 'tests/test_copy_vault_safe_bridge.py'
      - 'tests/test_copy_vault_closure_gate.py'
      - 'tests/test_copy_vault_evidence_inventory.py'
      - '.github/workflows/local-l2-certification-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-l2-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ matrix.os == 'windows-latest' && 'src;.' || 'src:.' }}
      REAL_MAINNET_TRADING: 'false'
      ENABLE_REAL_ORDERS: '0'
      HL_ENABLE_MAINNET_EXECUTION: '0'
      HL_ENABLE_TESTNET_EXECUTION: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # These tests build temporary SAFE fixtures; never hydrate the raw
          # multi-GB dataset reservoir on a hosted code/test job.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tools/
            /tests/
            /pyproject.toml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML httpx pydantic websockets
      - name: Offline L2 and Copy-Vault SAFE bridge tests
        run: |
          python -m py_compile tools/copy_vault_safe_bridge.py tools/alina_quant_lab_console.py \
            tools/inventory_copy_vault_evidence.py src/hl_observer/backtesting/copy_vault_evidence_inventory.py
          python -m pytest -q tests/test_certify_local_l2.py tests/test_copy_vault_safe_bridge.py \
            tests/test_copy_vault_closure_gate.py tests/test_copy_vault_evidence_inventory.py --tb=short
