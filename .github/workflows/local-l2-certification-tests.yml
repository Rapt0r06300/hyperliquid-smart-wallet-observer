name: local-l2-certification-tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/certify_local_l2.py'
      - 'tests/test_certify_local_l2.py'
      - '.github/workflows/local-l2-certification-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-l2-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONPATH: '.:tools:src'
      REAL_MAINNET_TRADING: 'false'
      ENABLE_REAL_ORDERS: '0'
      HL_ENABLE_MAINNET_EXECUTION: '0'
      HL_ENABLE_TESTNET_EXECUTION: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Offline L2 certification unit tests
        run: python -m pytest -q tests/test_certify_local_l2.py --tb=short
