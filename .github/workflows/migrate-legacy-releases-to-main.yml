name: purge-legacy-dataset-imports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-legacy-releases-to-main.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alina-dataset-v2-purge
  cancel-in-progress: false

jobs:
  purge-one:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Delete at most one frozen imported release
        id: purge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("control/legacy-release-migration.json").read_text())
          assert s.get("target_repository")=="Rapt0r06300/hyperliquid-smart-wallet-observer"
          assert s.get("historical_migration_enabled") is False
          tags=[
            "copy-vault-v2-35696114415-s1",
            "copy-vault-v2-35696114415-s2",
            "copy-vault-v2-35696114415-s0",
            "copy-vault-v2-35696114415-s3",
            "copy-vault-v2-35696436974-s1",
            "copy-vault-v2-35696436974-s3",
            "copy-vault-v2-35696436974-s0",
            "copy-vault-v2-35696436974-s2",
            "data-v2-35696462284-s2",
            "data-v2-35696462284-s7",
            "data-v2-35696462284-s3",
            "data-v2-35696462284-s6",
            "copy-vault-v2-35696508705-s0",
            "copy-vault-v2-35696508705-s3",
            "copy-vault-v2-35696508705-s2",
            "data-v2-35696462284-s0",
          ]
          i=int(s.get("cleanup_index") or 0)
          assert 0 <= i <= len(tags)
          p=Path("/tmp/purge.env")
          if i >= len(tags):
              p.write_text("DONE=true\n")
          else:
              p.write_text(f"DONE=false\nINDEX={i}\nTAG={tags[i]}\n")
          PY
          cat /tmp/purge.env >> "$GITHUB_OUTPUT"

          if grep -q '^DONE=true$' /tmp/purge.env; then
            exit 0
          fi

          tag="$(grep '^TAG=' /tmp/purge.env | cut -d= -f2-)"
          if gh release delete "$tag" --repo "$TARGET_REPOSITORY" --cleanup-tag --yes > /tmp/delete.out 2> /tmp/delete.err; then
            echo "RESULT=deleted" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          msg="$(cat /tmp/delete.err /tmp/delete.out 2>/dev/null || true)"
          if printf '%s' "$msg" | grep -Eqi 'not found|release does not exist|HTTP 404'; then
            echo "RESULT=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$msg" | grep -Eqi 'rate limit|HTTP 403|secondary'; then
            echo "GitHub secondary release-write throttle is still active; cursor unchanged."
            echo "RESULT=throttled" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$msg" >&2
          exit 31

      - name: Advance durable purge cursor
        if: steps.purge.outputs.DONE != 'true' && steps.purge.outputs.RESULT != 'throttled'
        shell: bash
        env:
          INDEX: ${{ steps.purge.outputs.INDEX }}
          RESULT: ${{ steps.purge.outputs.RESULT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          sp=Path("control/legacy-release-migration.json")
          up=Path("control/unified-repository.json")
          s=json.loads(sp.read_text())
          i=int(os.environ["INDEX"])
          nxt=i+1
          s["cleanup_index"]=nxt
          s["imported_releases_remaining"]=16-nxt
          s["removed_imported_releases"]=nxt
          s["last_cleanup_result"]=os.environ["RESULT"]
          s["cleanup_status"]="COMPLETE" if nxt==16 else "IN_PROGRESS"
          s["status"]="ABORTED_CLEANED" if nxt==16 else "ABORTED_PURGE_PENDING"
          s["pending_releases"]=0
          sp.write_text(json.dumps(s,indent=2,sort_keys=True)+"\n")
          u=json.loads(up.read_text())
          u["fresh_dataset_state"]=True
          u["legacy_collection_state_imported"]=False
          u["historical_external_import_allowed"]=False
          u["dataset_v2_import_allowed"]=False
          u["collection_origin_policy"]="fresh-main-only"
          u["legacy_imported_release_count"]=16-nxt
          u["legacy_imported_releases_present"]=nxt<16
          u["historical_release_migration_status"]="DISABLED_CLEAN" if nxt==16 else "DISABLED_PURGE_PENDING"
          up.write_text(json.dumps(u,indent=2,sort_keys=True)+"\n")
          PY

          git add control/legacy-release-migration.json control/unified-repository.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "data: advance dataset-v2 purge cursor"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 51

      - name: Retire purge plumbing after 16 of 16
        if: steps.purge.outputs.DONE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("control/legacy-release-migration.json").read_text())
          assert int(s.get("cleanup_index") or 0)==16
          assert int(s.get("imported_releases_remaining") or 0)==0
          u=json.loads(Path("control/unified-repository.json").read_text())
          assert u.get("dataset_v2_import_allowed") is False
          assert u.get("historical_external_import_allowed") is False
          assert u.get("legacy_imported_releases_present") is False
          PY
          git rm -f \
            .github/workflows/migrate-legacy-releases-to-main.yml \
            tools/migrate_legacy_releases_to_main.py \
            tests/test_legacy_release_migration.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "architecture: retire dataset-v2 migration and purge plumbing"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 61
