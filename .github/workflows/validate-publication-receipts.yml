name: validate-publication-receipts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/receipts/**"
      - "tools/validate_publication_receipts.py"
      - "tools/reconcile_publication_consistency.py"
      - ".github/workflows/validate-publication-receipts.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: |
          python tools/validate_publication_receipts.py
          python tools/reconcile_publication_consistency.py
