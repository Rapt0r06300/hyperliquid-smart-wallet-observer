name: campaign-watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "control/alina-phase.json"
      - "tools/campaign_watchdog.py"
      - "tests/test_campaign_watchdog_drain.py"
      - ".github/workflows/campaign-watchdog.yml"
permissions:
  contents: write
concurrency:
  group: campaign-watchdog
  cancel-in-progress: true
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Sync latest main before watchdog
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate DRAIN reconciliation contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_campaign_watchdog_drain.py --tb=line
      - name: Inspect and repair current-epoch collection handoffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/campaign_watchdog.py --dispatch
      - name: Persist watchdog receipt
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git add catalog/CAMPAIGN_WATCHDOG_RECEIPT.json catalog/campaigns
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "watchdog: persist campaign health receipt"
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            python tools/campaign_watchdog.py --dispatch
            sleep "$((attempt * 2))"
          done
          exit 1
