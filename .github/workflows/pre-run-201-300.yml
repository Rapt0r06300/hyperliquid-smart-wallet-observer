name: pre-run-201-300

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pre-run-201-300-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NO_COLOR: "1"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  TESTNET_EXECUTION_ENABLED: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  preuves-201-300:
    name: Preuves executables optimisations 201-300
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer dependances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-recherche.txt
      - name: Prouver AUD-201 a AUD-220
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-201-220.xml tests/test_pre_run_201_220_rigor.py
      - name: Prouver AUD-221 a AUD-260
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-221-260.xml tests/test_pre_run_221_260_rigor.py
      - name: Prouver AUD-261 a AUD-300
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-261-300.xml tests/test_pre_run_261_300_rigor.py
      - name: Revalider la gate 101-200
        run: |
          python -m hl_observer.ops.pre_run_guard_101_200 --root . --output runtime/reports/pre_run_101_200_upstream.json
          python -m pytest -q -p no:cacheprovider --junitxml=junit-pre-run-upstream-101-200.xml tests/test_pre_run_optimizations_101_200.py tests/test_pre_run_guard_101_200.py
      - name: Audits securite finaux
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pre-run-201-300-${{ github.sha }}
          path: |
            junit-pre-run-*.xml
            runtime/reports/pre_run_101_200_upstream.json
          if-no-files-found: error
          retention-days: 30
