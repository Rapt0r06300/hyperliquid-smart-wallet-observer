name: alina-dataset-backtest-github

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Dataset suite to materialize and analyze"
        required: true
        default: "economic-core"
        type: choice
        options:
          - economic-core
          - economic-full
          - copy-vault-full
          - lead-lag-full
          - cross-venue-full
          - microstructure-full
          - research-lab-full
          - sqlite-core
          - sqlite-all-safe
      analysis_mode:
        description: "Analysis depth"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - full
      max_download_gib:
        description: "Maximum dataset traffic for this run"
        required: true
        default: "12"
        type: string

permissions:
  contents: read

concurrency:
  group: alina-dataset-backtest-github
  cancel-in-progress: false

jobs:
  backtest:
    if: >-
      github.repository == 'Rapt0r06300/hyperliquid-smart-wallet-observer' &&
      github.actor == 'Rapt0r06300'
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      HYPERSMART_DATASET_TOKEN: ${{ secrets.ALINA_DATASET_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.ALINA_DATASET_READ_TOKEN }}
      HL_ENABLE_MAINNET_EXECUTION: '0'
      HL_ENABLE_TESTNET_EXECUTION: '0'
      REAL_MAINNET_TRADING: 'false'
      TESTNET_EXECUTION_ENABLED: 'false'
      HYPERSMART_ENABLE_REAL_ORDERS: '0'
      ENABLE_REAL_ORDERS: '0'
      TESTNET_ONLY: 'true'
      HYPERSMART_ANALYSIS_LOCAL_ONLY: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Checkout exact Alina source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Reclaim ephemeral runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          echo "After cleanup:"
          df -h /

      - name: Require private dataset read token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HYPERSMART_DATASET_TOKEN:-}" ]; then
            echo "ALINA_DATASET_READ_TOKEN is missing."
            exit 2
          fi

      - name: Install Alina analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci-bootstrap.txt
          python -m pip install --disable-pip-version-check setuptools wheel
          python -m pip install --disable-pip-version-check -e .

      - name: Enforce paper read-only execution guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          guards = {
              "HL_ENABLE_MAINNET_EXECUTION": "0",
              "HL_ENABLE_TESTNET_EXECUTION": "0",
              "REAL_MAINNET_TRADING": "false",
              "TESTNET_EXECUTION_ENABLED": "false",
              "HYPERSMART_ENABLE_REAL_ORDERS": "0",
              "ENABLE_REAL_ORDERS": "0",
              "HYPERSMART_ANALYSIS_LOCAL_ONLY": "1",
          }
          wrong = {k: (os.getenv(k), v) for k, v in guards.items() if os.getenv(k) != v}
          if wrong:
              raise SystemExit(f"execution guard mismatch: {wrong}")
          print("PAPER_READ_ONLY_GUARDS_OK")
          PY

      - name: Plan exact dataset download
        id: plan
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          MAX_DOWNLOAD_GIB: ${{ inputs.max_download_gib }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools"
          python -m hl_observer.ops.dataset_bridge prepare \
            --root "$GITHUB_WORKSPACE" \
            --repo Rapt0r06300/hypersmart-datasets \
            --release-id 371149058 \
            --suite "$SUITE" \
            --max-download-gib "$MAX_DOWNLOAD_GIB" \
            --disk-reserve-gib 1

      - name: Download and reconstruct verified dataset subset
        id: prepare
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          MAX_DOWNLOAD_GIB: ${{ inputs.max_download_gib }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools"
          python -m hl_observer.ops.dataset_bridge prepare \
            --root "$GITHUB_WORKSPACE" \
            --repo Rapt0r06300/hypersmart-datasets \
            --release-id 371149058 \
            --suite "$SUITE" \
            --download \
            --stream-assets \
            --max-download-gib "$MAX_DOWNLOAD_GIB" \
            --disk-reserve-gib 1 \
            --heartbeat-seconds 5

          DATA_ROOT="$(python -m hl_observer.ops.dataset_bridge locate --root "$GITHUB_WORKSPACE" --suite "$SUITE")"
          if [ -z "$DATA_ROOT" ] || [ ! -d "$DATA_ROOT" ]; then
            echo "Materialized dataset workspace missing: $DATA_ROOT"
            exit 3
          fi
          echo "data_root=$DATA_ROOT" >> "$GITHUB_OUTPUT"
          du -sh "$DATA_ROOT" || true
          df -h /

      - name: Prepare replay workspace
        shell: bash
        env:
          DATA_ROOT: ${{ steps.prepare.outputs.data_root }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools"
          python -m hl_observer.ops.dataset_workspace \
            --root "$GITHUB_WORKSPACE" \
            --materialized-root "$DATA_ROOT"

      - name: Run canonical dataset analysis
        id: analysis
        continue-on-error: true
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          ANALYSIS_MODE: ${{ inputs.analysis_mode }}
          DATA_ROOT: ${{ steps.prepare.outputs.data_root }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools"

          if [ "$SUITE" = "economic-core" ] || [ "$SUITE" = "economic-full" ]; then
            python tools/run_dataset_economic_campaigns.py \
              --root "$DATA_ROOT" \
              --no-start-collection \
              --lead-history-sources 8
          else
            EXTRA=()
            if [ "$ANALYSIS_MODE" = "full" ]; then EXTRA+=(--full); fi
            python -m hl_observer.ops.dataset_research_runner \
              --root "$GITHUB_WORKSPACE" \
              --data-root "$DATA_ROOT" \
              --suite "$SUITE" \
              "${EXTRA[@]}"
          fi

      - name: Export compact dataset verdict
        if: always() && steps.prepare.outputs.data_root != ''
        continue-on-error: true
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          DATA_ROOT: ${{ steps.prepare.outputs.data_root }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tools"
          python -m hl_observer.ops.dataset_result_export \
            --root "$GITHUB_WORKSPACE" \
            --replay-root "$DATA_ROOT" \
            --suite "$SUITE"

      - name: Build GitHub run summary
        if: always()
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          ANALYSIS_MODE: ${{ inputs.analysis_mode }}
          DATA_ROOT: ${{ steps.prepare.outputs.data_root }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: |
          {
            echo "# Alina dataset backtest"
            echo
            echo "- Suite: \`$SUITE\`"
            echo "- Analysis mode: \`$ANALYSIS_MODE\`"
            echo "- Analysis outcome: \`$ANALYSIS_OUTCOME\`"
            echo "- Paper/read-only: **true**"
            echo "- Real execution: **false**"
            echo "- Live collection: **false**"
            if [ -n "${DATA_ROOT:-}" ] && [ -d "$DATA_ROOT" ]; then
              echo "- Workspace bytes: \`$(du -sb "$DATA_ROOT" | cut -f1)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build compact public-safe report bundle
        if: always()
        id: bundle
        shell: bash
        env:
          DATA_ROOT: ${{ steps.prepare.outputs.data_root }}
        run: |
          set -u
          BUNDLE="$RUNNER_TEMP/alina-backtest-report-${GITHUB_RUN_ID}"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"

          if [ -d "$GITHUB_WORKSPACE/runtime/reports" ]; then
            mkdir -p "$BUNDLE/project_runtime_reports"
            cp -a "$GITHUB_WORKSPACE/runtime/reports/." "$BUNDLE/project_runtime_reports/" || true
          fi

          if compgen -G "$GITHUB_WORKSPACE/docs/research/datasets/DERNIER_REPLAY_DATASETS.*" > /dev/null; then
            mkdir -p "$BUNDLE/compact_verdict"
            cp "$GITHUB_WORKSPACE"/docs/research/datasets/DERNIER_REPLAY_DATASETS.* "$BUNDLE/compact_verdict/" || true
          fi

          if [ -n "${DATA_ROOT:-}" ] && [ -d "$DATA_ROOT/runtime/reports" ]; then
            mkdir -p "$BUNDLE/dataset_runtime_reports"
            cp -a "$DATA_ROOT/runtime/reports/." "$BUNDLE/dataset_runtime_reports/" || true
          fi

          {
            echo "{"
            echo "  \"schema\": \"alina.github_hosted_dataset_backtest.v1\","
            echo "  \"github_run_id\": \"${GITHUB_RUN_ID}\","
            echo "  \"github_sha\": \"${GITHUB_SHA}\","
            echo "  \"paper_only\": true,"
            echo "  \"real_execution\": false,"
            echo "  \"raw_dataset_uploaded\": false"
            echo "}"
          } > "$BUNDLE/GITHUB_HOSTED_RUN.json"

          echo "artifact_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alina-dataset-backtest-${{ inputs.suite }}-${{ github.run_id }}
          path: ${{ steps.bundle.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Fail closed if analysis failed
        if: always()
        shell: bash
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: |
          if [ "$ANALYSIS_OUTCOME" != "success" ]; then
            echo "Dataset analysis did not complete successfully."
            exit 1
          fi
          echo "GITHUB_HOSTED_DATASET_ANALYSIS_OK"
