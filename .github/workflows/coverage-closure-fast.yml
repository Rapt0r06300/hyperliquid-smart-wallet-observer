name: coverage-closure-fast

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_coverage_closure_*.py'
      - 'src/hl_observer/**/*.py'
      - '.github/workflows/coverage-closure-fast.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: coverage-closure-fast-main
  cancel-in-progress: true

jobs:
  closure-tests:
    name: Tests de clôture coverage rapides
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publier le statut rapide en cours
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"hypersmart/coverage-closure-fast\",\"description\":\"Tests de clôture coverage en cours\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Ruff structurel sur les tests de clôture
        run: python -m ruff check --select E9,F63,F7,F82 tests/test_coverage_closure_*.py
      - name: Construire la suite réellement rapide
        run: |
          python - <<'PY'
          from pathlib import Path

          shardes = {
              Path('tests/test_coverage_closure_typed_long_tail.py'),
              Path('tests/test_coverage_closure_typed_large_tail.py'),
              Path('tests/test_coverage_closure_branch_fuzzer.py'),
              Path('tests/test_coverage_closure_branch_fuzzer_v2.py'),
              Path('tests/test_coverage_closure_closure_fuzzer.py'),
          }
          tests = sorted(
              path for path in Path('tests').glob('test_coverage_closure_*.py')
              if path not in shardes
          )
          if not tests:
              raise SystemExit('COVERAGE_CLOSURE_FAST_EMPTY')
          Path('closure-fast-tests.txt').write_text(
              '\n'.join(str(path) for path in tests) + '\n', encoding='utf-8'
          )
          print(f'closure_fast_tests={len(tests)} contrats_shardes={len(shardes)}')
          PY
      - name: Exécuter uniquement les tests de clôture rapides
        run: |
          mapfile -t TEST_FILES < closure-fast-tests.txt
          python -m pytest -q -p no:cacheprovider --tb=short \
            --timeout=180 --timeout-method=signal "${TEST_FILES[@]}"
      - name: Publier le verdict rapide
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          DESCRIPTION="Tests de clôture coverage en échec"
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE=success
            DESCRIPTION="Tests de clôture coverage verts"
          fi
          STATE="$STATE" DESCRIPTION="$DESCRIPTION" python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "hypersmart/coverage-closure-fast",
              "description": os.environ["DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
