name: coverage-closure-fast

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_coverage_closure_*.py'
      - '.github/workflows/coverage-closure-fast.yml'

permissions:
  contents: read

concurrency:
  group: coverage-closure-fast-main
  cancel-in-progress: true

jobs:
  closure-tests:
    name: Tests de clôture coverage rapides
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Ruff sur les tests de clôture
        run: python -m ruff check tests/test_coverage_closure_*.py
      - name: Exécuter uniquement les tests de clôture
        run: python -m pytest -q -p no:cacheprovider --tb=short tests/test_coverage_closure_*.py
