name: alina-github-dataset-job-legacy-disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Legacy dataset source is permanently disabled
        run: |
          echo "The legacy hypersmart-datasets source has been deleted."
          echo "Alina Dataset V2 is the only permitted dataset source."
          echo "Use Rapt0r06300/alina-smartflow-datasets-v2."
          exit 1
