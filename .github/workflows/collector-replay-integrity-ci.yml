name: collector-replay-integrity-ci

on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/collection/feed_integrity.py'
      - 'src/hl_observer/collection/window_quality.py'
      - 'src/hl_observer/collection/reconciliation.py'
      - 'src/hl_observer/collection/shard_writer.py'
      - 'src/hl_observer/collection/tick_dataset.py'
      - 'src/hl_observer/collection/partitioned_tick_dataset.py'
      - 'src/hl_observer/collection/native_market_tape.py'
      - 'src/hl_observer/collection/native_venue_market.py'
      - 'src/hl_observer/collection/native_venue_coordinator.py'
      - 'src/hl_observer/collection/bybit_market_data.py'
      - 'src/hl_observer/collection/binance_clock_sync.py'
      - 'src/hl_observer/collection/binance_depth_book.py'
      - 'src/hl_observer/collection/binance_depth_orchestrator.py'
      - 'src/hl_observer/collection/binance_depth_live.py'
      - 'src/hl_observer/collection/binance_market_context.py'
      - 'src/hl_observer/collection/binance_funding_history.py'
      - 'src/hl_observer/collection/hyperliquid_clock_sync.py'
      - 'src/hl_observer/collection/hyperliquid_funding_history.py'
      - 'src/hl_observer/collection/native_funding_history.py'
      - 'src/hl_observer/collection/userfills_live.py'
      - 'src/hl_observer/collection/trade_reconciliation.py'
      - 'tools/collecter_userfills_vaults.py'
      - 'tools/collect_cloud_copy_vault.py'
      - 'tools/collecter_bbo.py'
      - 'tools/collecter_native_venues.py'
      - 'src/hl_observer/collection/okx_market_data.py'
      - 'src/hl_observer/data_sources/market_backfill.py'
      - 'src/hl_observer/data_sources/official_archive_backfill.py'
      - 'src/hl_observer/datasets/v2_export.py'
      - 'src/hl_observer/datasets/v2_pipeline.py'
      - 'src/hl_observer/datasets/replay_coverage.py'
      - 'src/hl_observer/datasets/cross_venue_window.py'
      - 'src/hl_observer/datasets/strategy_data_contracts.py'
      - 'tools/build_dataset_v2_manifest.py'
      - 'tools/collect_cloud_window.py'
      - 'tools/collect_official_archive_backfill.py'
      - 'tools/publish_dataset_v2_release.py'
      - 'tests/test_collector_feed_integrity.py'
      - 'tests/test_collection_window_quality.py'
      - 'tests/test_collection_reconciliation.py'
      - 'tests/test_trade_reconciliation.py'
      - 'tests/test_collection_shard_writer.py'
      - 'tests/test_tick_dataset.py'
      - 'tests/test_partitioned_tick_dataset.py'
      - 'tests/test_dataset_v2_export.py'
      - 'tests/test_dataset_v2_pipeline.py'
      - 'tests/test_replay_coverage.py'
      - 'tests/test_cross_venue_window.py'
      - 'tests/test_strategy_data_contracts.py'
      - 'tests/test_collect_cloud_window.py'
      - 'tests/test_publish_dataset_v2_release.py'
      - 'tests/test_official_archive_backfill.py'
      - 'tests/test_native_market_tape.py'
      - 'tests/test_native_venue_market.py'
      - 'tests/test_bybit_market_data.py'
      - 'tests/test_binance_clock_sync.py'
      - 'tests/test_binance_depth_book.py'
      - 'tests/test_binance_depth_orchestrator.py'
      - 'tests/test_binance_depth_live.py'
      - 'tests/test_binance_market_context.py'
      - 'tests/test_binance_funding_history.py'
      - 'tests/test_hyperliquid_clock_sync.py'
      - 'tests/test_hyperliquid_funding_history.py'
      - 'tests/test_native_funding_history.py'
      - 'tests/test_collecter_bbo.py'
      - 'tests/test_okx_market_data.py'
      - 'tests/test_native_venue_transport_integrity.py'
      - 'tests/test_native_venue_coordinator.py'
      - 'tests/test_native_venues_collector.py'
      - 'tests/test_copy_vault_transport_timing.py'
      - 'tests/test_collect_cloud_copy_vault.py'
      - 'tests/test_collecter_userfills_vaults.py'
      - 'tests/test_vault_fills_backfill.py'
      - '.github/workflows/collector-replay-integrity-ci.yml'
  workflow_dispatch:

concurrency:
  group: collector-replay-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collector-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile collector modules
        run: |
          python -m py_compile \
            src/hl_observer/collection/feed_integrity.py \
            src/hl_observer/collection/window_quality.py \
            src/hl_observer/collection/reconciliation.py \
            src/hl_observer/collection/shard_writer.py \
            src/hl_observer/collection/tick_dataset.py \
            src/hl_observer/collection/partitioned_tick_dataset.py \
            src/hl_observer/collection/native_market_tape.py \
            src/hl_observer/collection/native_venue_market.py \
            src/hl_observer/collection/native_venue_coordinator.py \
            src/hl_observer/collection/bybit_market_data.py \
            src/hl_observer/collection/binance_clock_sync.py \
            src/hl_observer/collection/binance_depth_book.py \
            src/hl_observer/collection/binance_depth_orchestrator.py \
            src/hl_observer/collection/binance_depth_live.py \
            src/hl_observer/collection/binance_market_context.py \
            src/hl_observer/collection/binance_funding_history.py \
            src/hl_observer/collection/hyperliquid_clock_sync.py \
            src/hl_observer/collection/hyperliquid_funding_history.py \
            src/hl_observer/collection/native_funding_history.py \
            src/hl_observer/collection/userfills_live.py \
            src/hl_observer/collection/trade_reconciliation.py \
            tools/collecter_userfills_vaults.py \
            tools/collect_cloud_copy_vault.py \
            tools/collecter_bbo.py \
            tools/collecter_native_venues.py \
            src/hl_observer/collection/okx_market_data.py \
            src/hl_observer/data_sources/market_backfill.py \
            src/hl_observer/data_sources/official_archive_backfill.py \
            src/hl_observer/datasets/v2_export.py \
            src/hl_observer/datasets/v2_pipeline.py \
            src/hl_observer/datasets/replay_coverage.py \
            src/hl_observer/datasets/cross_venue_window.py \
            src/hl_observer/datasets/strategy_data_contracts.py \
            tools/build_dataset_v2_manifest.py \
            tools/collect_cloud_window.py \
            tools/collect_official_archive_backfill.py \
            tools/publish_dataset_v2_release.py
      - name: Run collector integrity tests
        run: |
          python -m pytest -q \
            tests/test_collector_feed_integrity.py \
            tests/test_collection_window_quality.py \
            tests/test_collection_reconciliation.py \
            tests/test_trade_reconciliation.py \
            tests/test_collection_shard_writer.py \
            tests/test_tick_dataset.py \
            tests/test_partitioned_tick_dataset.py \
            tests/test_dataset_v2_export.py \
            tests/test_dataset_v2_pipeline.py \
            tests/test_replay_coverage.py \
            tests/test_cross_venue_window.py \
            tests/test_strategy_data_contracts.py \
            tests/test_collect_cloud_window.py \
            tests/test_publish_dataset_v2_release.py \
            tests/test_official_archive_backfill.py \
            tests/test_native_market_tape.py \
            tests/test_native_venue_market.py \
            tests/test_bybit_market_data.py \
            tests/test_binance_clock_sync.py \
            tests/test_binance_depth_book.py \
            tests/test_binance_depth_orchestrator.py \
            tests/test_binance_depth_live.py \
            tests/test_binance_market_context.py \
            tests/test_binance_funding_history.py \
            tests/test_hyperliquid_clock_sync.py \
            tests/test_hyperliquid_funding_history.py \
            tests/test_native_funding_history.py \
            tests/test_collecter_bbo.py \
            tests/test_okx_market_data.py \
            tests/test_native_venue_transport_integrity.py \
            tests/test_native_venue_coordinator.py \
            tests/test_native_venues_collector.py \
            tests/test_copy_vault_transport_timing.py \
            tests/test_collect_cloud_copy_vault.py \
            tests/test_collecter_userfills_vaults.py \
            tests/test_vault_fills_backfill.py
