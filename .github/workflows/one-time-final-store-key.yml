name: one-time-final-store-key

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair exact store-key assertion and stale release concurrency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/test_lot14_corrections_integration.py",
              '    assert pos["position_id"] in store["ouvertes"]\n    assert pos["liquidation_status"] == "UNLIQUIDATABLE_DATA_MISSING"',
              '    assert pos["id"] in store["ouvertes"]\n    assert store["ouvertes"][pos["id"]]["position_id"] == pos["position_id"]\n    assert pos["liquidation_status"] == "UNLIQUIDATABLE_DATA_MISSING"',
          )
          replace_once(
              ".github/workflows/portable-release-windows.yml",
              "  cancel-in-progress: false",
              "  cancel-in-progress: true",
          )
          PY
          rm -f .github/workflows/one-time-final-store-key.yml
      - name: Commit repaired invariant
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_lot14_corrections_integration.py .github/workflows/portable-release-windows.yml .github/workflows/one-time-final-store-key.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test: preserve canonical store key for unliquidatable positions"
          git push origin HEAD:main
