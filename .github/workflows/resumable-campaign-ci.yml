name: resumable-campaign-ci
on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/control_plane/resumable_campaign.py'
      - 'src/hl_observer/control_plane/campaign_adapters.py'
      - 'src/hl_observer/control_plane/module_pnl_proof.py'
      - 'tools/resumable_campaign.py'
      - 'tools/run_resumable_campaign.py'
      - 'tests/test_resumable_campaign.py'
      - 'tests/test_resumable_campaign_adapters.py'
      - 'tests/test_module_pnl_proof_campaign.py'
      - '.github/workflows/resumable-campaign-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resumable-campaign-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile campaign control plane
        run: |
          python -m py_compile             src/hl_observer/control_plane/resumable_campaign.py             src/hl_observer/control_plane/campaign_adapters.py             src/hl_observer/control_plane/module_pnl_proof.py             tools/resumable_campaign.py             tools/run_resumable_campaign.py
      - name: Run campaign tests
        run: |
          python -m pytest -q             tests/test_resumable_campaign.py             tests/test_resumable_campaign_adapters.py             tests/test_module_pnl_proof_campaign.py
