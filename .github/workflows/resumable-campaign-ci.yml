name: resumable-campaign-ci
on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/control_plane/resumable_campaign.py'
      - 'src/hl_observer/control_plane/campaign_adapters.py'
      - 'src/hl_observer/control_plane/module_pnl_proof.py'
      - 'src/hl_observer/backtesting/copy_vault_executable.py'
      - 'tools/resumable_campaign.py'
      - 'tools/run_resumable_campaign.py'
      - 'tools/augment_campaign_result.py'
      - 'tests/test_augment_campaign_result.py'
      - '.github/workflows/resumable-campaign-worker.yml'
      - 'tests/test_resumable_campaign.py'
      - 'tests/test_resumable_campaign_adapters.py'
      - 'tests/test_module_pnl_proof_campaign.py'
      - 'tests/test_copy_vault_executable.py'
      - '.github/workflows/resumable-campaign-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resumable-campaign-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/resumable-campaign-ci.yml
            README.md
            pyproject.toml
            src/
            hyper_smart_observer/
            tools/augment_campaign_result.py
            tools/copy_vault_continuity.py
            tools/resumable_campaign.py
            tools/run_resumable_campaign.py
            tests/test_augment_campaign_result.py
            tests/test_resumable_campaign.py
            tests/test_resumable_campaign_adapters.py
            tests/test_module_pnl_proof_campaign.py
            tests/test_copy_vault_executable.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Start hosted timing receipt
        id: timing
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile campaign control plane
        run: |
          python -m py_compile             src/hl_observer/control_plane/resumable_campaign.py             src/hl_observer/control_plane/campaign_adapters.py             src/hl_observer/control_plane/module_pnl_proof.py             tools/resumable_campaign.py             tools/run_resumable_campaign.py
      - name: Run campaign tests
        run: |
          python -m pytest -q             tests/test_resumable_campaign.py             tests/test_resumable_campaign_adapters.py             tests/test_module_pnl_proof_campaign.py             tests/test_augment_campaign_result.py
          python -m pytest -q tests/test_copy_vault_executable.py::test_replay_resume_matches_continuous_paper_state_and_receipts
      - name: Publish hosted timing receipt
        if: always()
        shell: bash
        env:
          START_NS: ${{ steps.timing.outputs.started_ns }}
        run: |
          set -u
          end_ns="$(date +%s%N)"
          if [[ "$START_NS" =~ ^[0-9]+$ ]]; then
            elapsed_ms="$(( (end_ns - START_NS) / 1000000 ))"
          else
            elapsed_ms="unknown"
          fi
          {
            echo "### Resumable Copy-Vault hosted timing"
            echo "- SHA: ${GITHUB_SHA}"
            echo "- run: ${GITHUB_RUN_ID}"
            echo "- job_elapsed_ms: ${elapsed_ms}"
            echo "- paper_read_only: true"
            echo "- real_execution: false"
            echo "- receipt_scope: measurement only; not an economic proof"
          } >> "$GITHUB_STEP_SUMMARY"
