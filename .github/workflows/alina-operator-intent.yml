name: alina-operator-intent
on:
  workflow_dispatch:
    inputs:
      intent:
        description: "Canonical operator intent"
        required: true
        type: choice
        options: [start_collection, analyze, replay, backtest, oos, forward_paper, module_pnl_proof, scoreboard, full_cycle, drain, pause, resume, retry]
      family:
        description: "Strategy family or all families"
        required: false
        default: all
        type: choice
        options: [all, copy_vault, lead_lag, cross_venue_dislocation]
      request_id:
        description: "Idempotent request identity"
        required: true
        type: string
      requested_by:
        required: false
        default: "github-operator"
        type: string
      config_json:
        required: false
        default: "{}"
        type: string
permissions:
  contents: write
concurrency:
  group: alina-operator-intent-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Persist immutable operator intent
        env:
          INTENT: "${{ inputs.intent }}"
          REQUEST_ID: "${{ inputs.request_id }}"
          FAMILY: "${{ inputs.family }}"
          REQUESTED_BY: "${{ inputs.requested_by }}"
          CONFIG_JSON: "${{ inputs.config_json }}"
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib,re
          request_id=os.environ["REQUEST_ID"]
          if not re.fullmatch(r"[0-9a-f]{64}", request_id):
            raise SystemExit("request_id must be a path-safe bounded identifier")
          requested_by=os.environ["REQUESTED_BY"]
          if not re.fullmatch(r"[A-Za-z0-9@._:-]{1,128}", requested_by):
            raise SystemExit("requested_by contains unsupported characters")
          config=json.loads(os.environ["CONFIG_JSON"])
          if not isinstance(config,dict): raise SystemExit("config_json must be object")
          family=os.environ["FAMILY"]
          if family not in {"all","copy_vault","lead_lag","cross_venue_dislocation"}:
            raise SystemExit("unsupported strategy family")
          if family != "all": config["strategy_family"]=family
          phase_path=pathlib.Path("control/alina-phase.json")
          if not phase_path.is_file():
            raise SystemExit("canonical phase state is missing")
          phase=json.loads(phase_path.read_text(encoding="utf-8"))
          if phase.get("phase") not in {"IDLE","COLLECT","ANALYZE"}:
            raise SystemExit("canonical phase state is invalid")
          analysis_intents={"analyze","replay","backtest","oos","forward_paper","module_pnl_proof","scoreboard","full_cycle","drain"}
          if os.environ["INTENT"] in analysis_intents and phase["phase"] != "ANALYZE":
            raise SystemExit("analysis intent requires ANALYZE phase")
          if os.environ["INTENT"] == "start_collection" and phase["phase"] != "COLLECT":
            raise SystemExit("collection intent requires COLLECT phase")
          row={
            "schema_version":"alina.operator_intent.v2",
            "intent":os.environ["INTENT"],
            "request_id":request_id,
            "requested_by":requested_by,
            "requested_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),
            "main_code_sha":os.environ.get("GITHUB_SHA"),
            "phase":phase["phase"],
            "phase_epoch":phase["epoch"],
            "analysis_stage":phase.get("analysis_stage"),
            "source_collection_epoch":phase.get("source_collection_epoch"),
            "collection_cutoff_at_utc":phase.get("collection_cutoff_at_utc"),
            "config":config,
            "paper_only":True,
            "read_only":True,
            "real_execution":False,
          }
          p=pathlib.Path("control/operator-intents")/(row["request_id"]+".json")
          p.parent.mkdir(parents=True,exist_ok=True)
          status_path=pathlib.Path("control/operator-status")/(row["request_id"]+".json")
          status_path.parent.mkdir(parents=True,exist_ok=True)
          if p.exists():
            old=json.loads(p.read_text())
            stable=("schema_version","intent","request_id","requested_by","phase","phase_epoch","analysis_stage","source_collection_epoch","collection_cutoff_at_utc","config","paper_only","read_only","real_execution")
            if any(old.get(k) != row.get(k) for k in stable):
              raise SystemExit("request id already exists with different payload")
            row=old
          else:
            p.write_text(json.dumps(row,sort_keys=True,indent=2)+"\n")
          intent_digest=hashlib.sha256(json.dumps(row,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          status={
            "schema_version":"alina.operator_status.v2",
            "request_id":row["request_id"],
            "intent":row["intent"],
            "intent_digest":intent_digest,
            "state":"DISPATCHED",
            "terminal":False,
            "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
            "main_code_sha":os.environ.get("GITHUB_SHA"),
            "phase":row["phase"],
            "phase_epoch":row["phase_epoch"],
            "source_collection_epoch":row.get("source_collection_epoch"),
            "collection_cutoff_at_utc":row.get("collection_cutoff_at_utc"),
            "updated_at_utc":row["requested_at_utc"],
            "paper_only":True,
            "read_only":True,
            "real_execution":False,
          }
          status_path.write_text(json.dumps(status,sort_keys=True,indent=2)+"\n")
          PY
      - name: Validate durable operator status
        run: |
          set -euo pipefail
          python tools/validate_operator_status.py \
            --intent "control/operator-intents/${{ inputs.request_id }}.json" \
            --status "control/operator-status/${{ inputs.request_id }}.json"

      - name: Publish operator intent
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/operator-intents control/operator-status
          git diff --cached --quiet && exit 0
          git commit -m "operator: persist intent ${{ inputs.request_id }}"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i*2))
          done
          exit 1
  dispatch-dataset:
    needs: persist
    if: ${{ secrets.ALINA_DATASET_DISPATCH_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Dispatch immutable intent to Dataset V2
        env:
          DISPATCH_TOKEN: ${{ secrets.ALINA_DATASET_DISPATCH_TOKEN }}
          REQUEST_ID: ${{ inputs.request_id }}
          INTENT: ${{ inputs.intent }}
          FAMILY: ${{ inputs.family }}
          MAIN_CODE_SHA: ${{ github.sha }}
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/dispatch.json"
          import json, os
          config=json.loads(os.environ["CONFIG_JSON"])
          import pathlib
          phase=json.loads(pathlib.Path("control/alina-phase.json").read_text(encoding="utf-8"))
          payload={
              "event_type":"alina_operator_intent",
              "client_payload":{
                  "request_id":os.environ["REQUEST_ID"],
                  "intent":os.environ["INTENT"],
                  "strategy_family":os.environ["FAMILY"],
                  "main_code_sha":os.environ["MAIN_CODE_SHA"],
                  "phase":phase.get("phase"),
                  "phase_epoch":phase.get("epoch"),
                  "source_collection_epoch":phase.get("source_collection_epoch"),
                  "collection_cutoff_at_utc":phase.get("collection_cutoff_at_utc"),
                  "analysis_stage":phase.get("analysis_stage"),
              },
          }
          print(json.dumps(payload,separators=(",",":")))
          PY
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Rapt0r06300/alina-smartflow-datasets-v2/dispatches \
            --data-binary @"$RUNNER_TEMP/dispatch.json"
