name: recovery-contract

on:
  push:
    branches:
      - main
    paths:
      - "tools/restore_alina.py"
      - "tools/publish_dataset_v2_release.py"
      - "tools/recover_dataset_v2_capsules.py"
      - "tools/publish_local_recovery_snapshot.py"
      - "tools/mirror_releases_to_clone_lfs.py"
      - "tools/check_clone_payload_completeness.py"
      - "tests/test_restore_alina.py"
      - "tests/test_publish_dataset_v2_release.py"
      - "tests/test_publish_local_recovery_snapshot.py"
      - "tests/test_recover_dataset_v2_capsules.py"
      - "tests/test_mirror_releases_to_clone_lfs.py"
      - "tests/test_check_clone_payload_completeness.py"
      - ".github/workflows/recovery-contract.yml"
      - ".github/workflows/clone-payload-lfs-mirror.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      ALINA_RECOVERY_CAPSULE: "0"
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile recovery tools
        run: |
          python -m py_compile             tools/restore_alina.py             tools/publish_dataset_v2_release.py             tools/recover_dataset_v2_capsules.py             tools/publish_local_recovery_snapshot.py \
            tools/mirror_releases_to_clone_lfs.py \
            tools/check_clone_payload_completeness.py

      - name: Run deterministic recovery tests
        run: |
          python -m pip install --disable-pip-version-check -e . pytest
          python -m pytest -q tests/test_restore_alina.py tests/test_publish_dataset_v2_release.py tests/test_publish_local_recovery_snapshot.py tests/test_recover_dataset_v2_capsules.py tests/test_mirror_releases_to_clone_lfs.py tests/test_check_clone_payload_completeness.py --tb=line
