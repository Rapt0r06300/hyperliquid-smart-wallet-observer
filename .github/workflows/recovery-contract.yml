name: recovery-contract

on:
  push:
    branches:
      - main
    paths:
      - "tools/restore_alina.py"
      - "tools/publish_dataset_v2_release.py"
      - "tools/recover_dataset_v2_capsules.py"
      - "tools/publish_local_recovery_snapshot.py"
      - "tests/test_restore_alina.py"
      - "tests/test_restore_alina_launcher.py"
      - "tests/test_publish_dataset_v2_release.py"
      - "tests/test_publish_local_recovery_snapshot.py"
      - "tests/test_recover_dataset_v2_capsules.py"
      - "docs/DISASTER_RECOVERY.md"
      - "docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md"
      - "README.md"
      - ".github/workflows/recovery-contract.yml"
      - "clone_payload/README.md"
      - ".gitattributes"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

# Only redundant recovery test runs are superseded. This never cancels collectors.
concurrency:
  group: recovery-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      ALINA_RECOVERY_CAPSULE: "0"
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          # Exclude huge catalog and runtime datasets from recovery-only jobs.
          sparse-checkout: |
            tools
            tests
            src

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile published Release recovery tools
        run: |
          python -m py_compile tools/restore_alina.py tools/publish_dataset_v2_release.py tools/recover_dataset_v2_capsules.py tools/publish_local_recovery_snapshot.py

      - name: Run release recovery tests
        run: |
          python -m pip install --disable-pip-version-check -e . pytest
          python -m pytest -q tests/test_restore_alina.py tests/test_restore_alina_launcher.py tests/test_publish_dataset_v2_release.py tests/test_publish_local_recovery_snapshot.py tests/test_recover_dataset_v2_capsules.py --tb=line

  release-smoke:
    name: Verify a pinned published Release asset (no API inventory quota)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout recovery tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download and SHA-verify immutable Release evidence
        shell: bash
        run: |
          set -euo pipefail
          # Pinned source from GitHub Release asset ID 630886234. A 403 on
          # unrelated listing APIs must not prevent an independent byte test.
          # This is a small real-download smoke, NOT a full-inventory proof.
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from tools.restore_alina import download_asset

          asset = {
              "id": 630886234,
              "name": "packed-shards-0000.zip",
              "size": 402101,
              "state": "uploaded",
              "digest": "sha256:89ce485194446d646775e0977366e275f58c04c6d071b20a3e717d9ef0f91a21",
              "browser_download_url": (
                  "https://github.com/Rapt0r06300/"
                  "hyperliquid-smart-wallet-observer/releases/download/"
                  "data-v2-campaign-market-e8-9-2026101112-v7-u0/"
                  "packed-shards-0000.zip"
              ),
          }
          with tempfile.TemporaryDirectory() as directory:
              result = download_asset(asset, Path(directory))
              assert result["status"] == "DOWNLOADED_VERIFIED", result
              print(
                  "LIVE_RELEASE_SMOKE_OK asset_id=630886234 "
                  "bytes=402101 sha256_verified=true"
              )
          PY
