name: native-venues-github-validation

on:
  push:
    branches:
      - main
    paths:
      - 'tools/collecter_native_venues.py'
      - 'src/hl_observer/ops/collecteur_registry.py'
      - 'src/hl_observer/ops/preuve_de_vie.py'
      - 'tests/test_native_venues_collector.py'
      - 'tests/test_preuve_de_vie_niveaux.py'
      - 'tests/test_superviseur_profil_harvest.py'
      - 'tests/test_session_harvest.py'
      - 'tests/test_native_bybit_okx_venues.py'
      - '.github/workflows/native-venues-github-validation.yml'
      - 'src/hl_observer/collection/native_venue_coordinator.py'
      - 'src/hl_observer/collection/native_venue_market.py'
      - 'src/hl_observer/collection/native_market_tape.py'
      - 'src/hl_observer/collection/bybit_market_data.py'
      - 'src/hl_observer/collection/okx_market_data.py'
      - 'tests/test_native_venue_coordinator.py'
      - 'tests/test_native_venue_market.py'
      - 'tests/test_native_market_tape.py'
      - 'tests/test_native_venue_transport_integrity.py'
      - 'tests/test_dataset_v2_pipeline.py'
      - 'tests/test_dataset_v2_export.py'
      - 'tests/test_partitioned_tick_dataset.py'
      - 'src/hl_observer/datasets/v2_pipeline.py'
      - 'src/hl_observer/datasets/v2_export.py'
      - 'src/hl_observer/collection/partitioned_tick_dataset.py'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/collecter_native_venues.py'
      - 'src/hl_observer/ops/collecteur_registry.py'
      - 'src/hl_observer/ops/preuve_de_vie.py'
      - 'tests/test_native_venues_collector.py'
      - 'tests/test_preuve_de_vie_niveaux.py'
      - 'tests/test_superviseur_profil_harvest.py'
      - 'tests/test_session_harvest.py'
      - 'tests/test_native_bybit_okx_venues.py'
      - '.github/workflows/native-venues-github-validation.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      HL_ENABLE_MAINNET_EXECUTION: '0'
      HL_ENABLE_TESTNET_EXECUTION: '0'
      REAL_MAINNET_TRADING: 'false'
      TESTNET_EXECUTION_ENABLED: 'false'
      HYPERSMART_ENABLE_REAL_ORDERS: '0'
      ENABLE_REAL_ORDERS: '0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install project and pytest
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest

      - name: Targeted unit tests
        env:
          PYTHONPATH: src:tools:.
        run: |
          python -m pytest -q \
            tests/test_native_venues_collector.py \
            tests/test_native_bybit_okx_venues.py \
            tests/test_native_venue_coordinator.py \
            tests/test_native_venue_market.py \
            tests/test_native_market_tape.py \
            tests/test_native_venue_transport_integrity.py \
            tests/test_partitioned_tick_dataset.py \
            tests/test_dataset_v2_export.py \
            tests/test_dataset_v2_pipeline.py \
            tests/test_preuve_de_vie_niveaux.py \
            tests/test_superviseur_profil_harvest.py \
            tests/test_session_harvest.py \
            --tb=line

      - name: Bounded public-network smoke (diagnostic only)
        continue-on-error: true
        env:
          PYTHONPATH: src:tools:.
          ALINA_COLLECTOR_VERSION: ${{ github.sha }}
        run: |
          ROOT="$RUNNER_TEMP/native-venues-runtime-$GITHUB_RUN_ID"
          mkdir -p "$ROOT"
          python tools/collecter_native_venues.py             --root "$ROOT"             --max-symbols 5             --duration-s 20

          python - "$ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          hb_path = root / "runtime/data/native_venues_heartbeat.json"
          bundle_path = root / "runtime/data/dataset_v2_bundle/native_venues/BUNDLE_INDEX.json"

          if not hb_path.is_file():
              raise SystemExit("NATIVE_HEARTBEAT_MISSING")
          hb = json.loads(hb_path.read_text(encoding="utf-8"))

          if int(hb.get("records_written") or 0) <= 0:
              raise SystemExit("NATIVE_RECORDS_EMPTY")

          last = hb.get("last_event_ms") or {}
          missing = [v for v in ("bybit", "okx", "gate", "bitget") if int(last.get(v) or 0) <= 0]
          if missing:
              print("GITHUB_HOSTED_EGRESS_MISSING:" + ",".join(missing))

          if not bundle_path.is_file():
              raise SystemExit("NATIVE_V2_BUNDLE_MISSING")
          bundle = json.loads(bundle_path.read_text(encoding="utf-8"))
          if int(bundle.get("shard_count") or 0) <= 0:
              raise SystemExit("NATIVE_V2_SHARDS_EMPTY")
          assets = list((bundle_path.parent / "assets").glob("*.jsonl.gz"))
          if len(assets) != int(bundle["shard_count"]):
              raise SystemExit("NATIVE_V2_ASSET_COUNT_MISMATCH")

          print(json.dumps({
              "records_written": hb["records_written"],
              "last_event_ms": last,
              "v2_shards": bundle["shard_count"],
              "v2_asset_bytes": sum(path.stat().st_size for path in assets),
              "collector_version": bundle.get("collector_version"),
              "read_only": hb.get("read_only"),
              "real_execution": hb.get("real_execution"),
          }, indent=2))
          PY
