name: pre-run-pnl-314-320

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pre-run-pnl-314-320-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NO_COLOR: "1"
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  TESTNET_EXECUTION_ENABLED: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  preuves-pnl-314-320:
    name: Preuves Copy-Vault canoniques 314-320
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer dependances fail-closed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Prouver Copy-Vault 314 a 320 et vérité live
        run: |
          python -m pytest -q -p no:cacheprovider \
            --junitxml=junit-pre-run-pnl-314-320.xml \
            tests/test_pre_run_pnl_314_320.py \
            tests/test_canonical_775_source_loss.py \
            tests/test_userfills_live.py \
            tests/test_vault_fills_backfill.py \
            tests/test_backfill_vault_fills.py \
            tests/test_vault_ledger.py \
            tests/test_copy_vault_checkpoint_tail.py
      - name: Revalider la cible 301 a 313
        run: |
          python -m pytest -q -p no:cacheprovider \
            --junitxml=junit-pre-run-pnl-upstream-301-313.xml \
            tests/test_pre_run_pnl_301_313.py \
            tests/test_economic_objective.py
      - name: Audits securite finaux
        run: |
          python -m hl_observer safety-audit
          python -m hl_observer audit-safety
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pre-run-pnl-314-320-${{ github.sha }}
          path: junit-pre-run-pnl-*.xml
          if-no-files-found: error
          retention-days: 30
