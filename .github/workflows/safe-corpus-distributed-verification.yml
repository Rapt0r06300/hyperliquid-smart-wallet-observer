name: SAFE corpus distributed byte verification

on:
  # Full byte certification is expensive and must not be queued on each main
  # push: GitHub concurrency replaces an older pending run even with
  # cancel-in-progress: false. Use dispatch or the nightly schedule instead.
  schedule:
    # After nightly clone/readiness and durable-state gates. Paris: 22:37 CEST.
    - cron: '37 20 * * *'
  workflow_dispatch:
    inputs:
      partitions:
        description: "Hosted partitions (1-64; 24 for the current ~116 GiB corpus)"
        required: true
        default: "24"
        type: string

permissions:
  contents: read

concurrency:
  group: safe-corpus-distributed-verification
  # Keep the active full-corpus proof; a new push must not cancel verified work.
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      partition_count: ${{ steps.plan.outputs.partition_count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            catalog
            tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: plan
        name: Freeze exact SHA-bound distributed plan
        shell: bash
        env:
          REQUESTED_PARTITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.partitions || '24' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          raw=os.environ["REQUESTED_PARTITIONS"]
          if not re.fullmatch(r"[1-9]|[1-5][0-9]|6[0-4]", raw):
              raise SystemExit("PARTITION_COUNT_MUST_BE_1_TO_64")
          count=int(raw)
          matrix=json.dumps({"partition": list(range(count))}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"partition_count={count}\n")
              out.write(f"matrix={matrix}\n")
          PY
          python tools/verify_safe_corpus_partition.py plan \
            --partitions "$REQUESTED_PARTITIONS" \
            --output "$RUNNER_TEMP/SAFE_DISTRIBUTED_PLAN.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-distributed-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/SAFE_DISTRIBUTED_PLAN.json
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: prepare
    strategy:
      fail-fast: false
      # Prioritize the SAFE GO lane while keeping bounded GitHub-hosted concurrency.
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            catalog
            tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and verify assigned SAFE bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/verify_safe_corpus_partition.py verify \
            --partitions "${{ needs.prepare.outputs.partition_count }}" \
            --partition "${{ matrix.partition }}" \
            --work-root "$RUNNER_TEMP/safe-verify-work" \
            --output "$RUNNER_TEMP/safe-corpus-partition-${{ matrix.partition }}.json"
      - name: Publish bounded partition receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-corpus-partition-${{ matrix.partition }}-${{ github.run_id }}
          path: ${{ runner.temp }}/safe-corpus-partition-${{ matrix.partition }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            catalog
            tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: safe-corpus-partition-*-${{ github.run_id }}
          path: ${{ runner.temp }}/safe-partition-receipts
          merge-multiple: true
      - name: Prove exact full coverage and publish certificate
        run: |
          set -euo pipefail
          python tools/verify_safe_corpus_partition.py aggregate \
            --partitions "${{ needs.prepare.outputs.partition_count }}" \
            --receipts "$RUNNER_TEMP/safe-partition-receipts" \
            --output "$RUNNER_TEMP/SAFE_DISTRIBUTED_CERTIFICATE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-distributed-certificate-${{ github.run_id }}
          path: ${{ runner.temp }}/SAFE_DISTRIBUTED_CERTIFICATE.json
          if-no-files-found: error
          retention-days: 90
