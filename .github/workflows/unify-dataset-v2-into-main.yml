name: unify-dataset-v2-into-main

on:
  workflow_dispatch:
    inputs:
      import_state:
        description: "Re-import legacy Dataset V2 state (migration-only)"
        required: false
        default: false
        type: boolean
      migrate_releases:
        description: "Mirror legacy Dataset V2 releases into this repository"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: unify-dataset-v2-into-main
  cancel-in-progress: false

jobs:
  import-state:
    if: ${{ inputs.import_state == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Alina
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Checkout legacy Dataset V2 snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Rapt0r06300/alina-smartflow-datasets-v2
          ref: main
          path: legacy-dataset
          fetch-depth: 1
          persist-credentials: false

      - name: Verify legacy authority is safe to cut over
        shell: bash
        run: |
          set -euo pipefail
          LEGACY_PHASE="$(python -c 'import json; print(json.load(open("legacy-dataset/control/alina-phase.json"))["phase"])')"
          LEGACY_EPOCH="$(python -c 'import json; print(json.load(open("legacy-dataset/control/alina-phase.json"))["epoch"])')"
          LEGACY_HEAD="$(git -C legacy-dataset rev-parse HEAD)"
          echo "legacy_phase=$LEGACY_PHASE legacy_epoch=$LEGACY_EPOCH legacy_head=$LEGACY_HEAD"
          test "$LEGACY_PHASE" = "COLLECT"

      - name: Import active Dataset V2 control plane and catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control catalog datasets tools tests docs
          cp -a legacy-dataset/control/. control/
          cp -a legacy-dataset/catalog/. catalog/
          cp -a legacy-dataset/tools/. tools/
          cp -a legacy-dataset/tests/. tests/
          cp -a legacy-dataset/datasets/. datasets/

          # Active automation now targets this single repository. Historical
          # catalog receipts remain byte-for-byte provenance and are not rewritten.
          grep -RIl --exclude='unify-dataset-v2-into-main.yml'             'Rapt0r06300/alina-smartflow-datasets-v2'             tools tests 2>/dev/null | while read -r path; do
              sed -i 's#Rapt0r06300/alina-smartflow-datasets-v2#Rapt0r06300/hyperliquid-smart-wallet-observer#g' "$path"
          done

          LEGACY_HEAD="$(git -C legacy-dataset rev-parse HEAD)"
          TARGET_PARENT="$(git rev-parse HEAD)"
          python - <<'PY' "$LEGACY_HEAD" "$TARGET_PARENT"
          import datetime as dt, json, pathlib, sys
          legacy_head, target_parent = sys.argv[1:3]
          row = {
              "schema": "alina.unified_repository_migration.v1",
              "source_repository": "Rapt0r06300/alina-smartflow-datasets-v2",
              "source_head": legacy_head,
              "target_repository": "Rapt0r06300/hyperliquid-smart-wallet-observer",
              "target_parent": target_parent,
              "mode": "single-active-repository",
              "phase_authority": "control/alina-phase.json",
              "heavy_data_storage": "github-releases",
              "historical_catalog_provenance_preserved": True,
              "migrated_at_utc": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00","Z"),
          }
          pathlib.Path("control/unified-repository.json").write_text(
              json.dumps(row, indent=2, sort_keys=True)+"\n", encoding="utf-8"
          )
          PY

          cat > docs/UNIFIED_REPOSITORY.md <<'EOF'
          # Unified Alina Smart Flow repository

          The active control plane, campaign catalog, collection workflows, tests,
          replay/backtest tooling, and future Dataset V2 releases live in this repository.

          Manual phase contract:
          - IDLE: no new heavy work.
          - COLLECT: collection only; autonomous same-epoch relay is allowed.
          - ANALYZE: entered only by an explicit operator request; collection drains,
            then replay/backtest/OOS/forward/PNL proof/scoreboard execute.

          Heavy market-data shards are stored as GitHub Release assets, not committed
          as ordinary Git blobs. The former Dataset V2 repository is retained only as
          migration provenance until historical release mirroring is verified complete.
          EOF

          rm -rf legacy-dataset

      - name: Commit unified state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          gh auth setup-git
          git add control catalog datasets tools tests docs/UNIFIED_REPOSITORY.md
          git reset -- .github/workflows >/dev/null 2>&1 || true
          if ! git diff --cached --name-only | grep -Ev '^\.github/workflows/' >/dev/null; then
            echo "No non-workflow migration files staged" >&2
            exit 2
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing migration commit containing workflow files" >&2
            exit 3
          fi
          git diff --cached --quiet && exit 0
          git commit -m "architecture: unify Dataset V2 into Alina repository"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          exit 1

      - name: Confirm unified state is committed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:control/alina-phase.json | python -m json.tool
          test "$(git show origin/main:control/alina-phase.json | python -c 'import json,sys; print(json.load(sys.stdin)["phase"])')" = "COLLECT"

  mirror-releases:
    needs: import-state
    if: ${{ always() && inputs.migrate_releases == true && (needs.import-state.result == 'success' || needs.import-state.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout Alina
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Mirror bounded batch of legacy release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: Rapt0r06300/alina-smartflow-datasets-v2
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-mirror"
          STATE="control/release-migration-state.json"
          python - <<'PY' "$STATE"
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          if not p.exists():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps({"schema":"alina.release_migration.v1","completed_tags":[]},indent=2)+"\n")
          PY

          mapfile -t TAGS < <(gh api --paginate "repos/$SOURCE_REPO/releases?per_page=100" --jq '.[].tag_name')
          migrated=0
          for tag in "${TAGS[@]}"; do
            done_tag="$(python - <<'PY' "$STATE" "$tag"
          import json,sys
          row=json.load(open(sys.argv[1]))
          print("1" if sys.argv[2] in set(row.get("completed_tags") or []) else "0")
          PY
            )"
            [ "$done_tag" = "0" ] || continue

            work="$RUNNER_TEMP/release-mirror/$tag"
            rm -rf "$work"
            mkdir -p "$work"

            # Public source repository: download every release asset for this tag.
            gh release download "$tag" --repo "$SOURCE_REPO" --dir "$work" || {
              echo "::warning::Could not download release $tag; leave it pending."
              continue
            }

            if ! gh release view "$tag" --repo "$TARGET_REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$TARGET_REPO" --title "$tag" --notes "Migrated from $SOURCE_REPO"
            fi

            shopt -s nullglob
            assets=("$work"/*)
            if [ "${#assets[@]}" -gt 0 ]; then
              gh release upload "$tag" "${assets[@]}" --repo "$TARGET_REPO" --clobber
            fi

            python - <<'PY' "$STATE" "$tag"
          import datetime as dt, json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); tag=sys.argv[2]
          row=json.loads(p.read_text())
          done=list(row.get("completed_tags") or [])
          if tag not in done: done.append(tag)
          row["completed_tags"]=done
          row["last_completed_tag"]=tag
          row["updated_at_utc"]=dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(row,indent=2,sort_keys=True)+"\n")
          PY
            migrated=$((migrated+1))

            # Keep each run bounded so GitHub-hosted continuation is reliable.
            if [ "$migrated" -ge 12 ]; then
              break
            fi
          done

          total="${#TAGS[@]}"
          complete="$(python - <<'PY' "$STATE"
          import json,sys
          print(len(set(json.load(open(sys.argv[1])).get("completed_tags") or [])))
          PY
          )"
          python - <<'PY' "$STATE" "$total" "$complete"
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); row=json.loads(p.read_text())
          row["source_release_count"]=int(sys.argv[2])
          row["mirrored_release_count"]=int(sys.argv[3])
          row["complete"]=int(sys.argv[2])==int(sys.argv[3])
          p.write_text(json.dumps(row,indent=2,sort_keys=True)+"\n")
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATE"
          if ! git diff --cached --quiet; then
            git commit -m "migration: checkpoint Dataset V2 release mirror"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              sleep "$((attempt * 3))"
            done
          fi

          complete="$(python -c 'import json; print("1" if json.load(open("'"$STATE"'"))["complete"] else "0")')"
          if [ "$complete" != "1" ]; then
            gh workflow run unify-dataset-v2-into-main.yml               --repo "$TARGET_REPO"               --ref main               -f migrate_releases=true || true
          fi
