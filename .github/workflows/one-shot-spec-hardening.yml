name: One-shot canonical spec hardening

on:
  push:
    paths:
      - '.github/workflows/one-shot-spec-hardening.yml'

permissions:
  contents: write

jobs:
  harden-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Append normative closure hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md')
          marker = '## Normative closure hardening — final consolidated contracts (2026-09-27)'
          text = p.read_text(encoding='utf-8')
          if marker in text:
              raise SystemExit('marker already present; refusing duplicate append')
          add = r'''

## Normative closure hardening — final consolidated contracts (2026-09-27)

This section is normative and closes gaps found while reconciling the interrupted Work conversation, the current main repository, Dataset V2, and the preceding design. It **does not create a second roadmap or a second implementation**. Where older wording conflicts with this section, this section wins. Existing stricter requirements elsewhere in this specification remain stricter.

### 1. Canonical ownership and execution topology

Alina uses one logical system with two execution planes:

- **main Alina repository = canonical operator/control surface and owner of orchestration semantics, campaign types, strategy/economic logic, accounting contracts and user-facing launch commands;**
- **Dataset V2 = canonical durable data plane and default heavy GitHub-hosted execution plane;**
- every canonical phase and full research cycle must be launchable from Alina itself;
- GitHub-requested heavy work is delegated to Dataset V2 on GitHub-hosted runners;
- a user-started Alina process may execute the same canonical pipeline locally only when the user explicitly starts it;
- cloud automation must never wake, depend on, register, or require the user's PC and must never create a self-hosted runner;
- both paths reuse the same schemas, gates, economic engines, cost models, accounting code, manifests and proof semantics. No parallel PnL/execution implementation is allowed.

A single operator-facing command/API family must cover at least: status, `IDLE`, `COLLECT`, drain/stop collection, `ANALYZE`, replay, backtest, OOS/forward paper validation, Copy-Vault, Lead-Lag, Cross-Venue, module PnL proof, scoreboard/report, pause, resume, retry and full-cycle execution.

**Acceptance:** a campaign initiated from main Alina can be followed end-to-end through Dataset V2 without manual Dataset V2 edits; the same frozen input/config run through the explicitly user-started Alina path and the GitHub-hosted path produces the same canonical economic event stream and accounting result, modulo explicitly modeled nondeterministic transport metadata that is excluded from economic identity.

### 2. One durable phase authority; no split brain

There is exactly one authoritative phase record with `IDLE | COLLECT | ANALYZE`, a monotonically increasing `phase_epoch`, schema version, content digest, actor, reason and transition timestamp.

Every campaign/work unit must bind to:

- `campaign_id`;
- `phase` and `phase_epoch`;
- `source_collection_epoch`;
- `collection_cutoff` when analysis begins;
- immutable code SHA;
- immutable config digest;
- dataset generation/manifest digest;
- environment/provenance digest;
- campaign schema version.

Workers must fail closed on stale epoch, conflicting authority, missing identity fields or a lease owned by another valid actor. Local Alina and Dataset V2 must never independently own the same campaign lease.

**Acceptance:** deterministic tests cover stale writers, concurrent transitions, lease expiry/reacquisition, duplicate dispatch, delayed GitHub jobs and local/cloud collision. At most one authority can mutate a campaign generation.

### 3. Phase semantics and deterministic drain

`IDLE` creates no heavy work. `COLLECT` creates only collection/archive/Event-Intelligence work authorized for the current collection epoch. `ANALYZE` creates no new collection work and consumes only evidence frozen at the transition cutoff.

The `COLLECT -> ANALYZE` transition is a drain protocol, not an abrupt mixed-mode switch:

1. atomically advance/freeze the phase epoch;
2. stop creation and claiming of new collection units for the old epoch;
3. allow only already-valid claimed units to finish inside a bounded drain deadline;
4. classify timed-out/incomplete units explicitly;
5. freeze the eligible dataset manifest and digest;
6. start quality/replay/backtest/OOS-forward/PnL work only from that frozen evidence.

Scheduled workflows are watchdog/recovery triggers only after the phase controller is authoritative. They may never manufacture work contrary to operator phase. Schedule delay or dropped scheduled events must not alter correctness; missed watchdog ticks are recoverable from durable state.

### 4. Exactly-once publication across repositories and restarts

Exactly-once semantics are required for campaign terminalization, Dataset V2 publication, release materialization and checkpoint advancement.

Publication uses an immutable identity key containing campaign/work-unit identity, source epoch, payload digest and schema version. A retry with the same identity and same digest is idempotent. The same identity with a different digest is a hard conflict and must fail closed. A crash between publication and checkpoint update must reconcile by reading durable publication state before any retry.

No correctness guarantee may depend on runner-local disk, cache or process memory. A fresh GitHub-hosted runner must reconstruct all authoritative state from repository/release/durable evidence.

### 5. Dataset truth, exact counts and global deduplication

Dataset V2 metrics must distinguish at minimum: raw records, parsed records, valid records, unique records, replay-eligible records, rejected records, duplicate records and quarantined records. Byte size, file count or approximate line count must never substitute for an exact economic record count.

Global identity/deduplication must work across shards, releases, retries and campaign generations. Duplicate trades/fills/events that cross shard boundaries must not be counted twice. Venue-native identifiers are preferred; deterministic composite identities require documented collision handling.

Every metric carries the dataset generation/manifest digest from which it was computed. Missing or ambiguous counts are `UNMEASURABLE`, never inferred as success.

### 6. SAFE -> replay -> economic-proof closure

`SAFE` is necessary but not sufficient. A dataset is economically usable only after the complete chain succeeds:

`raw provenance -> schema/quality -> SAFE -> replay-compatible -> deterministic replay -> backtest -> OOS/forward paper -> module PnL proof -> scoreboard`.

Each arrow is a machine-readable gate. Failure, missing evidence, stale evidence or incompatible schema stops downstream promotion. No aggregate result may hide a failed module. Copy-Vault, Lead-Lag and Cross-Venue must each prove their own net economics after modeled fees, slippage, latency, funding and all applicable execution costs.

A single machine-readable gate registry must map every normative gate to: owner, input evidence, executable validator, failure code, blocking downstream stages and proof artifact. Markdown-only gates are incomplete implementation.

### 7. Immutable OOS/forward identity and anti-selection leakage

Before OOS or forward evaluation begins, freeze and hash:

- train/in-sample boundary;
- OOS/forward boundary;
- eligible instruments/venues/leaders;
- feature/config version;
- strategy parameters;
- cost/execution model version;
- code SHA;
- dataset manifest;
- random seed where applicable.

After outcome observation, none of these may be silently changed while retaining the same experiment identity. Any change creates a new experiment generation and the previous result remains auditable. Promotion logic must explicitly reject look-ahead, survivorship leakage, post-selection universe edits and reclassification of losing observations.

### 8. Reproducible execution environment

Economic reproducibility includes the runtime environment, not only code/config/data hashes. Every proof-bearing run records at minimum:

- OS/runner image identity where available;
- Python/runtime version;
- dependency lock/fully resolved dependency digest;
- relevant native library/tool versions;
- timezone/locale assumptions;
- action versions pinned to immutable SHAs for proof-critical workflows;
- environment variables that affect deterministic computation, with secrets represented only by non-secret identity/version metadata.

Mutable `latest` dependencies or unrecorded runner-image drift cannot produce canonical economic proof. Re-running a historical proof on a fresh environment must either reproduce the canonical result or fail explicitly with a provenance mismatch.

### 9. GitHub-hosted execution is bounded and resumable by design

No campaign may assume one GitHub-hosted job can run indefinitely. Work units must checkpoint well before platform timeout and be small enough to resume without large recomputation. Queue delay, cancellation, runner loss, API throttling and scheduled-event delay/drop are expected failure modes, not exceptional undefined behavior.

Durable campaign state, not Actions logs/artifacts alone, is the source of truth. GitHub Actions artifacts/logs are transient convenience evidence and must not be the sole copy of any dataset, checkpoint or economic proof required for reproducibility.

Campaign controllers must apply bounded retries with classified errors, backoff/jitter for transient external failures and a terminal/stuck state for non-progress. Infinite retry loops are forbidden.

### 10. Fresh-runner disaster recovery contract

A periodic deterministic restore drill must prove that a completely fresh GitHub-hosted runner can reconstruct a selected completed campaign from durable evidence only and reproduce its manifest, gates and canonical accounting result.

The drill must not rely on caches. Missing releases, corrupted manifests, incompatible schemas or unavailable dependencies produce explicit failure. Recovery-point and recovery-time measurements are reported; no unsupported claim of recoverability is allowed.

### 11. Backlog, stuck-state and progress observability

Every campaign exposes machine-readable progress: total units, pending, claimable, leased, running, succeeded, failed, quarantined, terminal, retry count, oldest pending age, last progress timestamp and blocking reason.

A campaign becomes `STUCK` when its documented progress invariant is violated for a bounded period. `STUCK` is actionable and must identify the blocker; it must never masquerade as `RUNNING` indefinitely. Operator status from main Alina must surface the same authoritative state as Dataset V2.

### 12. Event Intelligence 1..120 requires functional closure

Registry presence for ideas 1..120 proves only structural existence. Each idea is considered implemented only if its declared source/input is actually wired, normalized, versioned, quality-gated and consumed by at least one declared downstream decision/feature/analysis path, or is explicitly marked unsupported/retired with rationale.

A machine-readable coverage report must distinguish `REGISTERED`, `WIRED`, `DATA_PRESENT`, `CONSUMED`, `VALIDATED`, `UNMEASURABLE`, `UNSUPPORTED` and `RETIRED`. The system must not report “120/120 implemented” from registry membership alone.

### 13. Simulation -> paper-forward calibration

Backtest/replay execution assumptions must be continuously calibrated against observable paper-forward behavior. Calibration tracks at least fill probability, fill delay, spread crossing, slippage, partial fills, order-book depth/capacity, cancellation/staleness, funding timing and venue-specific fee rules where relevant.

The calibration window and model version are immutable inputs to economic proof. If realized paper-forward behavior breaches documented calibration tolerances, affected backtest/replay proof becomes stale and promotion is blocked until recalibrated. Calibration must not tune on the same OOS outcome later used as proof.

### 14. Economic accounting invariants

Canonical PnL is event-sourced from immutable economic events and reconciles independently at trade, position, module and portfolio levels. At minimum:

`net_pnl = realized_price_pnl + funding + rebates - fees - slippage_cost - explicitly modeled execution/borrow/other costs`.

No second PnL engine may be used for reporting. Decimal/fixed-point semantics, asset/currency conversion timestamp, mark/index/oracle choice, rounding, contract multipliers and sign conventions are explicit and versioned. Any reconciliation difference beyond the documented tolerance is a hard gate failure.

Portfolio aggregation must not allow one module's gains to satisfy another module's proof threshold. Capacity and capital usage must prevent double allocation of the same paper capital across simultaneous strategies unless the portfolio model explicitly permits and accounts for it.

### 15. Data-time and causality contract

Every replay-critical event distinguishes exchange/event time, receive time and processing time where available. Clock offset/uncertainty and sequence/gap state are recorded. Sorting by a timestamp that was unavailable to the strategy at decision time is forbidden.

L2/BBO reconstruction must detect sequence gaps, stale snapshots, crossed/invalid books and resynchronization boundaries. A gap that can affect an economic decision invalidates or quarantines the affected interval rather than being silently interpolated.

Cross-venue and Lead-Lag features use only information causally observable at their decision timestamp after modeled transport/processing latency. Copy-Vault decisions similarly model leader-fill observation delay and follower execution delay.

### 16. Schema evolution and checkpoint migration

Campaign manifests, phase records, dataset manifests, checkpoints, economic events and proof artifacts are versioned schemas. Readers declare supported versions. Migrations are deterministic, tested and provenance-preserving.

A worker must not silently interpret an unknown future schema. Incompatible state fails closed. Checkpoint migration cannot change completed economic meaning; if semantic reinterpretation is required, create a new campaign generation.

### 17. Resource budgets and bounded growth

Every continuous collector/campaign family has explicit budgets for runtime, API calls, GitHub concurrency, durable storage growth, release count and temporary artifact/cache use. Budget exhaustion degrades safely: pause/throttle/quarantine with visible status rather than deleting authoritative evidence or silently reducing data quality.

Retention policy distinguishes authoritative durable evidence from transient Actions artifacts. Garbage collection is deterministic, manifest-aware and must never delete the only copy required to reproduce an accepted proof.

### 18. Security and read-only invariant

Alina remains strictly paper/read-only throughout this roadmap:

- no private trading keys in repository, dataset, artifacts or logs;
- no real order placement, cancellation or transfer endpoints;
- no workflow may activate live trading by configuration drift;
- credentials use least privilege and secret scanning/redaction;
- untrusted dataset/event text is data, never executable instructions;
- external payloads are size/schema bounded before parsing;
- dependency/action provenance is pinned for proof-critical paths.

A negative test must demonstrate that live-order code paths cannot be reached from canonical campaign commands.

### 19. Work closure report

The interrupted Work mission is not “done” until a machine-readable closure report maps every Work carry-over/OPEN item to one of `DONE`, `BLOCKED`, `UNMEASURABLE` or `SUPERSEDED`, with evidence links/digests. `DONE` requires executable proof, not file presence or a commit message.

The report also records current main Alina SHA, Dataset V2 SHA, dataset generation, gate-registry digest, environment digest and the exact test/proof commands used.

### 20. Global definition of DONE

The manual-phase/orchestrator roadmap is complete only when all of the following are simultaneously true:

1. main Alina can launch and observe every canonical phase/full cycle without manual Dataset V2 edits;
2. one authoritative `IDLE/COLLECT/ANALYZE` state machine controls creation, drain and analysis epochs;
3. local user-started and GitHub-hosted paths share one economic implementation and pass deterministic parity tests;
4. no self-hosted runner or cloud dependency on the user's PC exists;
5. Dataset V2 exact metrics/global deduplication are proven for the eligible corpus;
6. all accepted evidence passes the machine-readable SAFE/replay/economic gate chain;
7. Copy-Vault, Lead-Lag and Cross-Venue each have independent OOS/forward net-PnL proof or are explicitly `UNMEASURABLE`/not promoted;
8. OOS/forward identities are immutable and anti-leakage checks pass;
9. proof-bearing runs include reproducible environment provenance;
10. fresh-runner restore drill succeeds from durable evidence only;
11. exactly-once publication/checkpoint recovery passes crash/retry tests;
12. backlog/stuck observability exposes every non-terminal blocker;
13. Event Intelligence 1..120 has functional, not merely structural, coverage status;
14. simulation assumptions are calibrated against paper-forward evidence and stale calibration blocks promotion;
15. accounting reconciliation passes independently at trade/position/module/portfolio levels;
16. data-time/causality/L2 gap contracts pass replay tests;
17. schema migration and resource-budget failure modes are fail-closed;
18. live trading remains unreachable and no private trading key is required;
19. the Work closure report contains no unresolved item mislabeled as done;
20. the final scoreboard and economic proofs are reproducible from immutable code + config + environment + dataset identities.

Until every applicable item above is evidenced, the correct status is `INCOMPLETE`, `BLOCKED` or `UNMEASURABLE` — never a false `DONE`.

### 21. Required verification matrix

Before this specification itself is considered implementation-ready, the implementation plan must map each normative contract to at least one deterministic verification class:

| Contract | Minimum verification |
|---|---|
| operator surface / dual plane | CLI/API contract + local/cloud parity fixture |
| phase authority / epochs | state-machine + concurrent/stale-writer tests |
| drain/cutoff | race/restart fixture with frozen manifest assertion |
| exactly-once publication | crash-before/after-publish fault injection |
| exact metrics / dedup | cross-shard duplicate fixtures + exact oracle counts |
| SAFE/replay gates | malformed/stale/missing evidence negative tests |
| OOS/forward identity | mutation-after-freeze rejection tests |
| environment provenance | fresh-run reproducibility + mismatch rejection |
| GitHub resumability | cancellation/timeout/fresh-runner resume fixture |
| restore | cache-free reconstruction drill |
| observability | no-progress -> STUCK deterministic transition |
| Event Intelligence | registry-to-source-to-consumer coverage audit |
| calibration | synthetic drift -> stale-proof rejection |
| accounting | independent ledger reconciliation fixtures |
| causality | timestamp/latency/look-ahead adversarial fixtures |
| schema evolution | old/current/future-version migration/rejection tests |
| budgets | quota/storage/API exhaustion fail-closed fixtures |
| paper/read-only | negative live-endpoint reachability test |

The implementation plan may add stricter tests. It may not remove these classes without replacing them with demonstrably stronger evidence.
'''
          p.write_text(text.rstrip() + add + '\n', encoding='utf-8')
          PY
      - name: Verify spec and remove one-shot workflow
