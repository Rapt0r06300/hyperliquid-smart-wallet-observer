name: OKX public Copy-Vault leader observations

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-copy-trader-observations
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Enforce canonical COLLECT phase
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          if python tools/phase_gate.py allow --kind copy_vault_collection; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "No collection started: canonical phase gate is closed."
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.phase.outputs.allowed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install read-only collector dependencies
        if: steps.phase.outputs.allowed == 'true'
        run: |
          python -m pip install --require-hashes -r requirements-ci-bootstrap.txt
          python -m pip install setuptools wheel
          python -m pip install -e .

      - name: Discover and observe a frozen OKX leader set
        if: steps.phase.outputs.allowed == 'true'
        shell: bash
        env:
          PYTHONPATH: src:tools
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          HL_ENABLE_MAINNET_EXECUTION: "0"
          HL_ENABLE_TESTNET_EXECUTION: "0"
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=90s 330m \
            python tools/collect_okx_copy_traders.py \
              --network-read \
              --follow \
              --phase-state control/alina-phase.json \
              --phase-state-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/control/alina-phase.json" \
              --top 15 \
              --max-pages-per-sort 100 \
              --history-limit 100 \
              --interval-seconds 300

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.phase.outputs.allowed == 'true'
        with:
          name: okx-copy-vault-observations-${{ github.run_id }}
          path: runtime/reports/okx_copy_vault/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish a durable research-only GitHub Release snapshot
        if: always() && steps.phase.outputs.allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT_ROOT="runtime/reports/okx_copy_vault"
          if [[ ! -d "$REPORT_ROOT" ]] || ! find "$REPORT_ROOT" -type f -name '*.json' -print -quit | grep -q .; then
            echo "No observation JSON exists; no empty release will be created."
            exit 0
          fi
          TAG="copyvault-okx-observations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ARCHIVE="$RUNNER_TEMP/${TAG}.zip"
          python tools/package_okx_observations.py "$REPORT_ROOT" "$ARCHIVE"
          sha256sum "$ARCHIVE"
          gh release create "$TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Copy-Vault OKX research observations ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --notes "Read-only OKX research observations with a per-file SHA-256 manifest. These assets are not SAFE shards, replay evidence, or economic proof."
