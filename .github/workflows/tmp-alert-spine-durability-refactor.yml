name: tmp-alert-spine-durability-refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-alert-spine-durability-refactor.yml
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHONPATH: src:tools
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HL_ENABLE_MAINNET_EXECUTION: "0"
  HL_ENABLE_TESTNET_EXECUTION: "0"
  REAL_MAINNET_TRADING: "false"
  HYPERSMART_ENABLE_REAL_ORDERS: "0"
  ENABLE_REAL_ORDERS: "0"

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer dépendances exactes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-recherche.txt
          python -m pip install -r requirements-ci-tools.txt
      - name: Prouver le RED structurel courant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/hl_observer/alerts/spine.py')
          n = len(p.read_text(encoding='utf-8').splitlines())
          print(f'RED spine.py={n}')
          if n <= 800:
              raise SystemExit('EXPECTED_STRUCTURAL_RED_MISSING')
          PY
      - name: Extraire durabilité canonique et mixin writer
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/hl_observer/alerts/spine.py')
          helper = Path('src/hl_observer/alerts/durability.py')
          text = source.read_text(encoding='utf-8')
          start = text.index('\ndef _validate_canonical_event(')
          end = text.index('\nclass CanonicalAlertWriter:')
          block = text[start + 1:end].rstrip() + '\n'

          header = '''"""Durable alert-spine primitives and canonical-event validation.

          This module is local-only and preserves the alert spine fail-closed,
          paper/read-only contract. It has no network, shell, model, signing or
          trading capability.
          """
          from __future__ import annotations

          import json
          import os
          import tempfile
          from collections.abc import Mapping
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Any

          from hl_observer.alerts.validation import (
              _CODE_SHA_RE,
              _MAX_DEDUP_KEY,
              _MAX_HEADLINE,
              _SEGMENT_RE,
              _SHA256_RE,
              EVENT_SCHEMA,
              FRESHNESS_STATES,
              LEDGER_LATEST_SCHEMA,
              SOURCE_HEALTH_STATES,
              AlertSpineError,
              AlertValidationError,
              CanonicalLedgerCorruption,
              WriterBusy,
              _bounded_strings,
              _canonical_bytes,
              _event_identity,
              _event_reference,
              _event_stream_hash,
              _evidence_refs,
              _is_within,
              _reject_order_capability,
              _score_components,
              _score_receipt,
              _sha256,
              _sha256_bytes,
              _validate_lifecycle_receipt,
              _validate_producer_epoch,
              _validate_producer_id,
              _validate_proposal,
          )
          from hl_observer.collection.collecte_fiable import append_jsonl, ecrire_atomique

          '''
          header = '\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines()) + '\n'

          imported = '''from hl_observer.alerts.durability import (
              AlertProducerInbox,
              AlertSpinePaths,
              CanonicalAlertDurabilityMixin,
              SingleWriterFileLock,
              _validate_canonical_event,
              jsonl_append_fsync,
          )
          '''
          imported = '\n'.join(line[10:] if line.startswith('          ') else line for line in imported.splitlines()) + '\n'
          rewritten = text[:start] + '\n\n' + imported + '\n' + text[end + 1:]

          method_start = rewritten.index('    def _cursor_payload(')
          method_end = rewritten.index('    def _pending_paths(')
          methods = rewritten[method_start:method_end].rstrip() + '\n'
          helper.write_text(
              header + block + '\n\nclass CanonicalAlertDurabilityMixin:\n' + methods,
              encoding='utf-8',
          )
          rewritten = rewritten[:method_start] + rewritten[method_end:]
          rewritten = rewritten.replace(
              'class CanonicalAlertWriter:',
              'class CanonicalAlertWriter(CanonicalAlertDurabilityMixin):',
              1,
          )
          source.write_text(rewritten, encoding='utf-8')
          PY
      - name: Vérifier structure et style
        run: |
          python -m ruff check --fix src/hl_observer/alerts/spine.py src/hl_observer/alerts/durability.py
          python -m ruff check src/hl_observer/alerts/spine.py src/hl_observer/alerts/durability.py
          python - <<'PY'
          from pathlib import Path
          for rel in ('src/hl_observer/alerts/spine.py', 'src/hl_observer/alerts/durability.py', 'src/hl_observer/alerts/validation.py'):
              n = len(Path(rel).read_text(encoding='utf-8').splitlines())
              print(f'{rel}={n}')
              if n > 800:
                  raise SystemExit(f'FILE_TOO_LARGE:{rel}:{n}')
          PY
      - name: Tests alert spine ciblés
        run: |
          python -m pytest -q \
            tests/test_alert_spine_v26.py \
            tests/test_alert_spool_v26.py \
            tests/test_alert_ledger_v26.py \
            tests/test_alert_scoring_v26.py \
            tests/test_alert_envelope_v26.py \
            tests/test_alert_projection_rebuild_v26.py \
            tests/test_alert_idempotency_v26.py \
            tests/test_alert_freshness_v26.py \
            tests/test_alert_read_model_v26.py
      - name: Vérifier invariant architecture et safety
        run: |
          python -m pytest -q tests/test_invariants_architecture.py
          python -m pytest -q tests/test_no_mainnet_execution.py tests/test_runtime_contract.py tests/test_coverage_closure_import_all.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alert-spine-durability-refactor-${{ github.sha }}
          path: |
            src/hl_observer/alerts/spine.py
            src/hl_observer/alerts/durability.py
      - name: Publier uniquement le refactor vérifié sur main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo "MAIN_MOVED_ABORT"; exit 1; }
          git diff --check -- src/hl_observer/alerts/spine.py src/hl_observer/alerts/durability.py
          git add src/hl_observer/alerts/spine.py src/hl_observer/alerts/durability.py
          git diff --cached --check
          git config user.name "alina-smartflow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: extract alert spine durability"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA" || { echo "PARENT_MISMATCH_ABORT"; exit 1; }
          git push origin HEAD:main