name: publish-restore-inventory

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_restore_inventory.py"
      - "tools/restore_alina.py"
      - ".github/workflows/publish-restore-inventory.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: publish-restore-inventory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Checkout canonical recovery tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build complete immutable Release inventory
        run: |
          set -euo pipefail
          python -m py_compile tools/build_restore_inventory.py tools/restore_alina.py
          python tools/build_restore_inventory.py \
            --repository "$GITHUB_REPOSITORY" \
            --output RESTORE_INVENTORY.json.gz

      - name: Publish inventory as a canonical control Release
        run: |
          set -euo pipefail
          TAG="alina-restore-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" RESTORE_INVENTORY.json.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Alina complete restore inventory ${GITHUB_RUN_ID}" \
            --notes "GitHub-hosted byte inventory spanning the REST 1000-Release cap. No trading or collection process is modified." \
            --latest=false
