name: recover-durable-publication

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-durable-publication
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: "${{ github.token }}"
      PYTHONPATH: src
      ALINA_RECOVERY_CAPSULE: "0"
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate recovery code
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . pytest
          python -m pytest -q tests/test_restore_alina.py tests/test_publish_dataset_v2_release.py tests/test_recover_dataset_v2_capsules.py --tb=line

      - name: Resume exact failed publications from recovery capsules
        run: |
          set -euo pipefail
          python tools/recover_dataset_v2_capsules.py             --repository "${{ github.repository }}"             --limit 2
