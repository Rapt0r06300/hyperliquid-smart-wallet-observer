name: clone-payload-lfs-mirror

on:
  workflow_dispatch:
    inputs:
      confirm_lfs_costs:
        description: "I accept that Git LFS storage/bandwidth may be billable"
        required: true
        type: boolean
        default: false
      max_assets:
        description: "Maximum Release assets mirrored in this run"
        required: false
        default: "500"
        type: string
      max_bytes:
        description: "Maximum source bytes mirrored in this run"
        required: false
        default: "734003200"
        type: string
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: write

concurrency:
  group: clone-payload-lfs-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || vars.ALINA_LFS_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: "${{ github.token }}"
      GIT_LFS_SKIP_SMUDGE: "1"
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Require explicit LFS cost authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.confirm_lfs_costs }}" != "true" ]; then
            echo "Refusing LFS migration without explicit cost authorization." >&2
            exit 64
          fi

      - name: Checkout canonical main without downloading old LFS payloads
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prepare Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          test "$(git check-attr filter -- clone_payload/placeholder.bin | awk '{print $3}')" = "lfs"

      - name: Mirror bounded Release assets into clone payload
        shell: bash
        run: |
          set -euo pipefail
          MAX_ASSETS="${{ inputs.max_assets || '500' }}"
          MAX_BYTES="${{ inputs.max_bytes || '734003200' }}"
          python tools/mirror_releases_to_clone_lfs.py             --repository "$GITHUB_REPOSITORY"             --root .             --max-assets "$MAX_ASSETS"             --max-bytes "$MAX_BYTES"             --confirm-lfs-costs             | tee "$RUNNER_TEMP/clone-lfs-report.json"

      - name: Stage and prove every payload blob is an LFS pointer
        shell: bash
        run: |
          set -euo pipefail
          git add .gitattributes clone_payload
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(
              ["git","diff","--cached","--name-only","--","clone_payload/releases"],
              text=True,
          ).splitlines()
          for path in paths:
              attr=subprocess.check_output(
                  ["git","check-attr","filter","--",path],
                  text=True,
              ).strip()
              if not attr.endswith(": lfs"):
                  raise SystemExit(f"payload path is not LFS tracked: {path}: {attr}")
              staged=subprocess.check_output(["git","show",f":{path}"])
              if not staged.startswith(b"version https://git-lfs.github.com/spec/v1\n"):
                  raise SystemExit(f"staged payload is not an LFS pointer: {path}")
          print(f"verified_lfs_pointer_paths={len(paths)}")
          PY

      - name: Commit and push canonical clone payload
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Clone payload already caught up."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "data(lfs): mirror immutable Release assets into clone payload"
          gh auth setup-git
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            [ "$attempt" -lt 8 ] || exit 1
            sleep $((attempt * 10))
          done
