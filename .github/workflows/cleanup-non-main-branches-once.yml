name: cleanup-non-main-branches-once

on:
  push:
    paths:
      - ".github/workflows/cleanup-non-main-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main branch
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const victims = branches.map(b => b.name).filter(name => name !== 'main');
            core.info(`Non-main branches before cleanup: ${victims.join(', ') || '(none)'}`);
            for (const name of victims) {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
              core.info(`Deleted branch: ${name}`);
            }
            const after = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const remaining = after.map(b => b.name).filter(name => name !== 'main');
            if (remaining.length) {
              core.setFailed(`Non-main branches remain: ${remaining.join(', ')}`);
            } else {
              core.info('Branch invariant satisfied: main only.');
            }
