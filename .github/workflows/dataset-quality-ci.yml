name: dataset-quality-ci

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dataset-quality-ci.yml'
      - 'tools/**'
      - 'tests/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: dataset-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile dataset tools
        run: python -m py_compile tools/*.py
      - name: Validate dataset policy
        run: python tools/check_dataset_quality.py
      - name: Run all dataset tests
        run: python -m pytest -q tests