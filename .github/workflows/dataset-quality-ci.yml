name: dataset-quality-ci

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dataset-quality-ci.yml'
      - 'tools/**'
      - 'tests/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: dataset-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile dataset tools
        run: python -m py_compile tools/*.py
      - name: Validate dataset policy
        run: python tools/check_dataset_quality.py
      - name: Run Dataset V2-format control-plane tests
        run: |
          python -m pytest -q \
            tests/test_analysis_closure_dispatch_order.py \
            tests/test_analysis_frozen_coverage.py \
            tests/test_analysis_selection_freeze.py \
            tests/test_analysis_stage_gates.py \
            tests/test_augment_campaign_result.py \
            tests/test_campaign_creation_workflow_integrity.py \
            tests/test_campaign_manifest_json.py \
            tests/test_campaign_resilience_receipt.py \
            tests/test_campaign_watchdog_drain.py \
            tests/test_current_scoreboard_closure.py \
            tests/test_dataset_metrics.py \
            tests/test_dataset_policy.py \
            tests/test_exact_trade_count_backfill.py \
            tests/test_finalize_analysis_drain.py \
            tests/test_freeze_market_shards.py \
            tests/test_global_closure_resume_contract.py \
            tests/test_global_unique_trade_backfill.py \
            tests/test_manifest_policy.py \
            tests/test_persist_analysis_scoreboard.py \
            tests/test_publication_failure_boundaries.py \
            tests/test_refresh_pending_collect_campaign.py \
            tests/test_release_manifest_download.py \
            tests/test_replay_compatibility.py \
            tests/test_requeue_failed_analysis_campaign.py \
            tests/test_run_indexing.py \
            tests/test_workflow_bounds.py