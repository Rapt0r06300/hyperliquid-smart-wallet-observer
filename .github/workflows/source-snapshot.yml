name: source-snapshot-for-coverage-closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-snapshot.yml'
      - 'control/source_snapshot.trigger'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Publier le snapshot en cours
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"hypersmart/source-snapshot\",\"description\":\"Export source en cours\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-snapshot-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            src
            tests
            tools
            pyproject.toml
            requirements*.txt
            .github/workflows
      - name: Publier le snapshot disponible
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          DESCRIPTION="Export source en échec"
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE=success
            DESCRIPTION="Export source disponible"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"hypersmart/source-snapshot\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
