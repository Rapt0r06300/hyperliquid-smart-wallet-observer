name: global-implementation-closure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/DATA_INDEX.json"
      - "catalog/DATA_METRICS.json"
      - "control/alina-phase.json"
      - "control/phase-receipts/**"
      - "catalog/CAMPAIGN_RESILIENCE_RECEIPT.json"
      - "catalog/campaigns/**"
      - "catalog/DATASET_HEALTH_RECEIPT.json"
      - "catalog/ANALYSIS_FROZEN_COVERAGE_RECEIPT.json"
      - "catalog/CAMPAIGN_WATCHDOG_RECEIPT.json"
      - "tools/build_global_implementation_closure.py"
      - "tools/build_analysis_frozen_coverage_receipt.py"
      - "tools/phase_gate.py"
      - "tools/verify_global_closure_phase.py"
      - "tools/summarize_global_closure_run.py"
      - ".github/workflows/global-implementation-closure.yml"
  schedule:
    - cron: '47 */6 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: global-implementation-closure
  cancel-in-progress: true
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - id: phase
        name: Read canonical phase
        shell: bash
        run: |
          set -euo pipefail
          STATE_JSON="$(python tools/phase_gate.py read --state control/alina-phase.json)"
          export STATE_JSON
          python - <<'PY'
          import json
          import os

          state = json.loads(os.environ["STATE_JSON"])
          fields = {
              "phase": state["phase"],
              "stage": state.get("analysis_stage") or "",
              "epoch": str(state["epoch"]),
              "source_collection_epoch": str(state.get("source_collection_epoch") or ""),
              "cutoff": state.get("collection_cutoff_at_utc") or "",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in fields.items():
                  output.write(f"{key}={value}\n")
          print(
              "phase={phase} stage={stage} epoch={epoch} "
              "source_collection_epoch={source_collection_epoch} cutoff={cutoff}".format(
                  **fields
              )
          )
          PY

      - id: build_closure
        name: Build fail-closed global closure receipt
        if: steps.phase.outputs.phase == 'ANALYZE' && steps.phase.outputs.stage != 'DRAIN' && steps.phase.outputs.stage != 'QUALITY' && steps.phase.outputs.stage != 'REPLAY'
        env:
          ALINA_EXPECTED_PHASE: ${{ steps.phase.outputs.phase }}
          ALINA_EXPECTED_STAGE: ${{ steps.phase.outputs.stage }}
          ALINA_EXPECTED_EPOCH: ${{ steps.phase.outputs.epoch }}
          ALINA_EXPECTED_SOURCE_COLLECTION_EPOCH: ${{ steps.phase.outputs.source_collection_epoch }}
          ALINA_EXPECTED_CUTOFF: ${{ steps.phase.outputs.cutoff }}
        run: |
          set -euo pipefail
          python tools/verify_global_closure_phase.py \
            --state control/alina-phase.json \
            --phase "$ALINA_EXPECTED_PHASE" \
            --stage "$ALINA_EXPECTED_STAGE" \
            --epoch "$ALINA_EXPECTED_EPOCH" \
            --source-collection-epoch "$ALINA_EXPECTED_SOURCE_COLLECTION_EPOCH" \
            --cutoff "$ALINA_EXPECTED_CUTOFF"
          python tools/build_analysis_frozen_coverage_receipt.py
          python tools/build_global_implementation_closure.py --alina-root .

      - id: publish_closure
        name: Publish closure receipt from latest canonical head
        if: steps.phase.outputs.phase == 'ANALYZE' && steps.phase.outputs.stage != 'DRAIN' && steps.phase.outputs.stage != 'QUALITY' && steps.phase.outputs.stage != 'REPLAY'
        env:
          ALINA_EXPECTED_PHASE: ${{ steps.phase.outputs.phase }}
          ALINA_EXPECTED_STAGE: ${{ steps.phase.outputs.stage }}
          ALINA_EXPECTED_EPOCH: ${{ steps.phase.outputs.epoch }}
          ALINA_EXPECTED_SOURCE_COLLECTION_EPOCH: ${{ steps.phase.outputs.source_collection_epoch }}
          ALINA_EXPECTED_CUTOFF: ${{ steps.phase.outputs.cutoff }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tools/verify_global_closure_phase.py \
              --state control/alina-phase.json \
              --phase "$ALINA_EXPECTED_PHASE" \
              --stage "$ALINA_EXPECTED_STAGE" \
              --epoch "$ALINA_EXPECTED_EPOCH" \
              --source-collection-epoch "$ALINA_EXPECTED_SOURCE_COLLECTION_EPOCH" \
              --cutoff "$ALINA_EXPECTED_CUTOFF"
            python tools/build_analysis_frozen_coverage_receipt.py
            python tools/build_global_implementation_closure.py --alina-root .
            python tools/verify_global_closure_phase.py \
              --state control/alina-phase.json \
              --phase "$ALINA_EXPECTED_PHASE" \
              --stage "$ALINA_EXPECTED_STAGE" \
              --epoch "$ALINA_EXPECTED_EPOCH" \
              --source-collection-epoch "$ALINA_EXPECTED_SOURCE_COLLECTION_EPOCH" \
              --cutoff "$ALINA_EXPECTED_CUTOFF"
            git add catalog/ANALYSIS_FROZEN_COVERAGE_RECEIPT.json catalog/GLOBAL_IMPLEMENTATION_CLOSURE.json
            if git diff --cached --quiet; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Closure receipts are already current; this run did not publish a new receipt."
              exit 0
            fi
            git commit -m "closure: publish single-repository implementation receipt"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git reset --hard origin/main
            sleep "$((attempt * 2))"
          done
          exit 1

      - id: dispatch_analysis
        name: Dispatch analysis stage controller after closure
        if: steps.phase.outputs.phase == 'ANALYZE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            set +e
            output="$(gh workflow run analysis-stage-controller.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            printf '%s\n' "$output" >&2
            if printf '%s' "$output" | grep -Eqi 'rate limit|HTTP 403|secondary rate|temporar|timeout|502|503|504'; then
              if [ "$attempt" -lt 6 ]; then
                delay="$((5 * attempt * attempt))"
                [ "$delay" -le 60 ] || delay=60
                sleep "$delay"
                continue
              fi
              echo "::warning::Immediate analysis-stage dispatch deferred; the 10-minute scheduled controller is the durable fallback."
              exit 0
            fi
            exit "$rc"
          done

      - id: summarize_run
        name: Summarize closure evidence status
        if: always()
        shell: bash
        env:
          ALINA_PHASE: ${{ steps.phase.outputs.phase }}
          ALINA_STAGE: ${{ steps.phase.outputs.stage }}
          ALINA_EPOCH: ${{ steps.phase.outputs.epoch }}
          ALINA_SOURCE_COLLECTION_EPOCH: ${{ steps.phase.outputs.source_collection_epoch }}
          ALINA_COLLECTION_CUTOFF_UTC: ${{ steps.phase.outputs.cutoff }}
          ALINA_JOB_OUTCOME: ${{ job.status }}
          ALINA_BUILD_OUTCOME: ${{ steps.build_closure.outcome }}
          ALINA_PUBLISH_OUTCOME: ${{ steps.publish_closure.outcome }}
          ALINA_PUBLISH_CHANGED: ${{ steps.publish_closure.outputs.published }}
          ALINA_DISPATCH_OUTCOME: ${{ steps.dispatch_analysis.outcome }}
        run: python tools/summarize_global_closure_run.py
