name: Trigger canonical spec hardening
on:
  push:
    paths:
      - '.github/workflows/trigger-spec-hardening.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply embedded addendum and clean one-shot workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/one-shot-spec-hardening.yml').read_text(encoding='utf-8')
          start="          add = r'''"
          a=src.index(start)+len(start)
          b=src.index("\n'''", a)
          add=src[a:b]
          p=Path('docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md')
          t=p.read_text(encoding='utf-8')
          marker='## Normative closure hardening — final consolidated contracts (2026-09-27)'
          if marker not in t:
              t=t.rstrip()+add+'\n'
              p.write_text(t, encoding='utf-8')
          assert p.read_text(encoding='utf-8').count(marker)==1
          PY
          git rm .github/workflows/one-shot-spec-hardening.yml .github/workflows/trigger-spec-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/specs/2026-09-25-manual-phase-orchestrator-design.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'docs(spec): harden canonical Work closure contracts'
          git push origin HEAD:main
