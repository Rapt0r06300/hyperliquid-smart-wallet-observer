name: backfill-exact-trade-counts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-exact-trade-counts.yml'
      - 'tools/backfill_exact_trade_counts.py'
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum legacy trade shards to verify in this run"
        required: false
        default: "2000"

permissions:
  contents: write

# Shared mutation lane prevents stale DATA_INDEX/DATA_METRICS writers.
concurrency:
  group: dataset-v2-control-plane-index
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main before processing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Scan immutable release assets exactly
        shell: bash
        run: |
          set -euo pipefail
          LIMIT="${{ inputs.limit || '2000' }}"
          python tools/backfill_exact_trade_counts.py --limit "$LIMIT"
          python tools/build_catalog_metrics.py
          python tools/check_dataset_quality.py

      - name: Publish exact-count progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/DATA_INDEX.json catalog/DATA_METRICS.json catalog/TRADE_COUNT_PATCH.json datasets
          git diff --cached --quiet && exit 0
          git commit -m "data: backfill verified exact trade counts"
          if git push origin HEAD:main; then
            exit 0
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
