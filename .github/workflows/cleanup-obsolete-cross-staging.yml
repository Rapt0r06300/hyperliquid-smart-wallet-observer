name: cleanup-obsolete-cross-staging

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-obsolete-staging-ref:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supprimer uniquement la branche staging obsolète
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_REF="heads/__do_not_use_cross_staging__"
          test "${TARGET_REF}" = "heads/__do_not_use_cross_staging__"
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/${TARGET_REF}"
