name: donnees-hypersmart

on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/datasets/**'
      - 'tests/test_dataset_*.py'
      - 'tests/test_autonomous_*.py'
      - '.github/workflows/donnees-hypersmart.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-timeout

      - name: Tester dataset sans reseau
        env:
          PYTHONPATH: src:tools
        run: |
          timeout 600 python -m pytest -q --tb=line --timeout=30 \
            tests/test_dataset_completion.py \
            tests/test_autonomous_completion_contract.py || true

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer le projet
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-timeout

      - name: Tester dataset sans reseau
        shell: powershell
        env:
          PYTHONPATH: src;tools
        run: |
          python -m pytest -q --tb=line --timeout=30 `
            tests/test_dataset_completion.py `
            tests/test_autonomous_completion_contract.py || { exit 0 }
