name: donnees-hypersmart

on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/datasets/**'
      - 'src/hl_observer/ops/dataset_*.py'
      - 'tools/run_economic_objective_campaigns.py'
      - 'tools/run_dataset_economic_campaigns.py'
      - 'tests/test_dataset_*.py'
      - 'PREPARER_DONNEES_HYPERSMART.cmd'
      - 'PREPARER_EXPERIENCE_FULL_COLD.cmd'
      - 'ANALYSER_DONNEES_HYPERSMART.cmd'
      - 'LANCER_REPLAY_176GO.cmd'
      - 'LANCER_LABO_180GO.cmd'
      - 'docs/DONNEES_HYPERSMART_176G.md'
      - 'docs/DATASET_RESEARCH_PIPELINE.md'
      - 'docs/DATASET_EXPERIMENT_PLANS.md'
      - '.github/workflows/donnees-hypersmart.yml'
  workflow_dispatch: {}

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le projet
        run: |
          pip install -e .
          pip install pytest
      - name: Tester tout le pont de donnees sans reseau
        run: |
          pytest -q \
            tests/test_dataset_release_bridge.py \
            tests/test_dataset_release_gateway.py \
            tests/test_dataset_catalog_profiler.py \
            tests/test_dataset_replay_workspace.py \
            tests/test_dataset_economic_preset.py \
            tests/test_dataset_progress_downloader.py \
            tests/test_dataset_result_export.py \
            tests/test_dataset_launchers.py \
            tests/test_dataset_archive_library.py \
            tests/test_dataset_lab_launcher.py \
            tests/test_dataset_source_discovery.py \
            tests/test_dataset_research_runner.py \
            tests/test_dataset_economic_source_wiring.py \
            tests/test_dataset_economic_multi_source.py \
            tests/test_dataset_economic_runner_wrapper.py \
            tests/test_dataset_sqlite_profiler.py \
            tests/test_dataset_sqlite_inventory.py \
            tests/test_dataset_sqlite_research_source.py \
            tests/test_dataset_sqlite_research.py \
            tests/test_dataset_research_lab_stream.py \
            tests/test_dataset_research_lab_gzip_progress.py \
            tests/test_dataset_research_inventory.py \
            tests/test_dataset_connection_audit.py \
            tests/test_dataset_connection_audit_cli.py \
            tests/test_dataset_research_lab_selector.py \
            tests/test_dataset_research_select.py \
            tests/test_dataset_experiment_plan.py \
            tests/test_dataset_experiment_plan_cli.py \
            tests/test_dataset_experiment_contract.py \
            tests/test_dataset_experiment_contract_cli.py \
            tests/test_dataset_experiment_launcher.py \
            tests/test_dataset_ci_coverage.py

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le projet
        shell: powershell
        run: |
          pip install -e .
          pip install pytest
      - name: Tester tout le pont de donnees sans reseau
        shell: powershell
        run: |
          pytest -q `
            tests/test_dataset_release_bridge.py `
            tests/test_dataset_release_gateway.py `
            tests/test_dataset_catalog_profiler.py `
            tests/test_dataset_replay_workspace.py `
            tests/test_dataset_economic_preset.py `
            tests/test_dataset_progress_downloader.py `
            tests/test_dataset_result_export.py `
            tests/test_dataset_launchers.py `
            tests/test_dataset_archive_library.py `
            tests/test_dataset_lab_launcher.py `
            tests/test_dataset_source_discovery.py `
            tests/test_dataset_research_runner.py `
            tests/test_dataset_economic_source_wiring.py `
            tests/test_dataset_economic_multi_source.py `
            tests/test_dataset_economic_runner_wrapper.py `
            tests/test_dataset_sqlite_profiler.py `
            tests/test_dataset_sqlite_inventory.py `
            tests/test_dataset_sqlite_research_source.py `
            tests/test_dataset_sqlite_research.py `
            tests/test_dataset_research_lab_stream.py `
            tests/test_dataset_research_lab_gzip_progress.py `
            tests/test_dataset_research_inventory.py `
            tests/test_dataset_connection_audit.py `
            tests/test_dataset_connection_audit_cli.py `
            tests/test_dataset_research_lab_selector.py `
            tests/test_dataset_research_select.py `
            tests/test_dataset_experiment_plan.py `
            tests/test_dataset_experiment_plan_cli.py `
            tests/test_dataset_experiment_contract.py `
            tests/test_dataset_experiment_contract_cli.py `
            tests/test_dataset_experiment_launcher.py `
            tests/test_dataset_ci_coverage.py
