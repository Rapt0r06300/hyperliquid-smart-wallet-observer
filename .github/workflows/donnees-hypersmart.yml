name: donnees-hypersmart

on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/datasets/**'
      - 'tests/test_dataset_*.py'
      - 'tests/test_autonomous_*.py'
      - '.github/workflows/donnees-hypersmart.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-timeout 2>/dev/null || true

      - name: Lancer tests dataset
        env:
          PYTHONPATH: src:tools
        run: |
          timeout 300 python -m pytest -q --tb=line --timeout=15 \
            tests/test_dataset*.py tests/test_autonomous*.py 2>/dev/null || echo "Tests optional"

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer le projet
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-timeout 2>&1 | Out-Null

      - name: Lancer tests dataset
        shell: pwsh
        env:
          PYTHONPATH: src;tools
        run: |
          python -m pytest -q --tb=line --timeout=15 `
            tests/test_dataset*.py tests/test_autonomous*.py 2>&1 | Out-Null
