name: donnees-hypersmart

on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/datasets/**'
      - 'tests/test_dataset_*.py'
      - 'tests/test_autonomous_*.py'
      - 'PREPARER_EXPERIENCE_FULL_COLD.cmd'
      - 'LANCER_LABO_180GO.cmd'
      - 'ANALYSER_DONNEES_HYPERSMART.cmd'
      - '.github/workflows/donnees-hypersmart.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer le projet
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-timeout

      - name: Lancer tests dataset
        env:
          PYTHONPATH: src:tools
        run: |
          mapfile -t DATASET_TESTS < <(find tests -maxdepth 1 -type f -name 'test_dataset_*.py' | sort)
          if [ "${#DATASET_TESTS[@]}" -eq 0 ]; then
            echo "Aucun test dataset découvert sur Linux"
            exit 1
          fi
          timeout 300 python -m pytest -q "${DATASET_TESTS[@]}" --tb=line --timeout=15

          mapfile -t AUTONOMOUS_TESTS < <(find tests -maxdepth 1 -type f -name 'test_autonomous_*.py' | sort)
          if [ "${#AUTONOMOUS_TESTS[@]}" -gt 0 ]; then
            timeout 300 python -m pytest -q "${AUTONOMOUS_TESTS[@]}" --tb=line --timeout=15
          fi

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer le projet
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-timeout

      - name: Lancer tests dataset
        shell: pwsh
        env:
          PYTHONPATH: src;tools
        run: |
          $datasetTests = @(Get-ChildItem -LiteralPath tests -Filter 'test_dataset_*.py' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
          if ($datasetTests.Count -eq 0) {
            Write-Error "Aucun test dataset découvert sur Windows"
            exit 1
          }
          python -m pytest -q @datasetTests --tb=line --timeout=15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $autonomousTests = @(Get-ChildItem -LiteralPath tests -Filter 'test_autonomous_*.py' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
          if ($autonomousTests.Count -gt 0) {
            python -m pytest -q @autonomousTests --tb=line --timeout=15
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
