name: donnees-hypersmart

on:
  push:
    branches: [main]
    paths:
      - 'src/hl_observer/datasets/**'
      - 'src/hl_observer/ops/dataset_*.py'
      - 'src/hl_observer/ops/autonomous_research_job.py'
      - 'src/hl_observer/ops/autonomous_research_guard.py'
      - 'src/hl_observer/ops/autonomous_research_brain.py'
      - 'src/hl_observer/ops/autonomous_research_status.py'
      - 'src/hl_observer/ops/self_hosted_control.py'
      - 'src/hl_observer/ops/self_hosted_return.py'
      - 'src/hl_observer/backtesting/recherche_adaptative_stricte.py'
      - 'tools/alina_autonomous_lab.py'
      - 'tools/run_economic_objective_campaigns.py'
      - 'tools/run_dataset_economic_campaigns.py'
      - 'tools/run_strict_adaptive_research.py'
      - 'tools/ALINA_RESEARCH_COCKPIT.ps1'
      - 'tools/INSTALLER_ALINA_RUNNER_WINDOWS.ps1'
      - 'tools/VERIFIER_ALINA_RUNNER_WINDOWS.ps1'
      - 'tests/test_dataset_*.py'
      - 'tests/test_recherche_adaptative_stricte.py'
      - 'tests/test_alina_self_hosted_*.py'
      - 'PREPARER_DONNEES_HYPERSMART.cmd'
      - 'PREPARER_EXPERIENCE_FULL_COLD.cmd'
      - 'ANALYSER_DONNEES_HYPERSMART.cmd'
      - 'LANCER_REPLAY_176GO.cmd'
      - 'LANCER_LABO_180GO.cmd'
      - 'LANCER_COCKPIT_ALINA.cmd'
      - 'INSTALLER_ALINA_RUNNER_WINDOWS.cmd'
      - 'PREPARER_PC_ALINA.cmd'
      - 'control/alina_jobs/**'
      - 'docs/DONNEES_HYPERSMART_176G.md'
      - 'docs/DATASET_RESEARCH_PIPELINE.md'
      - 'docs/DATASET_EXPERIMENT_PLANS.md'
      - 'docs/DATASET_EXPERIMENT_VERIFICATION.md'
      - 'docs/ALINA_SELF_HOSTED_RUNNER.md'
      - '.github/workflows/alina-self-hosted.yml'
      - '.github/workflows/donnees-hypersmart.yml'
  workflow_dispatch: {}

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le projet
        run: |
          pip install -e .
          pip install pytest
      - name: Tester tout le pont de donnees sans reseau
        run: |
          pytest -q \
            tests/test_dataset_release_bridge.py \
            tests/test_dataset_release_gateway.py \
            tests/test_dataset_catalog_profiler.py \
            tests/test_dataset_replay_workspace.py \
            tests/test_dataset_economic_preset.py \
            tests/test_dataset_progress_downloader.py \
            tests/test_dataset_result_export.py \
            tests/test_dataset_launchers.py \
            tests/test_dataset_archive_library.py \
            tests/test_dataset_lab_launcher.py \
            tests/test_dataset_source_discovery.py \
            tests/test_dataset_research_runner.py \
            tests/test_dataset_economic_source_wiring.py \
            tests/test_dataset_economic_multi_source.py \
            tests/test_dataset_economic_runner_wrapper.py \
            tests/test_dataset_sqlite_profiler.py \
            tests/test_dataset_sqlite_inventory.py \
            tests/test_dataset_sqlite_research_source.py \
            tests/test_dataset_sqlite_research.py \
            tests/test_dataset_research_lab_stream.py \
            tests/test_dataset_research_lab_gzip_progress.py \
            tests/test_dataset_research_inventory.py \
            tests/test_dataset_connection_audit.py \
            tests/test_dataset_connection_audit_cli.py \
            tests/test_dataset_research_lab_selector.py \
            tests/test_dataset_research_select.py \
            tests/test_dataset_experiment_plan.py \
            tests/test_dataset_experiment_plan_cli.py \
            tests/test_dataset_experiment_contract.py \
            tests/test_dataset_experiment_contract_cli.py \
            tests/test_dataset_experiment_contract_verifier.py \
            tests/test_dataset_experiment_contract_verify_cli.py \
            tests/test_dataset_experiment_pipeline.py \
            tests/test_dataset_experiment_launcher.py \
            tests/test_dataset_autonomous_research_job.py \
            tests/test_dataset_autonomous_research_guard.py \
            tests/test_dataset_autonomous_research_brain.py \
            tests/test_dataset_autonomous_research_status.py \
            tests/test_dataset_cli_entrypoints.py \
            tests/test_recherche_adaptative_stricte.py \
            tests/test_dataset_ci_coverage.py \
            tests/test_alina_self_hosted_control.py \
            tests/test_alina_self_hosted_assets.py \
            tests/test_alina_self_hosted_entrypoint.py \
            tests/test_alina_self_hosted_return.py

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le projet
        shell: powershell
        run: |
          pip install -e .
          pip install pytest
      - name: Tester tout le pont de donnees sans reseau
        shell: powershell
        run: |
          pytest -q `
            tests/test_dataset_release_bridge.py `
            tests/test_dataset_release_gateway.py `
            tests/test_dataset_catalog_profiler.py `
            tests/test_dataset_replay_workspace.py `
            tests/test_dataset_economic_preset.py `
            tests/test_dataset_progress_downloader.py `
            tests/test_dataset_result_export.py `
            tests/test_dataset_launchers.py `
            tests/test_dataset_archive_library.py `
            tests/test_dataset_lab_launcher.py `
            tests/test_dataset_source_discovery.py `
            tests/test_dataset_research_runner.py `
            tests/test_dataset_economic_source_wiring.py `
            tests/test_dataset_economic_multi_source.py `
            tests/test_dataset_economic_runner_wrapper.py `
            tests/test_dataset_sqlite_profiler.py `
            tests/test_dataset_sqlite_inventory.py `
            tests/test_dataset_sqlite_research_source.py `
            tests/test_dataset_sqlite_research.py `
            tests/test_dataset_research_lab_stream.py `
            tests/test_dataset_research_lab_gzip_progress.py `
            tests/test_dataset_research_inventory.py `
            tests/test_dataset_connection_audit.py `
            tests/test_dataset_connection_audit_cli.py `
            tests/test_dataset_research_lab_selector.py `
            tests/test_dataset_research_select.py `
            tests/test_dataset_experiment_plan.py `
            tests/test_dataset_experiment_plan_cli.py `
            tests/test_dataset_experiment_contract.py `
            tests/test_dataset_experiment_contract_cli.py `
            tests/test_dataset_experiment_contract_verifier.py `
            tests/test_dataset_experiment_contract_verify_cli.py `
            tests/test_dataset_experiment_pipeline.py `
            tests/test_dataset_experiment_launcher.py `
            tests/test_dataset_autonomous_research_job.py `
            tests/test_dataset_autonomous_research_guard.py `
            tests/test_dataset_autonomous_research_brain.py `
            tests/test_dataset_autonomous_research_status.py `
            tests/test_dataset_cli_entrypoints.py `
            tests/test_recherche_adaptative_stricte.py `
            tests/test_dataset_ci_coverage.py `
            tests/test_alina_self_hosted_control.py `
            tests/test_alina_self_hosted_assets.py `
            tests/test_alina_self_hosted_entrypoint.py `
            tests/test_alina_self_hosted_return.py
      - name: Vérifier les scripts publics avec Windows PowerShell 5.1
        shell: powershell
        run: |
          $paths = @(
            '.\tools\ALINA_RESEARCH_COCKPIT.ps1',
            '.\tools\INSTALLER_ALINA_RUNNER_WINDOWS.ps1',
            '.\tools\VERIFIER_ALINA_RUNNER_WINDOWS.ps1'
          )
          foreach ($rawPath in $paths) {
            $path = Resolve-Path $rawPath
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "Script PowerShell 5.1 invalide: $rawPath"
            }
            $text = Get-Content $path -Raw -Encoding UTF8
            if ($text.Contains('??')) { throw "Syntaxe PowerShell 7 interdite: $rawPath" }
          }
          $cockpit = Get-Content '.\tools\ALINA_RESEARCH_COCKPIT.ps1' -Raw -Encoding UTF8
          foreach ($needle in @('CURRENT_STATUS.json','GITHUB_SYNC_STATUS.json','CALCUL','GitHub','Rapports','Gros logs','prochaine analyse','Start-Sleep -Seconds $RefreshSeconds','BLOQU')) {
            if (-not $cockpit.Contains($needle)) { throw "Cockpit public incomplet: $needle" }
          }
          $installer = Get-Content '.\tools\INSTALLER_ALINA_RUNNER_WINDOWS.ps1' -Raw -Encoding UTF8
          foreach ($needle in @('--runasservice','hypersmart,alina','registration-token','ALINA_RESEARCH_HOME','ZeroFreeBSTR','sc.exe failure')) {
            if (-not $installer.Contains($needle)) { throw "Installateur runner incomplet: $needle" }
          }
          Write-Host 'Scripts publics PowerShell 5.1: OK'
