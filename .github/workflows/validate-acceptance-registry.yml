name: validate-acceptance-registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/acceptance_criteria.yaml"
      - "tools/validate_acceptance_registry.py"
      - ".github/workflows/validate-acceptance-registry.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "PyYAML==6.0.2"
      - run: python tools/validate_acceptance_registry.py
