name: Alina Git Code Sync safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alina-git-code-sync-tests.yml'
      - 'POUSSER-GITHUB-FORCE.cmd'
      - 'tools/push_github_safe.ps1'
      - 'tools/alina_git_code_sync.py'
      - 'tests/test_alina_git_code_sync.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alina-git-sync-tests-${{ github.ref }}
  # This workflow is read-only and SHA-bound.  A newer push supersedes an
  # older queued validation instead of making every local retry wait behind
  # obsolete sync checks.
  cancel-in-progress: true

jobs:
  no-loss-sync-contracts:
    name: Code-only sync, disposable remotes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pin the Linux image so an image migration cannot silently change the
        # disposable-Git contract while the Windows parity job remains stable.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      GIT_LFS_SKIP_SMUDGE: "1"
      HL_ENABLE_MAINNET_EXECUTION: "0"
      HL_ENABLE_TESTNET_EXECUTION: "0"
      REAL_MAINNET_TRADING: "false"
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            POUSSER-GITHUB-FORCE.cmd
            tools
            tests/test_alina_git_code_sync.py
          sparse-checkout-cone-mode: false
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install offline-test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax and deterministic disposable-Git tests
        run: |
          python -m py_compile tools/alina_git_code_sync.py
          python -m pytest -q tests/test_alina_git_code_sync.py --tb=short
      - name: Windows .cmd launcher portable self-check
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          set HYPERSMART_PUSH_NO_PAUSE=1
          call POUSSER-GITHUB-FORCE.cmd --portable-self-check
