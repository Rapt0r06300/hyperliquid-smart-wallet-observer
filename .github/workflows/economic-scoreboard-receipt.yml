name: economic-scoreboard-receipt
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install read-only runtime
        run: python -m pip install --disable-pip-version-check -e .
      - name: Export honest family scoreboards
        run: python tools/export_economic_family_scoreboards.py
      - name: Persist scoreboard receipt
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/reports/economic_family_scoreboards.json
          git diff --cached --quiet && exit 0
          git commit -m "scoreboard: persist economic family receipt"
          git push origin HEAD:main
