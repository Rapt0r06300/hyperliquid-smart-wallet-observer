name: backfill-replay-compatibility
on:
  workflow_run:
    workflows: [backfill-exact-trade-counts, backfill-global-unique-trade-counts]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/backfill_replay_compatibility.py'
      - 'tools/enforce_safe_replay_invariant.py'
      - 'tools/replay_compatibility.py'
      - 'tools/build_replay_compatibility_reasons.py'
      - 'tools/index_run_manifest.py'
      - 'tests/test_manifest_policy.py'
      - 'tests/test_replay_compatibility.py'
      - 'tests/test_backfill_replay_compatibility_candidates.py'
      - '.github/workflows/backfill-replay-compatibility.yml'
  schedule:
    - cron: '12,32,52 * * * *'
  workflow_dispatch:
    inputs:
      per_family_limit:
        description: "Maximum verified assets per priority family group"
        required: false
        default: "36"

permissions:
  contents: write

concurrency:
  # Keep replay proof running even when historical catalog reconciliation is
  # continually relaunching. Writes remain SHA-verified and the push fails on
  # semantic conflict rather than merging potentially inconsistent SAFE rows.
  group: dataset-v2-replay-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main before processing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate replay verifier before catalog mutation
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q \
            tests/test_replay_compatibility.py \
            tests/test_backfill_replay_compatibility_candidates.py \
            tests/test_manifest_policy.py --tb=line

      - name: Enforce SAFE implies replay-compatible
        run: python tools/enforce_safe_replay_invariant.py

      - name: Test replay qualification rules
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q \
            tests/test_manifest_policy.py \
            tests/test_replay_compatibility.py \
            tests/test_backfill_replay_compatibility_candidates.py

      - name: Verify immutable assets for replay
        shell: bash
        run: |
          set -euo pipefail
          LIMIT="${{ inputs.per_family_limit || '36' }}"
          # Small resumable waves leave hosted compute free for live catalogue
          # reconciliation while proving each shard from its immutable Release.
          # Trades first: close the multi-million-row replay gap incrementally.
          python tools/backfill_replay_compatibility.py             --limit "$LIMIT"             --families "trades,agg_trades,fills,userfills,user_fills"
          python tools/backfill_replay_compatibility.py             --limit "$LIMIT"             --families "copy_vault_fills,copy_vault_l2,copy_vault_positions,copy_vault_selection,copy_vault_snapshot"
          python tools/backfill_replay_compatibility.py             --limit "$LIMIT"             --families "bbo"
          python tools/backfill_replay_compatibility.py             --limit "$LIMIT"             --families "l2book,l2,book"
          # Secondary market context is strict replay-checked in a small, bounded batch.
          # Derived capacity stays PARTIAL until independent parent-L2 proof exists.
          python tools/backfill_replay_compatibility.py             --limit 18             --families "capacity_tape,ticker,mark_price,open_interest,funding,funding_settlement,instrument_metadata,activeassetctx"
          # Historical Cross-Venue observations: strict two-leg receipt, never parent L2/PnL proof.
          python tools/backfill_replay_compatibility.py             --limit 18             --families "cross_venue_capacity_tape"
          python tools/build_replay_compatibility_reasons.py
          python tools/build_catalog_metrics.py
          python tools/build_quarantine_audit.py
          python tools/check_dataset_quality.py

      - name: Publish replay-proof progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog datasets
          git diff --cached --quiet && exit 0
          git commit -m "data: backfill verified replay compatibility"
          # Concurrent collectors and control-plane writers can advance main
          # between a clean rebase and push. Retry with a bounded lease-safe loop.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Replay proof durably published at $(git rev-parse HEAD)"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              # Only a deterministic metrics-only conflict can be rebuilt.
              # Conflicts involving source/index/quality evidence fail closed.
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "catalog/DATA_METRICS.json" ]; then
                python tools/build_catalog_metrics.py
                python tools/build_quarantine_audit.py
                git add catalog/DATA_METRICS.json catalog/QUARANTINE_AUDIT.json catalog/QUARANTINE_CAUSES.json
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort || true
                  exit 1
                fi
              else
                printf 'Unresolved replay publish conflicts:\\n%s\\n' "${conflicts[*]}" >&2
                git rebase --abort || true
                exit 1
              fi
            fi
            echo "Concurrent main update; retrying replay publication ($attempt/5)."
            sleep $((attempt * 2))
          done
          echo "::error::Replay verification was not published after 5 bounded attempts"
          exit 1
