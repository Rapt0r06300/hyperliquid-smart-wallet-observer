name: backfill-replay-compatibility
on:
  workflow_run:
    workflows: [backfill-exact-trade-counts, backfill-global-unique-trade-counts]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/backfill_replay_compatibility.py'
      - 'tools/enforce_safe_replay_invariant.py'
      - 'tools/replay_compatibility.py'
      - 'tools/build_replay_compatibility_reasons.py'
      - 'tools/build_quarantine_audit.py'
      - 'tools/rebase_disjoint_catalog_publication.py'
      - 'tools/index_run_manifest.py'
      - 'tests/test_manifest_policy.py'
      - 'tests/test_replay_compatibility.py'
      - 'tests/test_backfill_replay_compatibility_candidates.py'
      - 'tests/test_replay_receipt_publish.py'
      - 'tests/test_quarantine_audit.py'
      - 'tests/test_rebase_disjoint_catalog_publication.py'
      - '.github/workflows/backfill-replay-compatibility.yml'
  schedule:
    - cron: '12,32,52 * * * *'
  workflow_dispatch:
    inputs:
      per_family_limit:
        description: "Maximum verified assets per priority family group"
        required: false
        default: "36"

permissions:
  contents: write

concurrency:
  # Replay qualification may publish verified catalog evidence. Never cancel
  # an active transaction on a code push; a newer pending run can follow.
  group: dataset-v2-replay-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Historical manifest recovery needs commit history; blob:none keeps
          # the checkout small and fetches only selected proof blobs on demand.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /pyproject.toml
            /README.md
            /catalog/*.json
            /catalog/data-index-parts/
            /catalog/quarantine-audit-parts/
            /datasets/quarantine/
            /datasets/rejected/
            # Historical SHA-bound non-SAFE manifests can live in sharded
            # quarantine receipts. Read them, but never hydrate the giant SAFE tree.
            /datasets/sharded/quarantine/
            /datasets/sharded/rejected/
            /src/
            /tests/
            /tools/
          persist-credentials: true

      - name: Sync latest main before processing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate replay verifier before catalog mutation
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q \
            tests/test_replay_compatibility.py \
            tests/test_backfill_replay_compatibility_candidates.py \
            tests/test_replay_receipt_publish.py \
            tests/test_manifest_policy.py --tb=line

      - name: Enforce SAFE implies replay-compatible
        run: python tools/enforce_safe_replay_invariant.py

      - name: Test replay qualification rules
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q \
            tests/test_manifest_policy.py \
            tests/test_replay_compatibility.py \
            tests/test_backfill_replay_compatibility_candidates.py

      - name: Verify immutable assets for replay
        shell: bash
        run: |
          set -euo pipefail
          LIMIT="${{ inputs.per_family_limit || '36' }}"
          # One SHA-bound scan and one compacted index rewrite instead of
          # seven full million-shard catalogue reloads per replay wave.
          # Retain every former family quota/order, including catch-all; a
          # shard is processed at most once in the grouped wave.
          RESULT="$(python tools/backfill_replay_compatibility.py \
            --group-quotas "${LIMIT}:trades,agg_trades,fills,userfills,user_fills;${LIMIT}:copy_vault_fills,copy_vault_l2,copy_vault_positions,copy_vault_selection,copy_vault_snapshot;${LIMIT}:bbo;${LIMIT}:l2book,l2,book;18:capacity_tape,ticker,mark_price,open_interest,funding,funding_settlement,instrument_metadata,activeassetctx;18:cross_venue_capacity_tape;${LIMIT}:*")"
          printf '%s\n' "$RESULT"
          if printf '%s\n' "$RESULT" | python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("no_change") is True else 1)'; then
            echo "REPLAY_WAVE_NOOP: no new verified candidates; global metrics unchanged."
            exit 0
          fi
          python tools/build_replay_compatibility_reasons.py
          python tools/build_catalog_metrics.py
          python tools/build_quarantine_audit.py
          python tools/check_dataset_quality.py --catalog-only

      - name: Publish replay-proof progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse catalog datasets
          git diff --cached --quiet && exit 0
          # Capture only NEW Release-verified SHA/size-bound results before the
          # first push. A competing writer must not force another large remote
          # download or an unsafe rebase of a generated catalog.
          RECEIPTS="$RUNNER_TEMP/alina-verified-replay-receipts.json"
          python tools/replay_receipt_publish.py capture "$RECEIPTS"
          git commit -m "data: backfill verified replay compatibility"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              echo "Replay proof durably published at $(git rev-parse HEAD)"
              exit 0
            fi
            git fetch origin main
            if python tools/rebase_disjoint_catalog_publication.py --remote origin/main \
                && git push origin HEAD:main; then
              echo "Replay proof safely rebased across campaign-only checkpoints"
              exit 0
            fi
            if [ "$attempt" -eq 8 ]; then
              break
            fi
            # Rebuild on the actual latest main, never git merge/rebase the
            # generated DATA_INDEX. Reapply only immutable receipts whose
            # manifest, source locator, SHA, size and verifier still match.
            git reset --hard origin/main
            python tools/replay_receipt_publish.py apply "$RECEIPTS"
            python tools/build_replay_compatibility_reasons.py
            python tools/build_catalog_metrics.py
            python tools/build_quarantine_audit.py
            python tools/check_dataset_quality.py --catalog-only
            git add --sparse catalog datasets
            if git diff --cached --quiet; then
              echo "Replay receipts already published on canonical main."
              exit 0
            fi
            git commit -m "data: backfill verified replay compatibility"
            echo "Rebuilt SHA-verified receipts on latest main ($attempt/8)"
            sleep "$attempt"
          done
          echo "::error::Replay verification was not published after 8 bounded attempts"
          exit 1
