name: backfill-replay-compatibility
on:
  workflow_run:
    workflows: [backfill-exact-trade-counts, backfill-global-unique-trade-counts]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/backfill_replay_compatibility.py'
      - 'tools/enforce_safe_replay_invariant.py'
      - 'tools/replay_compatibility.py'
      - 'tools/build_replay_compatibility_reasons.py'
      - 'tools/index_run_manifest.py'
      - 'tests/test_manifest_policy.py'
      - 'tests/test_replay_compatibility.py'
      - 'tests/test_backfill_replay_compatibility_candidates.py'
      - '.github/workflows/backfill-replay-compatibility.yml'
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch:
    inputs:
      per_family_limit:
        description: "Maximum verified assets per priority family group"
        required: false
        default: "1000"

permissions:
  contents: write

concurrency:
  group: dataset-v2-control-plane-index
  cancel-in-progress: false

jobs:
  verify-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main before processing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate replay verifier before catalog mutation
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_replay_compatibility.py \
            tests/test_backfill_replay_compatibility_candidates.py \
            tests/test_manifest_policy.py --tb=line

      - name: Enforce SAFE implies replay-compatible
        run: python tools/enforce_safe_replay_invariant.py

      - name: Test replay qualification rules
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_manifest_policy.py \
            tests/test_replay_compatibility.py \
            tests/test_backfill_replay_compatibility_candidates.py

      - name: Verify immutable assets for replay
        shell: bash
        run: |
          set -euo pipefail
          LIMIT="${{ inputs.per_family_limit || '1000' }}"
          # Trades first: this closes the current multi-million-row replay gap.
          python tools/backfill_replay_compatibility.py             --limit "$LIMIT"             --families "trades,agg_trades,fills,userfills,user_fills"
          python tools/backfill_replay_compatibility.py             --limit "$LIMIT"             --families "copy_vault_fills,copy_vault_l2,copy_vault_positions,copy_vault_selection,copy_vault_snapshot"
          python tools/backfill_replay_compatibility.py             --limit "$LIMIT"             --families "bbo"
          python tools/backfill_replay_compatibility.py             --limit "$LIMIT"             --families "l2book,l2,book"
          # Secondary market context is strict replay-checked in a small, bounded batch.
          # Derived capacity stays PARTIAL until independent parent-L2 proof exists.
          python tools/backfill_replay_compatibility.py             --limit 60             --families "capacity_tape,ticker,mark_price,open_interest,funding,funding_settlement,instrument_metadata,activeassetctx"
          python tools/build_replay_compatibility_reasons.py
          python tools/build_catalog_metrics.py
          python tools/check_dataset_quality.py

      - name: Publish replay-proof progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog datasets
          git diff --cached --quiet && exit 0
          git commit -m "data: backfill verified replay compatibility"
          if git push origin HEAD:main; then
            exit 0
          fi

          # Main advances frequently because collection and catalog workflows
          # publish concurrently. Rebase generated evidence, but never hand-edit
          # a semantic conflict. DATA_METRICS is deterministic and may be safely
          # regenerated from the rebased DATA_INDEX/catalog state.
          git fetch origin main
          if git rebase origin/main; then
            git push origin HEAD:main
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "catalog/DATA_METRICS.json" ]; then
            python tools/build_catalog_metrics.py
            git add catalog/DATA_METRICS.json
            GIT_EDITOR=true git rebase --continue
            git push origin HEAD:main
            exit 0
          fi

          printf 'Unresolved replay publish conflicts:\n%s\n' "${conflicts[*]}" >&2
          git rebase --abort || true
          exit 1
