name: start-unified-collect-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-unified-collect-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: start-unified-collect-once
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Transition unified authority to COLLECT
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python tools/set_phase.py \
            --phase COLLECT \
            --request-id 275cf0a3dbd32426f9046dbbdbf063e36474f2e4190ad36a348f75e185911e8e \
            --requested-by chatgpt-github \
            --cutoff-at-utc 2026-10-01T03:54:27Z
          python tools/phase_gate.py read
      - name: Publish phase and receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/alina-phase.json control/phase-receipts
          git diff --cached --quiet && exit 0
          git commit -m "phase: start unified COLLECT"
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((i*3))"
          done
          exit 1
      - name: Wake COLLECT campaigns
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run create-resumable-campaigns.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run resumable-campaign-controller.yml --repo "$GITHUB_REPOSITORY" --ref main
